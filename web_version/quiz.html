<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="الخطة">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الامتحانات الإلكترونية - منصة الخطة التعليمية</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="motion-fx.css?v=2.0">
    <script src="motion-fx.js?v=2.0" defer></script>
    <style>
        :root {
            --primary: #3B82F6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --primary-dark: #1D4ED8;
            --secondary: #6366F1;
            --accent-cyan: #06B6D4;
            --accent-emerald: #10B981;
            --bg: #070D1E;
            --surface: rgba(15, 23, 42, 0.85);
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --success: #10B981;
            --success-bg: rgba(16, 185, 129, 0.18);
            --danger: #EF4444;
            --danger-bg: rgba(239, 68, 68, 0.18);
            --warning: #F59E0B;
            --border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(16px);
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.15) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.06) 0%, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            font-size: 16px;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Anti-Cheat & Anti-Copy Protection */
        .container, .question-card, .options-grid, .matching-container, #questionText, #explanationText {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
        }

        /* Header */
        .header {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 14px 22px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 50;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            border-bottom: 1px solid var(--border);
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            margin-bottom: 24px;
        }

        .header-title { font-weight: 800; font-size: 18px; color: #FFFFFF; font-family: 'Alexandria', 'Cairo', sans-serif; }
        .back-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: white; width: 40px; height: 40px; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; transition: 0.2s; }
        .back-btn:hover { background: rgba(59, 130, 246, 0.25); color: #60A5FA; }

        .timer-badge {
            background: rgba(15, 23, 42, 0.95);
            border: 1.5px solid rgba(59, 130, 246, 0.45);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4), 0 0 16px rgba(59, 130, 246, 0.3);
            backdrop-filter: var(--glass-blur);
            padding: 8px 22px;
            border-radius: 24px;
            font-weight: 900;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #60A5FA;
            transition: all 0.3s;
        }
        .timer-warning { border-color: var(--warning); color: #FBBF24; box-shadow: 0 0 20px rgba(245, 158, 11, 0.4); }
        .timer-danger { border-color: var(--danger); color: #F87171; box-shadow: 0 0 20px rgba(239, 68, 68, 0.5); animation: blink 1s infinite; }
        @keyframes blink { 50% { opacity: 0.5; } }

        .header-actions { display: flex; gap: 8px; align-items: center; }
        .icon-btn { background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: white; width: 38px; height: 38px; border-radius: 12px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 15px; font-weight: 800; transition: 0.2s; }
        .icon-btn:hover { background: rgba(59,130,246,0.25); color: #60A5FA; }
        
        /* Toggle Switch */
        .feedback-toggle {
            display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 13px;
            background: rgba(30, 41, 59, 0.7); border: 1px solid var(--border); padding: 5px 12px; border-radius: 20px;
        }
        .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #334155; transition: .4s; border-radius: 34px; }
        .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: var(--success); }
        input:checked + .slider:before { transform: translateX(14px); }

        /* Main Content */
        .container { max-width: 820px; margin: 0 auto; padding: 0 16px 110px; }
        
        .progress-container { margin-bottom: 20px; }
        .progress-text { display: flex; justify-content: space-between; font-weight: 800; color: #60A5FA; margin-bottom: 8px; font-size: 13.5px; }
        .progress-bar { height: 8px; background: rgba(30, 41, 59, 0.8); border-radius: 4px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #3B82F6, #6366F1); width: 0%; transition: width 0.3s ease; box-shadow: 0 0 10px rgba(59,130,246,0.6); }

        .question-card {
            background: var(--card-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 24px;
            padding: 28px;
            box-shadow: 0 12px 36px rgba(0,0,0,0.35);
            margin-bottom: 20px;
            border: 1px solid var(--border);
        }

        .question-text { font-size: 1.2em; font-weight: 800; color: #FFFFFF; margin-bottom: 24px; line-height: 1.7; font-family: 'Alexandria', 'Cairo', sans-serif; }

        /* Options */
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .tf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        
        .option-btn {
            background: rgba(30, 41, 59, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            padding: 16px 20px;
            border-radius: 16px;
            text-align: right;
            font-size: 1.05em;
            font-weight: 700;
            color: #F1F5F9;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: 'Cairo', sans-serif;
        }
        .option-btn:hover { border-color: rgba(59, 130, 246, 0.5); background: rgba(59, 130, 246, 0.15); transform: translateX(-3px); color: #FFFFFF; }
        .option-btn.selected { border-color: #3B82F6; border-width: 2px; background: rgba(59, 130, 246, 0.25); box-shadow: 0 0 16px rgba(59, 130, 246, 0.35); color: #FFFFFF; }
        
        .tf-btn { text-align: center; justify-content: center; padding: 18px; font-size: 1.15em; font-weight: 900; }
        .tf-btn.true-btn { background: rgba(16, 185, 129, 0.15); border-color: rgba(16, 185, 129, 0.35); color: #34D399; }
        .tf-btn.false-btn { background: rgba(239, 68, 68, 0.15); border-color: rgba(239, 68, 68, 0.35); color: #F87171; }
        .tf-btn.true-btn:hover { background: rgba(16, 185, 129, 0.28); color: #FFFFFF; }
        .tf-btn.false-btn:hover { background: rgba(239, 68, 68, 0.28); color: #FFFFFF; }

        .correct-btn { background: rgba(16, 185, 129, 0.25) !important; border-color: #10B981 !important; color: #6EE7B7 !important; box-shadow: 0 0 16px rgba(16,185,129,0.3) !important; }
        .wrong-btn { background: rgba(239, 68, 68, 0.25) !important; border-color: #EF4444 !important; color: #FCA5A5 !important; box-shadow: 0 0 16px rgba(239,68,68,0.3) !important; }

        /* Matching Question Styles */
        .matching-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
            margin-top: 15px;
        }
        @media (max-width: 600px) {
            .matching-container { grid-template-columns: 1fr 1fr; gap: 10px; }
        }
        .matching-col {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .matching-item {
            background: rgba(30, 41, 59, 0.6);
            border: 1.5px solid rgba(255, 255, 255, 0.1);
            padding: 14px 16px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 1em;
            color: #F1F5F9;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            min-height: 48px;
            position: relative;
        }
        .matching-item:hover {
            border-color: #3B82F6;
            background: rgba(59, 130, 246, 0.15);
        }
        .matching-item.active-select {
            border-color: #3B82F6;
            background: rgba(59, 130, 246, 0.25);
            box-shadow: 0 0 14px rgba(59, 130, 246, 0.4);
        }
        .matching-item.connected {
            border-color: #8B5CF6;
            background: rgba(139, 92, 246, 0.2);
        }
        .matching-badge {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: #8B5CF6;
            color: white;
            font-weight: 900;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .matching-reset-btn {
            margin-top: 15px;
            background: rgba(30, 41, 59, 0.7);
            color: #CBD5E1;
            border: 1px solid var(--border);
            padding: 8px 16px;
            border-radius: 12px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }
        .matching-reset-btn:hover { background: rgba(59, 130, 246, 0.2); color: #60A5FA; }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -8px 32px rgba(0,0,0,0.45);
            z-index: 50;
            border-top: 1px solid var(--border);
        }

        .nav-btn {
            padding: 12px 22px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 15px;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Cairo', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .nav-btn.primary { background: linear-gradient(135deg, #2563EB, #1D4ED8); color: white; box-shadow: 0 4px 14px rgba(37,99,235,0.4); }
        .nav-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(37,99,235,0.6); }
        .nav-btn.secondary { background: rgba(30, 41, 59, 0.8); color: #E2E8F0; border: 1px solid var(--border); }
        .nav-btn.secondary:hover { background: rgba(59, 130, 246, 0.2); color: #60A5FA; }
        .nav-btn.danger { background: rgba(239, 68, 68, 0.2); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.4); }
        .nav-btn.danger:hover { background: #EF4444; color: white; }
        .nav-btn.warning { background: rgba(245, 158, 11, 0.18); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.35); }
        .nav-btn.warning:hover { background: #D97706; color: white; }
        .nav-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Explanation */
        .explanation-card {
            background: rgba(245, 158, 11, 0.12);
            border: 1px solid rgba(245, 158, 11, 0.3);
            padding: 16px 20px;
            border-radius: 16px;
            margin-top: 20px;
            display: none;
            color: #FEF08A;
        }
        .explanation-title { color: #FBBF24; font-weight: 900; margin-bottom: 8px; font-size: 14px; display: flex; align-items: center; gap: 6px; }

        /* Grid Drawer */
        .drawer-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(7, 13, 30, 0.75);
            backdrop-filter: blur(8px);
            z-index: 100;
            display: none;
            opacity: 0; transition: 0.3s;
        }
        .drawer {
            position: fixed; bottom: -100%; left: 0; right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--border);
            border-top-left-radius: 28px; border-top-right-radius: 28px;
            padding: 24px 20px 30px;
            z-index: 101;
            transition: 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 80vh; overflow-y: auto;
            box-shadow: 0 -15px 40px rgba(0,0,0,0.6);
        }
        .drawer.open { bottom: 0; }
        .drawer-overlay.open { display: block; opacity: 1; }
        
        .drawer-title { font-weight: 900; font-size: 18px; margin-bottom: 15px; text-align: center; color: #FFFFFF; font-family: 'Alexandria', 'Cairo'; }
        .q-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 10px; }
        .q-grid-btn {
            width: 100%; aspect-ratio: 1;
            border-radius: 14px;
            border: 1px solid var(--border);
            background: rgba(30, 41, 59, 0.7);
            color: #CBD5E1;
            font-weight: 800; font-size: 15px;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            transition: all 0.2s;
        }
        .q-grid-btn.answered { background: #2563EB; color: white; border-color: #3B82F6; box-shadow: 0 0 10px rgba(37,99,235,0.4); }
        .q-grid-btn.bookmarked { background: #D97706; color: white; border-color: #F59E0B; box-shadow: 0 0 10px rgba(245,158,11,0.4); }
        .q-grid-btn.current { border: 2px solid #8B5CF6; box-shadow: 0 0 12px rgba(139,92,246,0.6); }

        /* Submission Dialog */
        .modal {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border);
            padding: 30px; border-radius: 24px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            z-index: 200; display: none; width: 90%; max-width: 400px; text-align: center;
        }
        .modal-title { font-weight: 900; font-size: 22px; color: #F87171; margin-bottom: 15px; font-family: 'Alexandria', 'Cairo'; }
        .modal-desc { font-weight: 700; color: #CBD5E1; margin-bottom: 25px; line-height: 1.6; }
        
        /* Loading Overlay */
        .loading-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: #070D1E; z-index: 999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .loader { border: 4px solid rgba(255,255,255,0.1); border-top: 4px solid #3B82F6; border-radius: 50%; width: 48px; height: 48px; animation: spin 1s linear infinite; box-shadow: 0 0 15px rgba(59,130,246,0.5); }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @media (max-width: 640px) {
            html, body {
                overflow-x: hidden !important;
                width: 100%;
                max-width: 100vw;
            }
            .header {
                padding: 10px 14px;
                border-radius: 0 0 20px 20px;
                margin-bottom: 16px;
            }
            .header-title {
                font-size: 14px;
                max-width: 110px;
                overflow: hidden;
                text-overflow: ellipsis;
                white-space: nowrap;
            }
            .header-actions {
                gap: 4px;
            }
            .icon-btn, .back-btn {
                width: 34px;
                height: 34px;
                font-size: 14px;
                border-radius: 10px;
            }
            .feedback-toggle {
                padding: 4px 8px;
                font-size: 12px;
                gap: 4px;
            }
            .timer-badge {
                font-size: 14px;
                padding: 6px 14px;
            }
            .container {
                padding: 0 10px 85px;
                width: 100%;
                max-width: 100%;
                box-sizing: border-box;
            }
            .question-card {
                padding: 18px 14px;
                border-radius: 20px;
            }
            .question-text {
                font-size: 1.05em;
                margin-bottom: 16px;
            }
            .option-btn {
                padding: 12px 14px;
                font-size: 0.96em;
                border-radius: 12px;
            }
            .bottom-nav {
                padding: 10px 12px;
                gap: 6px;
            }
            .nav-btn {
                padding: 10px 8px;
                font-size: 12.5px;
                border-radius: 10px;
                flex: 1;
                justify-content: center;
                gap: 4px;
            }
        }
    </style>
</head>
<body>

    <!-- Loading -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader"></div>
        <div style="margin-top: 15px; font-weight: 800; color: var(--primary);">جاري تجهيز الامتحان...</div>
    </div>

    <!-- Header -->
    <header class="header">
        <button class="back-btn" onclick="history.back()">🔙</button>
        <div class="header-title" id="headerTitle">امتحان</div>
        <div class="header-actions">
            <label class="feedback-toggle" title="تصحيح فوري">
                <span style="display:none;" id="feedbackText">فوري</span>
                <div class="switch">
                    <input type="checkbox" id="instantFeedbackToggle" checked onchange="toggleInstantFeedback()">
                    <span class="slider"></span>
                </div>
                ✨
            </label>
            <button class="icon-btn" onclick="toggleDrawer()">🔢</button>
            <button class="icon-btn" onclick="changeFontSize(1)">A+</button>
            <button class="icon-btn" onclick="changeFontSize(-1)">A-</button>
        </div>
    </header>

    <div style="display: flex; justify-content: center; margin-top: -30px; margin-bottom: 20px; position: relative; z-index: 60;">
        <div id="timer" class="timer-badge">⏳ 00:00</div>
    </div>

    <!-- Quiz Area -->
    <div class="container" id="quizContainer" style="display: none;">
        <div class="progress-container">
            <div class="progress-text">
                <span id="qCountText">سؤال 1 من 10</span>
                <span style="color: var(--warning);">⭐ درجة واحدة</span>
            </div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
        </div>

        <div class="question-card">
            <div class="question-text" id="questionText">...</div>
            <div id="optionsContainer" class="options-grid"></div>
            
            <div id="explanationBox" class="explanation-card">
                <div class="explanation-title">💡 التصويب / التفسير</div>
                <div id="explanationText" style="font-weight: 700; line-height: 1.6;"></div>
            </div>
        </div>
        
        <!-- Essay Answer Area -->
        <div id="essayArea" style="display: none; margin-bottom: 20px;">
            <textarea id="essayInput" rows="5" style="width: 100%; padding: 15px; border-radius: 12px; border: 2px solid var(--border); font-family: inherit; font-size: 16px; font-weight: 700; resize: vertical;" placeholder="اكتب إجابتك هنا..."></textarea>
        </div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav" id="bottomNav" style="display: none;">
        <button class="nav-btn secondary" id="prevBtn" onclick="prevQuestion()">◀️ السابق</button>
        <button class="nav-btn warning" id="bookmarkBtn" onclick="toggleBookmark()">🚩 تأجيل</button>
        <button class="nav-btn primary" id="nextBtn" onclick="nextQuestion()">التالي ▶️</button>
        <button class="nav-btn danger" id="finishBtn" style="display: none;" onclick="promptSubmit()">🏁 إنهاء</button>
    </div>

    <!-- Drawer -->
    <div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
        <div class="drawer-title">لوحة الأسئلة السريعة</div>
        <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 20px; font-weight: 700; font-size: 14px;">
            <span style="color: var(--success);">🟢 تمت الإجابة</span>
            <span style="color: var(--text-sub);">⚪ لم يُحل</span>
            <span style="color: var(--warning);">🟡 مؤجل</span>
        </div>
        <div class="q-grid" id="qGrid"></div>
    </div>

    <!-- Submit Modal -->
    <div class="modal" id="submitModal">
        <div class="modal-title">تأكيد التسليم ⚠️</div>
        <div class="modal-desc" id="submitDesc">أجبت على 0 من أصل 0 سؤالاً. متبقي 0.</div>
        <div style="display: flex; gap: 10px; justify-content: center;">
            <button class="nav-btn secondary" onclick="document.getElementById('submitModal').style.display='none'">تراجع</button>
            <button class="nav-btn danger" onclick="finishQuiz()">تأكيد الإنهاء</button>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        // State
        let questions = [];
        let currentIndex = 0;
        let timerSeconds = 3600;
        let timerInterval = null;
        let userAnswers = {}; // index -> { answered: bool, correct: bool, selectedIdx: int, text: str }
        let bookmarks = {};   // index -> bool
        let isInstantFeedback = true;
        
        window.sessionMistakes = [];
        let pendingEssays = [];
        
        const urlParams = new URLSearchParams(window.location.search);
        const subjectName = urlParams.get('subject') || 'مادة غير محددة';
        const examId = urlParams.get('examId');
        window.currentExamId = examId;
        
        document.getElementById('headerTitle').textContent = examId || subjectName;

        // Font Resize
        let currentFontSize = 16;
        function changeFontSize(dir) {
            currentFontSize += dir * 2;
            if(currentFontSize < 12) currentFontSize = 12;
            if(currentFontSize > 24) currentFontSize = 24;
            document.body.style.fontSize = currentFontSize + 'px';
        }

        function toggleInstantFeedback() {
            isInstantFeedback = document.getElementById('instantFeedbackToggle').checked;
            showQuestion(); // Re-render to show/hide colors if already answered
        }

        // Fetch Questions
        async function fetchQuestions() {
            try {
                if(urlParams.get('fromStorage') === 'true') {
                    const stored = sessionStorage.getItem('currentExamData');
                    if(stored) {
                        try {
                            let parsed = JSON.parse(stored);
                            if(typeof parsed === 'string') parsed = JSON.parse(parsed); // Just in case it was double-stringified
                            let rawList = Array.isArray(parsed) ? parsed : Object.values(parsed);
                            questions = rawList.filter(q => q && (q.text || q.question)).map((q, idx) => {
                                let cIdx = q.correct;
                                if (cIdx === undefined && q.correctAnswerIndex !== undefined) cIdx = q.correctAnswerIndex;
                                if (cIdx === undefined && q.answer !== undefined && typeof q.answer === 'number') cIdx = q.answer;
                                if (cIdx === undefined && q.correctAnswer !== undefined && q.options) {
                                    const foundOpt = q.options.indexOf(q.correctAnswer);
                                    if (foundOpt !== -1) cIdx = foundOpt;
                                }
                                return {
                                    ...q,
                                    text: q.text || q.question || '',
                                    correct: (cIdx !== undefined && cIdx !== -1) ? parseInt(cIdx) : 0,
                                    options: q.options || [],
                                    type: q.type || ((q.options && q.options.length > 0) ? 'mcq' : (q.pairs ? 'matching' : 'essay')),
                                    explanation: q.explanation || q.modelAnswer || ''
                                };
                            });
                        } catch(e) {
                            console.error("Error parsing stored exam:", e);
                        }
                    }
                } else if(examId) {
                    const snap = await database.ref(`Exams/${subjectName}/${examId}/questions`).once('value');
                    if(snap.exists()) {
                        let data = snap.val();
                        let rawList = Array.isArray(data) ? data : Object.values(data);
                        questions = rawList.filter(q => q && (q.text || q.question)).map((q, idx) => {
                            let cIdx = q.correct;
                            if (cIdx === undefined && q.correctAnswerIndex !== undefined) cIdx = q.correctAnswerIndex;
                            if (cIdx === undefined && q.answer !== undefined && typeof q.answer === 'number') cIdx = q.answer;
                            if (cIdx === undefined && q.correctAnswer !== undefined && q.options) {
                                const foundOpt = q.options.indexOf(q.correctAnswer);
                                if (foundOpt !== -1) cIdx = foundOpt;
                            }
                            return {
                                ...q,
                                text: q.text || q.question || '',
                                correct: (cIdx !== undefined && cIdx !== -1) ? parseInt(cIdx) : 0,
                                options: q.options || [],
                                type: q.type || ((q.options && q.options.length > 0) ? 'mcq' : (q.pairs ? 'matching' : 'essay')),
                                explanation: q.explanation || q.modelAnswer || ''
                            };
                        });
                    }
                } else if(urlParams.get('mode') === 'subject_revision') {
                    // Fetch random subject questions
                    const snap = await database.ref(`QuestionsBank/${subjectName}`).once('value');
                    if(snap.exists()) {
                        let allQ = Object.values(snap.val());
                        allQ = allQ.sort(() => 0.5 - Math.random());
                        questions = allQ.slice(0, 50);
                    }
                }
                
                if(questions.length === 0) {
                    alert("لم يتم العثور على أسئلة!");
                    history.back();
                    return;
                }
                
                // Shuffle questions option if needed
                
                // Extract essays
                questions.forEach((q, i) => {
                    if(q.type === 'essay') pendingEssays.push({ ...q, index: i });
                });

                document.getElementById('loadingOverlay').style.display = 'none';
                document.getElementById('quizContainer').style.display = 'block';
                document.getElementById('bottomNav').style.display = 'flex';
                
                const user = JSON.parse(localStorage.getItem('user'));
                if(user && user.studentCode) {
                    try {
                        const logRef = database.ref('ActivityLogs').push();
                        logRef.set({
                            studentCode: user.studentCode,
                            studentName: user.fullName || user.name || 'طالب',
                            action: 'بدء امتحان 📝',
                            details: `بدأ حل أسئلة امتحان: (${examId || subjectName}) في مادة (${subjectName})`,
                            userAgent: navigator.userAgent || '',
                            timestamp: firebase.database.ServerValue.TIMESTAMP
                        });
                    } catch(e){}
                }

                buildGrid();
                startTimer();
                showQuestion();

            } catch (e) {
                console.error(e);
                alert("خطأ في جلب الأسئلة");
            }
        }

        // Timer
        function startTimer() {
            const timerEl = document.getElementById('timer');
            timerInterval = setInterval(() => {
                timerSeconds--;
                let m = Math.floor(timerSeconds / 60);
                let s = timerSeconds % 60;
                timerEl.textContent = `⏳ ${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
                
                if (timerSeconds <= 300) { // Last 5 mins
                    timerEl.className = 'timer-badge timer-danger';
                } else if (timerSeconds <= 600) { // Last 10 mins
                    timerEl.className = 'timer-badge timer-warning';
                }

                if (timerSeconds <= 0) {
                    clearInterval(timerInterval);
                    finishQuiz(); // Auto submit
                }
            }, 1000);
        }

        function showQuestion() {
            const q = questions[currentIndex];
            document.getElementById('qCountText').textContent = `سؤال ${currentIndex + 1} من ${questions.length}`;
            document.getElementById('progressFill').style.width = `${((currentIndex + 1) / questions.length) * 100}%`;
            
            const qText = document.getElementById('questionText');
            qText.textContent = q.text;

            const optContainer = document.getElementById('optionsContainer');
            const expBox = document.getElementById('explanationBox');
            const essayArea = document.getElementById('essayArea');
            const essayInput = document.getElementById('essayInput');
            
            optContainer.innerHTML = "";
            expBox.style.display = "none";
            essayArea.style.display = "none";
            
            let isAnswered = userAnswers[currentIndex]?.answered;
            
            // Render buttons based on question type
            if (q.type === 'essay') {
                essayArea.style.display = "block";
                essayInput.value = userAnswers[currentIndex]?.text || "";
                essayInput.onchange = (e) => {
                    userAnswers[currentIndex] = { answered: true, text: e.target.value };
                    updateGridBtn(currentIndex);
                };
            } 
            else if (q.options && q.options.length === 2 && (q.options.includes('صح') || q.options.includes('صواب') || q.options.includes('خطأ'))) {
                // True / False mode
                optContainer.className = "options-grid tf-grid";
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `option-btn tf-btn ${opt.includes('صح') || opt.includes('صواب') ? 'true-btn' : 'false-btn'}`;
                    btn.textContent = opt;
                    if(isAnswered) {
                        btn.disabled = true;
                        if(idx === userAnswers[currentIndex].selectedIdx) {
                            btn.classList.add('selected');
                            if(isInstantFeedback) {
                                if(userAnswers[currentIndex].correct) {
                                    btn.classList.add('correct-btn');
                                    btn.innerHTML += ' <span>✅</span>';
                                } else {
                                    btn.classList.add('wrong-btn');
                                    btn.innerHTML += ' <span>❌</span>';
                                }
                            } else {
                                btn.innerHTML += ' <span>🔵</span>';
                            }
                        } else if (isInstantFeedback && idx === q.correct) {
                            btn.classList.add('correct-btn'); // Show correct answer
                        }
                    } else {
                        btn.onclick = () => selectAnswer(idx);
                    }
                    optContainer.appendChild(btn);
                });
            } 
            else if (q.type === 'matching' || q.pairs) {
                renderMatchingQuestion(q, optContainer, isAnswered);
            }
            else if (q.options) {
                // MCQ mode
                optContainer.className = "options-grid";
                q.options.forEach((opt, idx) => {
                    const btn = document.createElement('button');
                    btn.className = "option-btn";
                    btn.textContent = opt;
                    if(isAnswered) {
                        btn.disabled = true;
                        if(idx === userAnswers[currentIndex].selectedIdx) {
                            btn.classList.add('selected');
                            if(isInstantFeedback) {
                                if(userAnswers[currentIndex].correct) {
                                    btn.classList.add('correct-btn');
                                    btn.innerHTML += ' <span>✅</span>';
                                } else {
                                    btn.classList.add('wrong-btn');
                                    btn.innerHTML += ' <span>❌</span>';
                                }
                            } else {
                                btn.innerHTML += ' <span>🔵</span>';
                            }
                        } else if (isInstantFeedback && idx === q.correct) {
                            btn.classList.add('correct-btn');
                        }
                    } else {
                        btn.onclick = () => selectAnswer(idx);
                    }
                    optContainer.appendChild(btn);
                });
            }

            // Show explanation if answered and instant feedback is on
            if(isAnswered && isInstantFeedback && q.explanation) {
                expBox.style.display = "block";
                // [SECURITY] تنقية explanation من Firebase قبل وضعها في innerHTML
                const rawExp = (typeof SecurityValidator !== 'undefined')
                    ? SecurityValidator.sanitizeHTML(q.explanation)
                    : q.explanation.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
                document.getElementById('explanationText').innerHTML = rawExp.replace(/\*\*(.*?)\*\*/g, '<b style="color:var(--primary);">$1</b>');
            }

            // Update Nav Buttons
            document.getElementById('prevBtn').disabled = currentIndex === 0;
            if(currentIndex === questions.length - 1) {
                document.getElementById('nextBtn').style.display = 'none';
                document.getElementById('finishBtn').style.display = 'flex';
            } else {
                document.getElementById('nextBtn').style.display = 'flex';
                document.getElementById('finishBtn').style.display = 'none';
            }
            
            // Bookmark btn state
            const bBtn = document.getElementById('bookmarkBtn');
            if(bookmarks[currentIndex]) {
                bBtn.innerHTML = '🚩 إلغاء التأجيل';
                bBtn.classList.replace('warning', 'secondary');
            } else {
                bBtn.innerHTML = '🚩 تأجيل';
                bBtn.classList.replace('secondary', 'warning');
            }
            updateGridBtn(currentIndex); // Highlight current in grid
        }

        let activeMatchingLeft = null;
        let activeMatchingRight = null;

        function renderMatchingQuestion(q, container, isAnswered) {
            container.className = "";
            container.innerHTML = ""; // Clear existing grid to avoid duplicate stacking
            const pairs = q.pairs || [];
            
            if(!q._shuffledRights) {
                q._shuffledRights = pairs.map(p => p.right).sort(() => 0.5 - Math.random());
            }

            const currentMatches = userAnswers[currentIndex]?.matches || {};

            const matchingDiv = document.createElement('div');
            matchingDiv.className = "matching-container";

            const leftCol = document.createElement('div');
            leftCol.className = "matching-col";

            const rightCol = document.createElement('div');
            rightCol.className = "matching-col";

            const colors = ['#6366f1', '#ec4899', '#f59e0b', '#10b981', '#8b5cf6', '#06b6d4', '#f97316'];

            // Left Column (Questions / Keys)
            pairs.forEach((p) => {
                const item = document.createElement('div');
                item.className = "matching-item";
                const isMatched = currentMatches[p.left] !== undefined;
                const matchIndex = isMatched ? Object.keys(currentMatches).indexOf(p.left) : -1;
                const matchColor = matchIndex >= 0 ? colors[matchIndex % colors.length] : null;

                if (isMatched) {
                    item.classList.add('connected');
                    if (isAnswered && isInstantFeedback) {
                        const isCorrect = currentMatches[p.left] === p.right;
                        item.style.borderColor = isCorrect ? '#22c55e' : '#ef4444';
                        item.style.background = isCorrect ? '#dcfce7' : '#fee2e2';
                    } else {
                        item.style.borderColor = matchColor;
                        item.style.background = matchColor + '18';
                    }
                }

                if (activeMatchingLeft === p.left) {
                    item.classList.add('active-select');
                }

                item.innerHTML = `
                    <span>${p.left}</span>
                    ${isMatched ? `<span class="matching-badge" style="background:${(isAnswered && isInstantFeedback) ? (currentMatches[p.left] === p.right ? '#22c55e' : '#ef4444') : matchColor}">${matchIndex + 1}</span>` : ''}
                `;

                if (!isAnswered) {
                    item.onclick = () => {
                        if (activeMatchingRight) {
                            // Match with previously selected right
                            currentMatches[p.left] = activeMatchingRight;
                            activeMatchingLeft = null;
                            activeMatchingRight = null;
                            handleMatchingUpdated(q, container, currentMatches);
                        } else {
                            // Toggle left selection
                            activeMatchingLeft = (activeMatchingLeft === p.left) ? null : p.left;
                            renderMatchingQuestion(q, container, isAnswered);
                        }
                    };
                }
                leftCol.appendChild(item);
            });

            // Right Column (Answers / Values)
            q._shuffledRights.forEach((rightVal) => {
                const item = document.createElement('div');
                item.className = "matching-item";
                
                const matchedLeft = Object.keys(currentMatches).find(l => currentMatches[l] === rightVal);
                const isMatched = matchedLeft !== undefined;
                const matchIndex = isMatched ? Object.keys(currentMatches).indexOf(matchedLeft) : -1;
                const matchColor = matchIndex >= 0 ? colors[matchIndex % colors.length] : null;

                if (isMatched) {
                    item.classList.add('connected');
                    if (isAnswered && isInstantFeedback) {
                        const correctPair = pairs.find(p => p.left === matchedLeft);
                        const isCorrect = correctPair && correctPair.right === rightVal;
                        item.style.borderColor = isCorrect ? '#22c55e' : '#ef4444';
                        item.style.background = isCorrect ? '#dcfce7' : '#fee2e2';
                    } else {
                        item.style.borderColor = matchColor;
                        item.style.background = matchColor + '18';
                    }
                }

                if (activeMatchingRight === rightVal) {
                    item.classList.add('active-select');
                }

                item.innerHTML = `
                    <span>${rightVal}</span>
                    ${isMatched ? `<span class="matching-badge" style="background:${(isAnswered && isInstantFeedback) ? ((pairs.find(p => p.left === matchedLeft)?.right === rightVal) ? '#22c55e' : '#ef4444') : matchColor}">${matchIndex + 1}</span>` : ''}
                `;

                if (!isAnswered) {
                    item.onclick = () => {
                        if (activeMatchingLeft) {
                            // Match with previously selected left
                            currentMatches[activeMatchingLeft] = rightVal;
                            activeMatchingLeft = null;
                            activeMatchingRight = null;
                            handleMatchingUpdated(q, container, currentMatches);
                        } else {
                            // Toggle right selection
                            activeMatchingRight = (activeMatchingRight === rightVal) ? null : rightVal;
                            renderMatchingQuestion(q, container, isAnswered);
                        }
                    };
                }
                rightCol.appendChild(item);
            });

            matchingDiv.appendChild(leftCol);
            matchingDiv.appendChild(rightCol);
            container.appendChild(matchingDiv);

            // Add Reset Button if not finalized
            if (!isAnswered && Object.keys(currentMatches).length > 0) {
                const resetBtn = document.createElement('button');
                resetBtn.className = "matching-reset-btn";
                resetBtn.innerHTML = "🔄 مسح التوصيل وإعادة المحاولة";
                resetBtn.onclick = () => {
                    activeMatchingLeft = null;
                    activeMatchingRight = null;
                    if (userAnswers[currentIndex]) {
                        userAnswers[currentIndex].matches = {};
                    }
                    renderMatchingQuestion(q, container, isAnswered);
                };
                container.appendChild(resetBtn);
            }
        }

        function handleMatchingUpdated(q, container, currentMatches) {
            const pairs = q.pairs || [];
            if(!userAnswers[currentIndex]) {
                userAnswers[currentIndex] = { answered: false, matches: {} };
            }
            userAnswers[currentIndex].matches = currentMatches;

            // When all pairs are connected
            if (Object.keys(currentMatches).length === pairs.length) {
                const isAllCorrect = pairs.every(p => currentMatches[p.left] === p.right);
                userAnswers[currentIndex].answered = true;
                userAnswers[currentIndex].correct = isAllCorrect;

                const user = JSON.parse(localStorage.getItem('user') || '{}');
                const stCode = (user.studentCode || user.code || 'KH_TEMP').trim();
                const safeStCode = stCode.replace(/[.#$\[\]]/g, '_');
                const stName = user.fullName || user.name || 'طالب';
                const stPhone = user.whatsapp || user.phone || user.phoneNumber || '';

                if (!isAllCorrect) {
                    window.sessionMistakes.push({
                        questionNumber: currentIndex + 1,
                        text: q.text,
                        correctAnswer: pairs.map(p => `• ${p.left} ➔ ${p.right}`).join('<br>'),
                        wrongAnswer: Object.entries(currentMatches).map(([l, r]) => `• ${l} ➔ ${r}`).join('<br>'),
                        explanation: q.explanation || ''
                    });

                    try {
                        const qRef = database.ref(`ExamAnalytics/${subjectName}/${examId || 'general'}/${q.id || currentIndex}`);
                        qRef.child('questionText').set(q.text);
                        qRef.child('totalMistakes').set(firebase.database.ServerValue.increment(1));
                        qRef.child(`wrongStudents/${safeStCode}`).set({
                            studentCode: stCode,
                            name: stName,
                            phone: stPhone,
                            chosen: Object.entries(currentMatches).map(([l, r]) => `${l}➔${r}`).join(', '),
                            timestamp: firebase.database.ServerValue.TIMESTAMP
                        });
                    } catch(e) {}
                }
                showQuestion();
                updateGridBtn(currentIndex);
                return;
            }
            renderMatchingQuestion(q, container, false);
        }

        function selectAnswer(idx) {
            const q = questions[currentIndex];
            const isCorrect = idx === q.correct;
            
            userAnswers[currentIndex] = {
                answered: true,
                correct: isCorrect,
                selectedIdx: idx
            };

            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const stCode = (user.studentCode || user.code || 'KH_TEMP').trim();
            const safeStCode = stCode.replace(/[.#$\[\]]/g, '_');
            const stName = user.fullName || user.name || 'طالب';
            const stPhone = user.whatsapp || user.phone || user.phoneNumber || '';
            
            // Log analytics securely with student name & code
            try {
                const qRef = database.ref(`ExamAnalytics/${subjectName}/${examId || 'general'}/${q.id || currentIndex}`);
                qRef.child('questionText').set(q.text);
                if (q.options && q.options[q.correct]) {
                    qRef.child('correctAnswer').set(q.options[q.correct]);
                }
                if (q.explanation) {
                    qRef.child('explanation').set(q.explanation);
                }
                if(!isCorrect) {
                    qRef.child('totalMistakes').set(firebase.database.ServerValue.increment(1));
                    const safeChosen = (q.options ? q.options[idx] || 'unknown' : 'unknown').replace(/[.#$\[\]]/g, '_');
                    qRef.child(`choices/${safeChosen}`).set(firebase.database.ServerValue.increment(1));
                    
                    // Record student details
                    qRef.child(`wrongStudents/${safeStCode}`).set({
                        studentCode: stCode,
                        name: stName,
                        phone: stPhone,
                        chosen: q.options ? (q.options[idx] || 'غير محدد') : 'غير محدد',
                        timestamp: firebase.database.ServerValue.TIMESTAMP
                    });
                }
            } catch(e) {}

            // Store in session mistakes if wrong
            if(!isCorrect) {
                window.sessionMistakes.push({
                    questionNumber: currentIndex + 1,
                    text: q.text,
                    correctAnswer: (q.options && q.options[q.correct]) || 'غير محدد',
                    wrongAnswer: (q.options && q.options[idx]) || 'غير محدد',
                    explanation: q.explanation || ''
                });
                
                // Add to global mistakes for learning record
                try {
                    let mistakes = JSON.parse(localStorage.getItem('mistakes_list') || '[]');
                    if (!mistakes.some(m => m.text === q.text)) {
                        mistakes.push({ ...q, questionText: q.text, subjectName, examId });
                        localStorage.setItem('mistakes_list', JSON.stringify(mistakes));
                    }
                } catch(e){}
            }

            // Immediately show feedback
            showQuestion();
            updateGridBtn(currentIndex);
        }

        // Nav
        function nextQuestion() { if(currentIndex < questions.length - 1) { currentIndex++; showQuestion(); } }
        function prevQuestion() { if(currentIndex > 0) { currentIndex--; showQuestion(); } }
        
        function toggleBookmark() {
            bookmarks[currentIndex] = !bookmarks[currentIndex];
            showQuestion();
            updateGridBtn(currentIndex);
        }

        // Drawer
        function buildGrid() {
            const grid = document.getElementById('qGrid');
            grid.innerHTML = "";
            questions.forEach((_, i) => {
                const btn = document.createElement('button');
                btn.className = 'q-grid-btn';
                btn.id = `qGridBtn_${i}`;
                btn.textContent = i + 1;
                btn.onclick = () => {
                    currentIndex = i;
                    toggleDrawer();
                    showQuestion();
                };
                grid.appendChild(btn);
            });
        }
        
        function updateGridBtn(idx) {
            const btn = document.getElementById(`qGridBtn_${idx}`);
            if(!btn) return;
            btn.className = 'q-grid-btn';
            if(idx === currentIndex) btn.classList.add('current');
            
            if(bookmarks[idx]) btn.classList.add('bookmarked');
            else if(userAnswers[idx]?.answered) btn.classList.add('answered');
        }

        function toggleDrawer() {
            const drw = document.getElementById('drawer');
            const ovr = document.getElementById('drawerOverlay');
            drw.classList.toggle('open');
            ovr.classList.toggle('open');
        }

        // Submit
        function promptSubmit() {
            const answeredCount = Object.keys(userAnswers).length;
            const remaining = questions.length - answeredCount;
            document.getElementById('submitDesc').textContent = `أجبت على ${answeredCount} من أصل ${questions.length} سؤالاً. متبقي ${remaining}.`;
            document.getElementById('submitModal').style.display = 'block';
        }
        // Output detailed report & complete model answer (Bubble Sheet + Essay)
        function showDetailedReport(correctCount, wrongCount, totalAuto) {
            document.body.innerHTML = ''; // Clear quiz view
            const pendingEssays = [];
            questions.forEach((q, i) => {
                if (q.type === 'essay') {
                    pendingEssays.push({ ...q, index: i });
                }
            });
            
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const studentName = user.fullName || 'طالب';
            const examTitle = examId || subjectName;
            const pct = totalAuto > 0 ? Math.round((correctCount / totalAuto) * 100) : 0;
            
            const reportDiv = document.createElement('div');
            reportDiv.style.cssText = 'max-width: 900px; margin: 20px auto 50px; background: #FAF9F6; border-radius: 28px; padding: 35px 25px; box-shadow: 0 15px 45px rgba(0,0,0,0.08); color: #1E293B; font-family: "Cairo", sans-serif; direction: rtl;';
            
            let badgeBg = pct >= 85 ? 'linear-gradient(135deg, #10B981, #059669)' : (pct >= 50 ? 'linear-gradient(135deg, #F59E0B, #D97706)' : 'linear-gradient(135deg, #EF4444, #DC2626)');
            let ratingMsg = pct >= 85 ? 'ممتاز جداً! أداء رائع ومتميز 🌟' : (pct >= 50 ? 'أحسنت! اجتزت الامتحان بنجاح 👍' : 'تحتاج لمراجعة الدرس وحل أخطائك مرة أخرى 💪');

            let html = `
                <!-- Header Card -->
                <div style="text-align: center; margin-bottom: 30px;">
                    <div style="font-size: 55px; margin-bottom: 8px;">🏆</div>
                    <h1 style="font-weight: 900; font-size: 28px; color: #1E3A8A; margin-bottom: 4px;">نموذج الإجابة وتقرير الامتحان</h1>
                    <p style="font-weight: 700; color: #64748B; font-size: 15px;">منصة الخطة التعليمية — مراجعة وتصحيح تفصيلي شامل</p>
                    
                    <div style="width: 130px; height: 130px; border-radius: 50%; display: flex; flex-direction: column; align-items: center; justify-content: center; margin: 25px auto 15px; background: ${badgeBg}; color: white; box-shadow: 0 8px 25px rgba(0,0,0,0.15);">
                        <div style="font-size: 32px; font-weight: 900;">${totalAuto === 0 ? '📝' : pct + '%'}</div>
                        <div style="font-size: 13px; font-weight: 700; opacity: 0.95;">الدرجة النهائية</div>
                    </div>
                    <div style="font-size: 16px; font-weight: 800; color: #334155;">${ratingMsg}</div>
                </div>

                <!-- Info Grid -->
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; background: white; padding: 20px; border-radius: 20px; border: 1px solid #E2E8F0; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.03);">
                    <div><span style="color:#64748B; font-size:13px; display:block;">👤 الطالب:</span><strong style="color:#1E293B; font-size:16px;">${studentName}</strong></div>
                    <div><span style="color:#64748B; font-size:13px; display:block;">📖 المادة:</span><strong style="color:#1E293B; font-size:16px;">${subjectName}</strong></div>
                    <div><span style="color:#64748B; font-size:13px; display:block;">📝 الامتحان:</span><strong style="color:#1E293B; font-size:16px;">${examTitle}</strong></div>
                    <div><span style="color:#64748B; font-size:13px; display:block;">✅ الإجابات الصحيحة:</span><strong style="color:#16A34A; font-size:16px;">${correctCount} من أصل ${totalAuto}</strong></div>
                    <div><span style="color:#64748B; font-size:13px; display:block;">❌ عدد الأخطاء:</span><strong style="color:#DC2626; font-size:16px;">${wrongCount}</strong></div>
                </div>

                <!-- Filter View Tabs -->
                <div style="display: flex; gap: 10px; margin-bottom: 25px; flex-wrap: wrap;">
                    <button id="tabAll" onclick="filterReportView('all')" style="padding: 10px 20px; border-radius: 12px; border: none; background: #1E3A8A; color: white; font-weight: 800; font-family: inherit; font-size: 14px; cursor: pointer;">📋 كل الأسئلة (${questions.length})</button>
                    <button id="tabWrong" onclick="filterReportView('wrong')" style="padding: 10px 20px; border-radius: 12px; border: 1px solid #E2E8F0; background: white; color: #DC2626; font-weight: 800; font-family: inherit; font-size: 14px; cursor: pointer;">❌ الأخطاء فقط (${wrongCount})</button>
                    <button id="tabEssay" onclick="filterReportView('essay')" style="padding: 10px 20px; border-radius: 12px; border: 1px solid #E2E8F0; background: white; color: #2563EB; font-weight: 800; font-family: inherit; font-size: 14px; cursor: pointer;">✍️ الأسئلة المقالية (${pendingEssays.length})</button>
                    <button onclick="location.href='ai-report.html'" style="padding: 10px 20px; border-radius: 12px; border: none; background: linear-gradient(135deg, #7C3AED, #6366F1); color: white; font-weight: 800; font-family: inherit; font-size: 14px; cursor: pointer; margin-right: auto;">🧠 تقرير نقاط القوة والضعف</button>
                </div>

                <!-- SECTION 1: Bubble Sheet & Objective Questions -->
                <div id="sectionObjective">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                        <div style="width: 6px; height: 24px; background: #4F46E5; border-radius: 4px;"></div>
                        <h2 style="color: #1E293B; font-size: 20px; font-weight: 900; margin: 0;">🔘 تصحيح ونموذج إجابة البابل شيت (الاختياري والتوصيل)</h2>
                    </div>
                    <div style="display: flex; flex-direction: column; gap: 20px;" id="objectiveList">
            `;

            questions.forEach((q, idx) => {
                if (q.type === 'essay') return;

                const ansObj = userAnswers[idx];
                const isAnswered = ansObj && ansObj.answered;
                const isCorrect = ansObj && ansObj.correct;

                let statusBadge = isCorrect 
                    ? `<span style="background:#DCFCE7; color:#166534; padding:4px 12px; border-radius:8px; font-weight:800; font-size:13px;">✅ إجابة صحيحة</span>`
                    : (isAnswered 
                        ? `<span style="background:#FEE2E2; color:#991B1B; padding:4px 12px; border-radius:8px; font-weight:800; font-size:13px;">❌ إجابة خاطئة</span>`
                        : `<span style="background:#F1F5F9; color:#64748B; padding:4px 12px; border-radius:8px; font-weight:800; font-size:13px;">⚪ لم يتم الحل</span>`);

                let bodyReviewHtml = '';

                if (q.type === 'matching' || q.pairs) {
                    const pairs = q.pairs || [];
                    const userMatches = ansObj?.matches || {};
                    let pairsHtml = pairs.map(p => {
                        const userRight = userMatches[p.left] || 'غير محدد';
                        const matchOk = userRight === p.right;
                        return `
                            <div style="display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:#F8FAFC; border:1px solid #E2E8F0; border-radius:10px; margin-bottom:8px; font-size:14px;">
                                <span><strong>${p.left}</strong> ➔ ${p.right}</span>
                                <span style="font-size:13px; font-weight:800; color:${matchOk ? '#16A34A' : '#DC2626'}">${matchOk ? '✅ صحيح' : `❌ اخترت: ${userRight}`}</span>
                            </div>
                        `;
                    }).join('');
                    bodyReviewHtml = `<div>${pairsHtml}</div>`;
                } else {
                    const options = q.options || [];
                    const correctIdx = q.correct !== undefined ? q.correct : 0;
                    const chosenIdx = ansObj ? ansObj.selectedIdx : null;

                    let optsHtml = options.map((opt, oIdx) => {
                        let optStyle = "background: #F8FAFC; border: 1.5px solid #E2E8F0; color: #334155;";
                        let optIcon = "⚪";

                        if (oIdx === correctIdx) {
                            optStyle = "background: #DCFCE7; border: 2px solid #22C55E; color: #166534; font-weight: 800;";
                            optIcon = "✅ (الإجابة النموذجية)";
                        } else if (oIdx === chosenIdx && !isCorrect) {
                            optStyle = "background: #FEE2E2; border: 2px solid #EF4444; color: #991B1B; font-weight: 800;";
                            optIcon = "❌ (اختيارك الخاطئ)";
                        }

                        return `
                            <div style="${optStyle} padding: 12px 16px; border-radius: 12px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 15px;">
                                <span>${opt}</span>
                                <span style="font-size: 13px;">${optIcon}</span>
                            </div>
                        `;
                    }).join('');
                    bodyReviewHtml = `<div>${optsHtml}</div>`;
                }

                let expHtml = '';
                if (q.explanation) {
                    expHtml = `
                        <div style="background: #EFF6FF; border: 1px solid #BFDBFE; border-radius: 12px; padding: 14px; margin-top: 15px; font-size: 14px; color: #1E40AF; line-height: 1.6;">
                            💡 <strong>الشرح والتوضيح:</strong> ${q.explanation.replace(/\*\*(.*?)\*\*/g, '<b style="color:#1D4ED8;">$1</b>')}
                        </div>
                    `;
                }

                html += `
                    <div class="report-q-card ${isCorrect ? 'q-correct' : 'q-wrong'}" style="background: white; border: 1.5px solid #E2E8F0; border-radius: 18px; padding: 22px; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
                        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                            <span style="font-size: 14px; font-weight: 800; color: #4F46E5; background: #EEF2FF; padding: 4px 12px; border-radius: 8px;">سؤال ${idx + 1}</span>
                            ${statusBadge}
                        </div>
                        <div style="font-size: 17px; font-weight: 800; color: #1E293B; margin-bottom: 16px; line-height: 1.6;">${q.text}</div>
                        ${bodyReviewHtml}
                        ${expHtml}
                    </div>
                `;
            });

            html += `
                    </div>
                </div>

                <!-- SECTION 2: Essay Questions -->
                <div id="sectionEssay" style="margin-top: 40px;">
                    <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 20px;">
                        <div style="width: 6px; height: 24px; background: #2563EB; border-radius: 4px;"></div>
                        <h2 style="color: #1E293B; font-size: 20px; font-weight: 900; margin: 0;">✍️ الأسئلة المقالية ونموذج الإجابة</h2>
                    </div>
            `;

            if (pendingEssays.length === 0) {
                html += `<div style="background: white; padding: 20px; border-radius: 16px; border: 1px solid #E2E8F0; text-align: center; color: #64748B; font-weight: 700;">لا يحتوي هذا الامتحان على أسئلة مقالية ✨</div>`;
            } else {
                pendingEssays.forEach((essay, eIdx) => {
                    const ans = userAnswers[essay.index]?.text || 'لم تتم كتابة إجابة';
                    html += `
                        <div class="report-q-card q-essay" style="background: white; border: 1.5px solid #E2E8F0; border-radius: 18px; padding: 22px; margin-bottom: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.02);">
                            <div style="font-size: 14px; font-weight: 800; color: #2563EB; background: #DBEAFE; display: inline-block; padding: 4px 12px; border-radius: 8px; margin-bottom: 12px;">سؤال مقالي ${eIdx + 1}</div>
                            <div style="font-size: 17px; font-weight: 900; color: #1E293B; margin-bottom: 16px; line-height: 1.6;">${essay.text}</div>
                            
                            <div style="margin-bottom: 15px; padding: 15px; background: #F8FAFC; border: 1.5px solid #E2E8F0; border-radius: 12px;">
                                <div style="color: #475569; font-weight: 800; font-size: 14px; margin-bottom: 6px;">✍️ إجابتك المكتوبة:</div>
                                <div style="color: #1E293B; font-weight: 700; font-size: 16px; white-space: pre-wrap;">${ans}</div>
                            </div>
                            
                            <div style="padding: 15px; background: #DCFCE7; border: 1.5px solid #86EFAC; border-radius: 12px;">
                                <div style="color: #166534; font-weight: 900; font-size: 14px; margin-bottom: 6px;">✅ الإجابة النموذجية والتفسير:</div>
                                <div style="color: #15803D; font-weight: 800; font-size: 16px; line-height: 1.6; white-space: pre-wrap;">${essay.modelAnswer || essay.explanation || essay.correctAnswer || essay.answer || 'يتم التقييم ومراجعة الصياغة مع المعلم والمشرفين'}</div>
                            </div>
                        </div>
                    `;
                });
            }

            html += `
                </div>

                <!-- Footer Buttons -->
                <div style="text-align: center; margin-top: 40px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;">
                    <button onclick="location.href='lectures.html?subject=${encodeURIComponent(subjectName)}'" style="background: #4F46E5; color: white; border: none; padding: 14px 30px; border-radius: 14px; font-size: 16px; font-weight: 900; font-family: inherit; cursor: pointer; box-shadow: 0 6px 20px rgba(79,70,229,0.3);">
                        📚 قائمة المحاضرات
                    </button>
                    <button onclick="location.reload()" style="background: #10B981; color: white; border: none; padding: 14px 30px; border-radius: 14px; font-size: 16px; font-weight: 900; font-family: inherit; cursor: pointer; box-shadow: 0 6px 20px rgba(16,185,129,0.3);">
                        🔄 إعادة حل الامتحان
                    </button>
                    <button onclick="location.href='home.html'" style="background: white; color: #1E293B; border: 2px solid #E2E8F0; padding: 14px 30px; border-radius: 14px; font-size: 16px; font-weight: 800; font-family: inherit; cursor: pointer;">
                        🏠 الصفحة الرئيسية
                    </button>
                </div>
            `;
            
            reportDiv.innerHTML = html;
            document.body.appendChild(reportDiv);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterReportView(type) {
            const btnAll = document.getElementById('tabAll');
            const btnWrong = document.getElementById('tabWrong');
            const btnEssay = document.getElementById('tabEssay');
            const secObj = document.getElementById('sectionObjective');
            const secEssay = document.getElementById('sectionEssay');

            [btnAll, btnWrong, btnEssay].forEach(b => {
                b.style.background = 'white';
                b.style.color = '#1E293B';
                b.style.border = '1px solid #E2E8F0';
            });

            if (type === 'all') {
                btnAll.style.background = '#1E3A8A';
                btnAll.style.color = 'white';
                secObj.style.display = 'block';
                secEssay.style.display = 'block';
                document.querySelectorAll('.report-q-card').forEach(c => c.style.display = 'block');
            } else if (type === 'wrong') {
                btnWrong.style.background = '#DC2626';
                btnWrong.style.color = 'white';
                secObj.style.display = 'block';
                secEssay.style.display = 'none';
                document.querySelectorAll('.report-q-card').forEach(c => {
                    c.style.display = c.classList.contains('q-wrong') ? 'block' : 'none';
                });
            } else if (type === 'essay') {
                btnEssay.style.background = '#2563EB';
                btnEssay.style.color = 'white';
                secObj.style.display = 'none';
                secEssay.style.display = 'block';
            }
        }

        function finishQuiz() {
            clearInterval(timerInterval);
            let correctCount = 0;
            let autoCount = 0;
            
            questions.forEach((q, i) => {
                if(q.type !== 'essay') {
                    autoCount++;
                    if(userAnswers[i] && userAnswers[i].correct) correctCount++;
                }
            });
            
            const wrongCount = autoCount - correctCount;
            const pct = autoCount > 0 ? Math.round((correctCount / autoCount) * 100) : 0;
            
            // Log to ActivityLogs & ExamResults
            const user = JSON.parse(localStorage.getItem('user') || '{}');
            const stCode = (user.studentCode || user.code || 'KH_TEMP').trim();
            const safeStCode = stCode.replace(/[.#$\[\]]/g, '_');
            const stName = user.fullName || user.name || 'طالب';
            const stPhone = user.whatsapp || user.phone || user.phoneNumber || '';

            try {
                // Save Activity Log
                const logRef = database.ref('ActivityLogs').push();
                logRef.set({
                    studentCode: stCode,
                    studentName: stName,
                    action: 'تسليم امتحان 🎯',
                    details: `أنهى امتحان (${examId || subjectName}) بنتيجة ${correctCount}/${autoCount} (${pct}%)`,
                    userAgent: navigator.userAgent || '',
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });

                // Save Exam Result for Grades Dashboard
                const resultRef = database.ref(`ExamResults/${subjectName}/${examId || 'general'}/${safeStCode}`);
                resultRef.set({
                    studentCode: stCode,
                    studentName: stName,
                    phone: stPhone,
                    score: correctCount,
                    totalQuestions: autoCount,
                    wrongCount: wrongCount,
                    percentage: pct,
                    passed: pct >= 50,
                    subjectName: subjectName,
                    examId: examId || 'general',
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
            } catch(e){
                console.error("Error saving exam result:", e);
            }

            isExamFinished = true;

            // Show Certificate & Detailed Review!
            showDetailedReport(correctCount, wrongCount, autoCount);
        }

        // ─── Exam Integrity & Anti-Cheat System (مراقبة الغش وتبديل النوافذ) ───
        let tabViolationsCount = 0;
        let isExamFinished = false;

        document.addEventListener('visibilitychange', function() {
            if (isExamFinished || !questions || questions.length === 0) return;

            if (document.hidden) {
                tabViolationsCount++;
                if (tabViolationsCount === 1) {
                    if (typeof Swal !== 'undefined') {
                        Swal.fire({
                            icon: 'warning',
                            title: '⚠️ تنبيه أمني: مغادرة صفحة الامتحان محظورة!',
                            text: 'تم رصد الخروج من صفحة الامتحان. يُرجى التركيز في إجابتك، تكرار هذا التصرف سيؤدي إلى إنهاء وتسليم الامتحان تلقائياً لمنع الغش.',
                            confirmButtonText: 'فهمت، العودة للامتحان',
                            confirmButtonColor: '#4F46E5',
                            allowOutsideClick: false
                        });
                    }
                } else if (tabViolationsCount === 2) {
                    if (typeof Swal !== 'undefined') {
                        Swal.fire({
                            icon: 'error',
                            title: '🚨 إنذار نهائي: محاولة غش محتملة!',
                            text: 'هذا هو الإنذار الأخير! إذا غادرت صفحة الامتحان مرة أخرى سيتم قفل الامتحان فوراً واحتساب درجتك الحالية فقط.',
                            confirmButtonText: 'الاستمرار في الامتحان فوراً',
                            confirmButtonColor: '#DC2626',
                            allowOutsideClick: false
                        });
                    }
                } else if (tabViolationsCount >= 3) {
                    isExamFinished = true;
                    if (typeof Swal !== 'undefined') {
                        Swal.fire({
                            icon: 'error',
                            title: '🚫 تم إنهاء وتسليم الامتحان تلقائياً',
                            text: 'تم قفل الامتحان وتسليمه بسبب تكرار مغادرة الصفحة لمواقع أو تبويبات خارجية.',
                            confirmButtonText: 'عرض النتيجة وتقرير الامتحان',
                            confirmButtonColor: '#1E3A8A',
                            allowOutsideClick: false
                        }).then(() => {
                            finishQuiz();
                        });
                    } else {
                        finishQuiz();
                    }
                }
            }
        });

        // Block right click inside exam area
        document.addEventListener('contextmenu', function(e) {
            const container = document.querySelector('.container');
            if (container && container.contains(e.target)) {
                e.preventDefault();
                return false;
            }
        });

        // Init
        fetchQuestions();
    </script>
    <script src="custom-dialogs.js"></script>
    <script src="pwa-installer.js"></script>
    <script src="offline-overlay.js"></script>
    <script src="student-guard.js"></script>
    <script src="student-drawer.js"></script>
</body>
</html>
