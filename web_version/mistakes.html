<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بنك الأخطاء - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .stats-card { background: white; margin-top: -30px; text-align: center; }
        .subject-header { padding: 20px 20px 5px; color: var(--primary); font-weight: bold; font-size: 18px; display: flex; align-items: center; }
        .subject-header::before { content: ""; width: 4px; height: 20px; background: var(--primary); margin-left: 10px; border-radius: 2px; }
        .mistake-card { border-right: 4px solid var(--mistake); margin-bottom: 10px; }
        .explanation { background: #F8F9FE; padding: 15px; border-radius: 12px; margin-top: 10px; font-size: 14px; color: var(--text-sub); border: 1px solid #F0F2F9; }
        .explanation b { color: var(--primary); }
    </style>
</head>
<body>
    <div class="header-gradient">
        <div class="back-btn" onclick="history.back()">⬅️</div>
        <div style="font-size: 22px; font-weight: bold;">تحليل مستواك</div>
    </div>

    <div class="card stats-card">
        <div id="mainStat" style="font-weight: bold; font-size: 17px;">جاري تحليل الأخطاء...</div>
        <div id="subStat" style="color: var(--text-sub); font-size: 13px; margin-top: 5px;">استمر في الحل لتحسين مستواك</div>
    </div>

    <div id="mistakesList">
        <!-- Will be populated by JS -->
    </div>

    <div class="bottom-nav">
        <a href="home.html" class="nav-item">🏠<br>الرئيسية</a>
        <a href="courses.html" class="nav-item">📖<br>المواد</a>
        <a href="profile.html" class="nav-item">👤<br>حسابي</a>
    </div>

    <script>
        // Load mistakes from localStorage (same as Android app logic)
        const mistakes = JSON.parse(localStorage.getItem('mistakes_list') || "[]");
        const container = document.getElementById('mistakesList');

        if (mistakes.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding: 50px; color:#BCBCBC;">سجلك نظيف! لا توجد أخطاء حالياً 🌟</div>`;
            document.getElementById('mainStat').innerText = "سجلك نظيف! أحسنت 🌟";
        } else {
            // Group by subject
            const grouped = mistakes.reduce((acc, m) => {
                acc[m.subjectName] = acc[m.subjectName] || [];
                acc[m.subjectName].push(m);
                return acc;
            }, {});

            for (const subject in grouped) {
                const header = document.createElement('div');
                header.className = 'subject-header';
                header.innerText = subject;
                container.appendChild(header);

                grouped[subject].forEach(m => {
                    const card = document.createElement('div');
                    card.className = 'card mistake-card';
                    card.innerHTML = `
                        <div style="font-weight: bold; font-size: 16px;">${m.questionText}</div>
                        <div class="explanation">
                            <b>التصويب:</b> ${m.explanation.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>')}
                        </div>
                    `;
                    container.appendChild(card);
                });
            }

            // Update stats
            const mostSubject = Object.entries(grouped).sort((a,b) => b[1].length - a[1].length)[0];
            document.getElementById('mainStat').innerText = `أكثر مادة تحتاج تركيز: ${mostSubject[0]}`;
            document.getElementById('subStat').innerText = `لديك ${mostSubject[1].length} أخطاء في هذه المادة!`;
        }
    </script>
</body>
</html>
