<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة الإدارة - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { background: #F8F9FE; padding-bottom: 20px; }
        .admin-header { background: #1A1C2E; padding: 50px 20px; color: white; border-radius: 0 0 35px 35px; text-align: center; }
        .admin-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 20px; margin-top: -30px; }
        .admin-item { background: white; border-radius: 25px; padding: 25px 15px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; border: 1px solid #F0F2F9; }
        .admin-item:hover { transform: translateY(-5px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .admin-icon { font-size: 35px; margin-bottom: 10px; display: block; }
        .logout-btn { background: #FDECEA; color: #D63031; border: none; padding: 10px 20px; border-radius: 12px; font-weight: bold; margin-top: 20px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="admin-header">
        <h2 style="margin: 0;">لوحة تحكم المنصة 🛠️</h2>
        <p style="opacity: 0.8; font-size: 14px; margin-top: 8px;">مرحباً بك أيها المسؤول</p>
    </div>

    <div class="admin-grid">
        <div class="admin-item" onclick="location.href='admin-students.html'">
            <span class="admin-icon">👥</span>
            <strong>إدارة الطلاب</strong>
        </div>
        <div class="admin-item" onclick="location.href='admin-notifications.html'">
            <span class="admin-icon">🔔</span>
            <strong>إرسال تنبيه</strong>
        </div>
        <div class="admin-item" onclick="location.href='admin-courses.html'">
            <span class="admin-icon">📖</span>
            <strong>إدارة المواد</strong>
        </div>
        <div class="admin-item" onclick="location.href='admin-codes.html'">
            <span class="admin-icon">🔑</span>
            <strong>توليد أكواد</strong>
        </div>
    </div>

    <div style="text-align: center; margin-top: 20px;">
        <button class="logout-btn" onclick="adminLogout()">تسجيل الخروج من الإدارة</button>
    </div>

    <script>
        if(sessionStorage.getItem('isAdmin') !== 'true') {
            window.location.href = "admin-gate.html";
        }
        function adminLogout() {
            sessionStorage.clear();
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
