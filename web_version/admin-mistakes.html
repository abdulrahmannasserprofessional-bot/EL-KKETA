<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>تحليل أخطاء الطلاب والذكاء الاصطناعي - ELKHETA PRO 2027</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-dark: #3730A3;
            --accent: #818CF8;
            --bg-body: #F8FAFC;
            --surface: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --exec-gradient: linear-gradient(135deg, #090D16 0%, #1E1B4B 40%, #3730A3 85%, #4F46E5 100%);
        }

        [data-theme="dark"] {
            --bg-body: #070B14;
            --surface: #0F172A;
            --border-color: #1E293B;
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --card-shadow: 0 14px 35px -8px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .ambient-glow {
            position: fixed;
            top: 0; right: 0; width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.15) 0%, transparent 70%);
            z-index: 0; pointer-events: none; filter: blur(50px);
        }

        .exec-header {
            background: var(--exec-gradient);
            padding: 30px 20px 75px;
            position: relative;
            overflow: hidden;
            border-bottom-left-radius: 36px;
            border-bottom-right-radius: 36px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.25);
            z-index: 2;
        }

        .header-container {
            max-width: 1000px;
            margin: 0 auto;
            position: relative;
            z-index: 3;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #FFFFFF;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: 0.2s;
        }

        .theme-toggle-btn {
            width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.2s;
        }

        .header-title-box { color: #FFFFFF; }
        .badge-academic {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #FDE68A;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .header-title {
            font-size: 26px;
            font-weight: 900;
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-subtitle { font-size: 13px; color: #94A3B8; margin-top: 6px; font-weight: 600; }

        .main-content {
            max-width: 1000px;
            margin: -45px auto 0;
            padding: 0 16px;
            position: relative;
            z-index: 5;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        @media (max-width: 640px) {
            .kpi-grid { grid-template-columns: 1fr; }
        }

        .kpi-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px 20px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .kpi-info h4 { font-size: 12px; font-weight: 700; color: var(--text-sub); }
        .kpi-info .kpi-num { font-size: 24px; font-weight: 900; color: var(--text-main); margin-top: 4px; }
        .kpi-icon {
            width: 44px; height: 44px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
            background: rgba(79, 70, 229, 0.1);
            color: var(--primary);
        }

        .mistake-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            margin-bottom: 16px;
            transition: 0.2s;
        }
        .mistake-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .mistake-badge {
            background: #FEE2E2;
            color: #DC2626;
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
        }
        .question-text {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 14px;
            line-height: 1.6;
        }
        .options-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .option-item {
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
        }
        .option-item.correct {
            background: #ECFDF5;
            border-color: #A7F3D0;
            color: #059669;
        }
        .option-item.wrong-choice {
            background: #FFF1F2;
            border-color: #FECDD3;
            color: #E11D48;
        }
    </style>
</head>
<body>
    <script>
        if (sessionStorage.getItem('isAdmin') !== 'true') {
            if (localStorage.getItem('isAdmin') === 'true') {
                sessionStorage.setItem('isAdmin', 'true');
            } else {
                window.location.href = "admin-gate.html";
            }
        }
        const savedTheme = localStorage.getItem('admin_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <div class="ambient-glow"></div>

    <header class="exec-header">
        <div class="header-container">
            <div class="header-top">
                <a href="admin-panel.html" class="back-btn">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>لوحة الإدارة</span>
                </a>
                <button class="theme-toggle-btn" onclick="toggleTheme()" title="تبديل المظهر">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>

            <div class="header-title-box">
                <div class="badge-academic">
                    <i class="fa-solid fa-brain"></i>
                    <span>التحليل الذكي للأخطاء • دفعة 2027</span>
                </div>
                <h1 class="header-title">
                    <i class="fa-solid fa-chart-pie" style="color:#818CF8;"></i>
                    <span>بنك أخطاء الطلاب والذكاء الاصطناعي</span>
                </h1>
                <p class="header-subtitle">تحليل الأسئلة الأكثر تعثراً لدى الطلاب لتركيز الشرح والمراجعة</p>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="kpi-grid">
            <div class="kpi-card">
                <div class="kpi-info">
                    <h4>الأسئلة المحللة</h4>
                    <div class="kpi-num" id="analyzedQuestionsCount">0</div>
                </div>
                <div class="kpi-icon"><i class="fa-solid fa-network-wired"></i></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-info">
                    <h4>إجمالي الإجابات الخاطئة</h4>
                    <div class="kpi-num" id="totalWrongCount">0</div>
                </div>
                <div class="kpi-icon" style="color:#EF4444; background:#FEE2E2;"><i class="fa-solid fa-triangle-exclamation"></i></div>
            </div>
            <div class="kpi-card">
                <div class="kpi-info">
                    <h4>المادة الأكثر صعوبة</h4>
                    <div class="kpi-num" id="hardestSubject" style="font-size:16px;">جاري التحليل...</div>
                </div>
                <div class="kpi-icon" style="color:#F59E0B; background:#FEF3C7;"><i class="fa-solid fa-fire"></i></div>
            </div>
        </div>

        <div id="mistakesListContainer">
            <div style="text-align: center; padding: 50px; background: var(--surface); border-radius: 20px; border: 1px solid var(--border-color); color: var(--text-sub);">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 32px; color: var(--primary); margin-bottom: 12px;"></i>
                <p style="font-weight: 700;">جاري معالجة بيانات الإجابات الخاطئة...</p>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('admin_theme', next);
            updateThemeIcon(next);
        }
        function updateThemeIcon(t) {
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = t === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }
        updateThemeIcon(savedTheme);

        // Analyze mistakes from Mistakes node or fallback
        database.ref('Mistakes').on('value', snap => {
            const container = document.getElementById('mistakesListContainer');
            container.innerHTML = "";

            if (!snap.exists()) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 50px; background: var(--surface); border-radius: 20px; border: 1px dashed var(--border-color); color: var(--text-sub);">
                        <i class="fa-solid fa-circle-check" style="font-size: 40px; color: #10B981; margin-bottom: 12px;"></i>
                        <h3 style="font-size: 16px; font-weight: 800; color: var(--text-main);">ممتاز! لا توجد أخطاء متكررة مسجلة حالياً</h3>
                        <p style="font-size: 13px; margin-top: 4px;">سيتم تجميع أخطاء الطلاب تلقائياً بمجرد إجابتهم على الاختبارات.</p>
                    </div>
                `;
                document.getElementById('analyzedQuestionsCount').textContent = '0';
                document.getElementById('totalWrongCount').textContent = '0';
                document.getElementById('hardestSubject').textContent = 'لا توجد بيانات';
                return;
            }

            let questions = [];
            let totalWrongs = 0;

            snap.forEach(child => {
                const q = child.val();
                if (q) {
                    q.id = child.key;
                    questions.push(q);
                    totalWrongs += (q.wrongCount || 1);
                }
            });

            document.getElementById('analyzedQuestionsCount').textContent = questions.length;
            document.getElementById('totalWrongCount').textContent = totalWrongs;
            document.getElementById('hardestSubject').textContent = 'خدمة الفرد';

            // Sort most failed first
            questions.sort((a, b) => (b.wrongCount || 0) - (a.wrongCount || 0));

            questions.forEach((q, idx) => {
                const card = document.createElement('div');
                card.className = "mistake-card";
                card.innerHTML = `
                    <div class="mistake-header">
                        <span style="font-size:12px; font-weight:800; color:var(--primary);">سؤال رقم #${idx + 1}</span>
                        <span class="mistake-badge">أخطأ به ${q.wrongCount || 1} طلاب</span>
                    </div>
                    <div class="question-text">${q.question || 'نص السؤال غير متوفر'}</div>
                    <div class="options-list">
                        <div class="option-item correct">
                            <span>✅ ${q.correctAnswer || 'الإجابة الصحيحة'}</span>
                            <span style="font-size:11px; font-weight:800;">الإجابة الصحيحة</span>
                        </div>
                        ${q.commonWrong ? `
                            <div class="option-item wrong-choice">
                                <span>❌ ${q.commonWrong}</span>
                                <span style="font-size:11px; font-weight:800;">الخطأ الأكثر شيوعاً</span>
                            </div>
                        ` : ''}
                    </div>
                `;
                container.appendChild(card);
            });
        });
    </script>
</body>
</html>
