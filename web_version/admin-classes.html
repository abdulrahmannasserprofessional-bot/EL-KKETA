<link rel="stylesheet" href="desktop-theme.css?v=3.0.0">

    <style id="elkheta-mobile-guard">
/* ═══════════════════════════════════════════════════════════════════════ */
/* 📱 BULLETPROOF 100% MOBILE & PHONE RESPONSIVE ENGINE (v3.0.0)          */
/* ═══════════════════════════════════════════════════════════════════════ */
@media (max-width: 992px) {
    html, body {
        width: 100% !important;
        max-width: 100vw !important;
        overflow-x: hidden !important;
        display: block !important;
        position: relative !important;
        padding-bottom: 75px !important;
        margin: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    .student-app-container,
    .dashboard-container,
    .app-layout,
    .main-wrapper,
    .page-container,
    .content-wrapper,
    .layout-wrapper {
        display: block !important;
        width: 100% !important;
        max-width: 100vw !important;
        min-width: 0 !important;
        overflow-x: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* Off-canvas Mobile Drawer for ALL Sidebars */
    .student-sidebar,
    .dashboard-sidebar,
    .admin-sidebar,
    aside.sidebar {
        position: fixed !important;
        top: 0 !important;
        right: -340px !important;
        left: auto !important;
        width: 290px !important;
        max-width: 85vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        z-index: 999999 !important;
        background: #FFFFFF !important;
        box-shadow: -8px 0 35px rgba(0, 0, 0, 0.25) !important;
        transition: right 0.32s cubic-bezier(0.16, 1, 0.3, 1) !important;
        overflow-y: auto !important;
        padding: 22px 16px 90px !important;
        border-left: 2px solid #E8D3B2 !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
    }

    .student-sidebar.mobile-open,
    .dashboard-sidebar.mobile-open,
    .admin-sidebar.mobile-open,
    aside.sidebar.mobile-open {
        right: 0 !important;
    }

    /* Main Stage 100% Fluid Width */
    .student-main-stage,
    .main-workspace-area,
    .main-content-flow,
    .dashboard-main,
    .main-content,
    .workspace-area,
    .content-area,
    main {
        width: 100% !important;
        max-width: 100vw !important;
        min-width: 0 !important;
        flex: none !important;
        display: block !important;
        padding: 12px 10px 90px !important;
        margin: 0 !important;
        box-sizing: border-box !important;
        overflow-x: hidden !important;
    }

    /* Header Bar */
    .top-header-bar,
    .header-bar,
    .dashboard-topbar {
        padding: 10px 12px !important;
        border-radius: 14px !important;
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 10px !important;
        margin-bottom: 14px !important;
        width: 100% !important;
        justify-content: space-between !important;
        align-items: center !important;
        box-sizing: border-box !important;
    }

    .header-search-wrap {
        order: 2 !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        margin-top: 4px !important;
    }

    .header-actions-group {
        order: 1 !important;
        width: 100% !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
    }

    /* Single Column Grids for Phone Screens */
    .middle-grid-row,
    .kpi-grid,
    .bento-grid,
    .courses-grid,
    .subjects-grid,
    .stats-row,
    .stats-grid,
    .profile-grid,
    .settings-grid,
    .lessons-grid,
    .cards-grid,
    .kpi-row,
    div[style*="grid-template-columns"] {
        grid-template-columns: 1fr !important;
        gap: 12px !important;
        width: 100% !important;
    }

    /* Hero Cards & Banners */
    .universal-hero-banner,
    .hero-banner-card,
    .doc-hero-card,
    .welcome-hero,
    .resume-learning-card {
        padding: 18px 14px !important;
        border-radius: 16px !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 10px !important;
        width: 100% !important;
        box-sizing: border-box !important;
    }

    .hero-banner-title {
        font-size: 19px !important;
        line-height: 1.3 !important;
    }

    .hero-banner-sub {
        font-size: 12px !important;
        line-height: 1.5 !important;
    }

    /* Floating Support Button */
    .floating-support-btn {
        bottom: 76px !important;
        left: 12px !important;
        padding: 10px !important;
        border-radius: 50% !important;
        z-index: 9998 !important;
    }
    .floating-text-box {
        display: none !important;
    }

    .table-container,
    .table-responsive,
    .audit-table-wrap {
        width: 100% !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
        display: block !important;
    }

    .luxury-card,
    .card,
    .bento-card,
    .course-card,
    .lesson-card {
        padding: 16px 12px !important;
        border-radius: 16px !important;
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
    }

    .mobile-drawer-backdrop {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        background: rgba(15, 23, 42, 0.65) !important;
        backdrop-filter: blur(4px) !important;
        -webkit-backdrop-filter: blur(4px) !important;
        z-index: 999998 !important;
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.3s ease !important;
    }

    .mobile-drawer-backdrop.active {
        opacity: 1 !important;
        pointer-events: auto !important;
    }

    .universal-mobile-dock {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        height: 64px !important;
        background: rgba(255, 255, 255, 0.97) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border-top: 1px solid #EFE8DC !important;
        display: flex !important;
        align-items: center !important;
        justify-content: space-around !important;
        padding: 0 4px !important;
        z-index: 99999 !important;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.06) !important;
    }

    .mobile-dock-btn {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 3px !important;
        color: #8C827A !important;
        text-decoration: none !important;
        font-size: 10px !important;
        font-weight: 700 !important;
        flex: 1 !important;
        padding: 6px 0 !important;
        transition: all 0.2s ease !important;
    }

    .mobile-dock-btn i {
        font-size: 18px !important;
        transition: transform 0.2s ease !important;
    }

    .mobile-dock-btn.active {
        color: #C28B38 !important;
        font-weight: 900 !important;
    }

    .mobile-dock-btn.active i {
        transform: scale(1.15) !important;
        color: #C28B38 !important;
    }

    .mobile-hamburger-btn {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 38px !important;
        height: 38px !important;
        border-radius: 10px !important;
        background: #FDF4E6 !important;
        border: 1px solid #E8D3B2 !important;
        color: #C28B38 !important;
        font-size: 18px !important;
        cursor: pointer !important;
    }
}

@media (min-width: 993px) {
    .universal-mobile-dock { display: none !important; }
    .mobile-hamburger-btn { display: none !important; }
    .mobile-drawer-backdrop { display: none !important; }
}
</style>
</head>
<body>
    <div class="header-gradient">
        <div class="back-btn" onclick="location.href='admin-panel.html'">⬅️</div>
        <div style="font-size: 22px; font-weight: bold;">إدارة الفصول الدراسية</div>
    </div>

    <div class="card form-section">
        <h3 style="margin: 0; font-size: 16px;">إضافة فصل / صف جديد</h3>
        <input type="text" id="className" placeholder="مثلاً: الصف الأول الثانوي">
        <button class="btn-primary" onclick="addClass()">إضافة الفصل ➕</button>
    </div>

    <div id="classesList" style="padding: 10px;">
        <div style="text-align: center; padding: 50px; color: #BCBCBC;">جاري تحميل الفصول...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        if (sessionStorage.getItem('isAdmin') !== 'true' && !sessionStorage.getItem('isMysqlAdmin')) {
            if (localStorage.getItem('isAdmin') === 'true' || localStorage.getItem('isMysqlAdmin') === 'true') {
                sessionStorage.setItem('isAdmin', 'true');
                if (localStorage.getItem('adminRole')) sessionStorage.setItem('adminRole', localStorage.getItem('adminRole'));
                if (localStorage.getItem('adminName')) sessionStorage.setItem('adminName', localStorage.getItem('adminName'));
                if (localStorage.getItem('adminPermissions')) sessionStorage.setItem('adminPermissions', localStorage.getItem('adminPermissions'));
            } else {
                window.location.href = "admin-gate.html";
            }
        }

        function addClass() {
            const name = document.getElementById('className').value.trim();
            if(!name) return alert("يرجى كتابة اسم الفصل");

            const id = database.ref('Classes').push().key;
            database.ref('Classes/' + id).set({ id, name }).then(() => {
                document.getElementById('className').value = "";
                alert("تمت إضافة الفصل");
            });
        }

        function loadClasses() {
            database.ref('Classes').on('value', snap => {
                const list = document.getElementById('classesList');
                list.innerHTML = "";
                if(snap.exists()){
                    snap.forEach(child => {
                        const item = child.val();
                        const card = document.createElement('div');
                        card.className = "card class-card";
                        card.innerHTML = `
                            <strong>🏫 ${item.name}</strong>
                            <button class="btn-del" onclick="deleteClass('${item.id}')"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></button>
                        `;
                        list.appendChild(card);
                    });
                } else {
                    list.innerHTML = `<div style="text-align:center; padding:50px; color:#BCBCBC;">لا توجد فصول حالياً</div>`;
                }
            });
        }

        function deleteClass(id) {
            Swal.fire({title:"????? ?????",text:"?? ??? ??????",icon:"warning",showCancelButton:true,confirmButtonText:"???? ????",cancelButtonText: "إلغاء"}).then((r) => { if(r.isConfirmed) { database.ref('Classes/' + id).remove(); } })
        }
        loadClasses();
    </script>
</body>
</html>
