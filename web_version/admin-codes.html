<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد الأكواد - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .gen-section { margin-top: -30px; }
        .code-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 20px; border-bottom: 1px solid #F0F2F9; }
        .status-unused { color: #27AE60; font-weight: bold; font-size: 12px; background: #EBFAEF; padding: 4px 10px; border-radius: 8px; }
        .status-used { color: #BCBCBC; font-weight: bold; font-size: 12px; background: #F8F9FE; padding: 4px 10px; border-radius: 8px; }
        input[type="number"] { width: 100%; padding: 15px; border: 2px solid #F0F2F9; border-radius: 15px; margin: 15px 0; font-family: inherit; font-size: 18px; text-align: center; }
    </style>
</head>
<body>
    <div class="header-gradient">
        <div class="back-btn" onclick="location.href='admin-panel.html'">⬅️</div>
        <div style="font-size: 22px; font-weight: bold;">توليد أكواد التفعيل</div>
    </div>

    <div class="card gen-section">
        <h3 style="margin: 0; font-size: 16px;">كم كوداً تريد توليده الآن؟</h3>
        <input type="number" id="codeCount" placeholder="مثلاً: 10" min="1" max="100">
        <button class="btn-primary" onclick="generateCodes()">توليد وحفظ في القاعدة 🚀</button>
    </div>

    <div class="card" style="padding: 0; overflow: hidden;">
        <div style="padding: 20px; border-bottom: 2px solid #F8F9FE; font-weight: bold; color: var(--primary);">قائمة الأكواد الحالية</div>
        <div id="codesList" style="max-height: 400px; overflow-y: auto;">
            <div style="text-align: center; padding: 30px; color: #BCBCBC;">جاري تحميل الأكواد...</div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        if(sessionStorage.getItem('isAdmin') !== 'true') window.location.href = "admin-gate.html";

        function generateCodes() {
            const count = parseInt(document.getElementById('codeCount').value);
            if(!count || count < 1) return alert("يرجى إدخال عدد صحيح");

            const batch = {};
            for(let i=0; i<count; i++) {
                const random = Math.floor(1000 + Math.random() * 9000);
                const code = "KH" + random;
                batch[code] = {
                    code: code,
                    isUsed: false,
                    createdAt: Date.now()
                };
            }

            database.ref('ActivationCodes').update(batch).then(() => {
                alert(`تم توليد ${count} كود بنجاح ✅`);
                document.getElementById('codeCount').value = "";
            }).catch(() => alert("فشل في توليد الأكواد"));
        }

        function loadCodes() {
            database.ref('ActivationCodes').on('value', (snapshot) => {
                const list = document.getElementById('codesList');
                list.innerHTML = "";
                if(snapshot.exists()) {
                    const data = [];
                    snapshot.forEach(child => data.push(child.val()));
                    data.reverse().forEach(item => {
                        const card = document.createElement('div');
                        card.className = "code-item";
                        const statusClass = item.isUsed ? 'status-used' : 'status-unused';
                        const statusText = item.isUsed ? 'مستخدم 🔴' : 'متاح ✅';
                        card.innerHTML = `
                            <div style="font-weight: bold; font-family: monospace; font-size: 18px;">${item.code}</div>
                            <div class="${statusClass}">${statusText}</div>
                        `;
                        list.appendChild(card);
                    });
                } else {
                    list.innerHTML = `<div style="text-align:center; padding:30px; color:#BCBCBC;">لا توجد أكواد حالياً</div>`;
                }
            });
        }

        loadCodes();
    </script>
</body>
</html>
