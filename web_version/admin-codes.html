<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توليد الأكواد - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #F8FAFC; min-height: 100vh; color: #1E293B; padding-bottom: 40px; }

        .page-header {
            background: linear-gradient(135deg, #14532D, #166534);
            padding: 50px 20px 70px;
            position: relative; overflow: hidden;
        }
        .page-header::after {
            content: '';
            position: absolute;
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(74,222,128,0.15) 0%, transparent 70%);
            bottom: -80px; right: -30px; border-radius: 50%;
        }
        .header-top { display: flex; align-items: center; gap: 15px; position: relative; z-index: 2; }
        .back-btn {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3);
            border-radius: 12px; display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px; transition: background 0.2s;
            color: #FFFFFF; text-decoration: none;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }
        .header-title { font-size: 20px; font-weight: 800;  color: #FFFFFF; }
        .header-sub { font-size: 12px; color: rgba(0,0,0,0.5); margin-top: 3px;  color: rgba(255,255,255,0.8); }

        /* Gen Card */
        .gen-card {
            margin: -30px 15px 0;
            background: #FFFFFF;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 24px;
            padding: 22px;
            position: relative; z-index: 10;
        }
        .gen-card h3 { font-size: 14px; font-weight: 700; color: rgba(0,0,0,0.6); margin-bottom: 14px; }

        .count-input {
            width: 100%;
            padding: 16px;
            background: #F8FAFC;
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #1E293B;
            font-family: 'Cairo', sans-serif;
            font-size: 22px;
            text-align: center;
            outline: none;
            transition: all 0.3s;
        }
        .count-input:focus { border-color: #4ADE80; background: rgba(74,222,128,0.07); }
        .count-input::placeholder { font-size: 14px; color: rgba(0,0,0,0.2); }

        .quick-select { display: flex; gap: 8px; margin-top: 10px; }
        .quick-btn {
            flex: 1; padding: 10px;
            background: #F8FAFC;
            border: 1px solid rgba(0,0,0,0.09);
            border-radius: 12px;
            color: rgba(0,0,0,0.6);
            font-family: 'Cairo', sans-serif;
            font-size: 14px; font-weight: 700;
            cursor: pointer; transition: all 0.2s;
        }
        .quick-btn:hover { background: rgba(74,222,128,0.12); border-color: rgba(74,222,128,0.3); color: #4ADE80; }

        .btn-generate {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #16A34A, #4ADE80);
            border: none; border-radius: 14px;
            color: #1E293B; font-size: 16px; font-weight: 800;
            font-family: 'Cairo', sans-serif; cursor: pointer;
            margin-top: 14px; transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(74,222,128,0.3);
        }
        .btn-generate:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(74,222,128,0.45); }
        .btn-generate:active { transform: scale(0.98); }

        /* Stats */
        .stats-row { display: flex; gap: 10px; padding: 15px 15px 0; }
        .stat-pill {
            flex: 1; background: rgba(255,255,255,0.04);
            border: 1px solid rgba(0,0,0,0.07);
            border-radius: 14px; padding: 12px 10px; text-align: center;
        }
        .stat-val-green { font-size: 20px; font-weight: 900; color: #4ADE80; }
        .stat-val-red { font-size: 20px; font-weight: 900; color: #F87171; }
        .stat-lbl { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

        /* Filter Tabs */
        .filter-tabs { display: flex; gap: 8px; padding: 15px 15px 8px; }
        .filter-tab {
            flex: 1; padding: 10px;
            background: #FFFFFF;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 12px;
            font-family: 'Cairo', sans-serif;
            font-size: 13px; font-weight: 700;
            color: rgba(0,0,0,0.5); cursor: pointer; transition: all 0.2s;
            text-align: center;
        }
        .filter-tab.active { background: rgba(74,222,128,0.12); border-color: rgba(74,222,128,0.3); color: #4ADE80; }

        /* Code list */
        .codes-container {
            margin: 0 15px;
            background: #FFFFFF;
            border: 1px solid rgba(0,0,0,0.07);
            border-radius: 20px;
            overflow: hidden;
        }
        .code-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 14px 18px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: background 0.2s;
        }
        .code-item:last-child { border-bottom: none; }
        .code-item:hover { background: rgba(255,255,255,0.02); }
        .code-item.available { cursor: pointer; }
        .code-item.available:hover { background: rgba(74,222,128,0.05); }

        .code-text { font-family: monospace; font-size: 20px; font-weight: 900; color: #1E293B; letter-spacing: 2px; }
        .code-date { font-size: 11px; color: rgba(0,0,0,0.25); margin-top: 3px; }

        .badge-available {
            background: rgba(74,222,128,0.15); color: #4ADE80;
            border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700;
        }
        .badge-used {
            background: #F8FAFC; color: rgba(0,0,0,0.3);
            border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 700;
        }

        .copy-hint { font-size: 11px; color: #4ADE80; margin-top: 3px; }

        .empty-state { text-align: center; padding: 50px 20px; color: rgba(0,0,0,0.3); }
        .empty-state div { font-size: 40px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        .toast {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: #1E293B; border: 1px solid rgba(0,0,0,0.1);
            color: #1E293B; padding: 12px 22px; border-radius: 14px;
            font-size: 14px; font-weight: 600; z-index: 9999;
            transition: transform 0.35s ease; white-space: nowrap;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }
        .toast.show { transform: translateX(-50%) translateY(0); }
    </style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <script>
        if (sessionStorage.getItem('isAdmin') !== 'true') {
            if (localStorage.getItem('isAdmin') === 'true') {
                sessionStorage.setItem('isAdmin', 'true');
                if (localStorage.getItem('adminRole')) sessionStorage.setItem('adminRole', localStorage.getItem('adminRole'));
                if (localStorage.getItem('adminPermissions')) sessionStorage.setItem('adminPermissions', localStorage.getItem('adminPermissions'));
            } else {
                window.location.href = "admin-gate.html";
            }
        }
        const role = sessionStorage.getItem('adminRole') || 'master';
        if (role !== 'master' && role !== 'super_admin') {
            try {
                const perms = JSON.parse(sessionStorage.getItem('adminPermissions') || '{}');
                if (!perms.all && !perms.codes) {
                    alert("⛔ ليس لديك صلاحية للوصول إلى قسم توليد الأكواد");
                    window.location.href = "admin-panel.html";
                }
            } catch(e) {}
        }
    </script>

    <div class="page-header">
        <div class="header-top">
            <div class="back-btn" onclick="location.href='admin-panel.html'">⬅️</div>
            <div>
                <div class="header-title">🔑 توليد أكواد التفعيل</div>
                <div class="header-sub">توليد وإدارة أكواد تفعيل الطلاب</div>
            </div>
        </div>
    </div>

    <div class="gen-card">
        <h3>✨ توليد أكواد تفعيل جديدة (دفعة 2027)</h3>
        
        <div style="display: flex; gap: 10px; margin-bottom: 12px; flex-wrap: wrap;">
            <div style="flex: 1; min-width: 140px;">
                <label style="font-size: 12px; font-weight: 700; color: rgba(0,0,0,0.6); display: block; margin-bottom: 4px;">بادئة الكود:</label>
                <select id="codePrefix" class="count-input" style="font-size: 15px; height: 46px; padding: 0 10px; width: 100%;">
                    <option value="KH27">KH27 (دفعة 2027)</option>
                    <option value="STU">STU (طالب)</option>
                    <option value="VIP">VIP (اشتراك مميز)</option>
                    <option value="2027">2027</option>
                    <option value="NONE">أرقام فقط</option>
                </select>
            </div>
            <div style="flex: 1; min-width: 140px;">
                <label style="font-size: 12px; font-weight: 700; color: rgba(0,0,0,0.6); display: block; margin-bottom: 4px;">عدد الأكواد:</label>
                <input type="number" id="codeCount" class="count-input" style="font-size: 18px; height: 46px;" placeholder="العدد" min="1" max="200" value="10">
            </div>
        </div>

        <div class="quick-select">
            <button class="quick-btn" onclick="setCount(1)">1 كود</button>
            <button class="quick-btn" onclick="setCount(5)">5</button>
            <button class="quick-btn" onclick="setCount(10)">10</button>
            <button class="quick-btn" onclick="setCount(25)">25</button>
            <button class="quick-btn" onclick="setCount(50)">50</button>
        </div>

        <div style="display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;">
            <button class="btn-generate" style="flex: 2; min-width: 160px;" onclick="generateCodes()">🔑 توليد وحفظ الأكواد</button>
            <button class="btn-generate" style="flex: 1.5; min-width: 140px; background: linear-gradient(135deg, #2563EB, #1D4ED8); color: #fff;" onclick="generateSingleInstantCode()">⚡ توليد كود فوري ونسخه</button>
            <button class="btn-generate" style="flex: 1; min-width: 120px; background: linear-gradient(135deg, #ef4444, #dc2626); color: #fff;" onclick="resetAllCodes()">🗑️ تصفير الكل</button>
        </div>
    </div>

    <div class="stats-row">
        <div class="stat-pill">
            <div class="stat-val-green" id="availableCount">—</div>
            <div class="stat-lbl">كود متاح للتفعيل</div>
        </div>
        <div class="stat-pill">
            <div class="stat-val-red" id="usedCount">—</div>
            <div class="stat-lbl">كود مستخدم ومفعل</div>
        </div>
        <div class="stat-pill">
            <div class="stat-val-green" id="totalCount">—</div>
            <div class="stat-lbl">إجمالي الأكواد</div>
        </div>
    </div>

    <div style="padding: 10px 15px 0;">
        <input type="text" id="searchCodeInput" class="count-input" style="width: 100%; font-size: 14px; height: 44px; text-align: right; padding: 0 16px;" placeholder="🔍 ابحث برقم الكود أو اسم الطالب الذي فعّله..." oninput="filterCodes()">
    </div>

    <div class="filter-tabs">
        <button class="filter-tab active" id="tab-all" onclick="switchTab('all')">الكل</button>
        <button class="filter-tab" id="tab-available" onclick="switchTab('available')">✅ المتاحة</button>
        <button class="filter-tab" id="tab-used" onclick="switchTab('used')">🔴 المستخدمة</button>
        <button class="filter-tab" style="background: #16A34A; color: #fff; border:none;" onclick="exportCodesCSV()">📊 تصدير Excel</button>
        <button class="filter-tab" style="background: #2563EB; color: #fff; border:none;" onclick="exportPDF()">🖨️ كروت (PDF)</button>
    </div>

    <div class="codes-container" id="codesContainer">
        <div class="empty-state"><div>🔑</div><p>جاري تحميل الأكواد...</p></div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        let allCodes = [];
        let currentTab = 'all';

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        function setCount(n) { document.getElementById('codeCount').value = n; }

        function generateCodeString(prefix) {
            const randNum = Math.floor(1000 + Math.random() * 9000);
            if (prefix === 'NONE') return randNum.toString();
            return `${prefix}-${randNum}`;
        }

        async function generateSingleInstantCode() {
            const prefix = document.getElementById('codePrefix').value;
            const newCode = generateCodeString(prefix);

            await database.ref('ActivationCodes/' + newCode).set({
                code: newCode,
                isUsed: false,
                createdAt: Date.now()
            });

            navigator.clipboard.writeText(newCode).then(() => {
                Swal.fire({
                    title: 'تم توليد الكود ونسخه 🎉',
                    html: `
                        <div style="text-align:center; font-family:'Cairo', sans-serif;">
                            <p style="margin-bottom:8px; font-size:13px;">تم حفظ الكود في قاعدة البيانات ونسخه للحافظة:</p>
                            <div style="font-size:24px; font-weight:900; font-family:monospace; color:#16A34A; background:#F0FDF4; border:2px dashed #4ADE80; border-radius:12px; padding:12px; margin-bottom:12px; letter-spacing:2px;">
                                ${newCode}
                            </div>
                            <button onclick="sendCodeWhatsApp('${newCode}')" class="btn-generate" style="background:#16A34A; color:#fff; border:none; margin:0; padding:10px;"><i class="fa-brands fa-whatsapp"></i> مشاركة الكود عبر واتساب</button>
                        </div>
                    `,
                    icon: 'success',
                    confirmButtonText: 'حسناً',
                    confirmButtonColor: '#2563EB'
                });
            });
        }

        function generateCodes() {
            const count = parseInt(document.getElementById('codeCount').value);
            const prefix = document.getElementById('codePrefix').value;

            if (!count || count < 1) return showToast("⚠️ أدخل عدداً صحيحاً");
            if (count > 200) return showToast("⚠️ الحد الأقصى 200 كود في المرة");

            const batch = {};
            for (let i = 0; i < count; i++) {
                const code = generateCodeString(prefix);
                batch[code] = { code, isUsed: false, createdAt: Date.now() };
            }

            database.ref('ActivationCodes').update(batch).then(() => {
                Swal.fire({
                    title: 'تم التوليد بنجاح! 🔑',
                    text: `تم توليد وحفظ ${count} كود تفعيل جديد في قاعدة البيانات.`,
                    icon: 'success',
                    confirmButtonColor: '#2563EB',
                    confirmButtonText: 'ممتاز'
                });
                document.getElementById('codeCount').value = "10";
            }).catch((err) => {
                console.error(err);
                showToast("فشل توليد الأكواد");
            });
        }

        function deleteSingleCode(code) {
            Swal.fire({
                title: `حذف الكود (${code})؟`,
                text: "لن يتمكن أي طالب من استخدام هذا الكود بعد الحذف.",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#64748B',
                confirmButtonText: 'نعم، حذف',
                cancelButtonText: 'إلغاء'
            }).then(r => {
                if (r.isConfirmed) {
                    database.ref('ActivationCodes/' + code).remove().then(() => {
                        showToast(`تم حذف الكود: ${code}`);
                    });
                }
            });
        }

        function sendCodeWhatsApp(code) {
            const msg = encodeURIComponent(`أهلاً بك في منصة الخطة التعليمية 🎓 (الدفعة 2027)\nكود تفعيل اشتراكك هو: ${code}\nقم بالدخول على الرابط وتفعيل كودك: https://elkheta2026.web.app/register.html?code=${code}`);
            window.open(`https://wa.me/?text=${msg}`, '_blank');
        }

        function exportCodesCSV() {
            if (!allCodes || allCodes.length === 0) return showToast("⚠️ لا توجد أكواد لتصديرها");

            let csvContent = "\uFEFF"; // UTF-8 BOM
            csvContent += "م,الكود,الحالة,المستخدم,رقم الهاتف,تاريخ التوليد\n";

            allCodes.forEach((item, i) => {
                const status = item.isUsed ? "مستخدم" : "متاح";
                const date = item.createdAt ? new Date(item.createdAt).toLocaleDateString('ar-EG') : "—";
                const row = [
                    i + 1,
                    `"${item.code || item.key}"`,
                    `"${status}"`,
                    `"${(item.usedBy || '').replace(/"/g, '""')}"`,
                    `"${item.phone || ''}"`,
                    `"${date}"`
                ];
                csvContent += row.join(",") + "\n";
            });

            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            link.setAttribute("href", url);
            link.setAttribute("download", `اكواد_تفعيل_الخطة_2027_${Date.now()}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            showToast("تم تصدير ملف الإكسيل بنجاح 📊");
        }

        function exportPDF() {
            let filtered = allCodes;
            if (currentTab === 'available') filtered = allCodes.filter(c => !c.isUsed);
            if (currentTab === 'used') filtered = allCodes.filter(c => c.isUsed);
            
            if (filtered.length === 0) return showToast("⚠️ لا يوجد أكواد للطباعة في هذه القائمة");
            
            showToast("⏳ جاري تجهيز كروت الـ PDF...");
            
            const wrapper = document.createElement('div');
            wrapper.style.position = 'absolute';
            wrapper.style.left = '-9999px';
            wrapper.style.top = '0';
            wrapper.style.width = '800px';
            wrapper.style.background = '#FFFFFF';
            wrapper.id = 'pdfWrapperNode';

            const container = document.createElement('div');
            container.style.display = 'flex';
            container.style.flexWrap = 'wrap';
            container.style.padding = '20px';
            container.style.gap = '15px';
            container.style.fontFamily = "'Cairo', sans-serif";
            container.style.direction = 'rtl';
            container.style.background = '#FFFFFF';

            filtered.forEach(item => {
                const card = document.createElement('div');
                card.style.width = 'calc(33.333% - 15px)';
                card.style.border = '2px dashed #4ADE80';
                card.style.borderRadius = '12px';
                card.style.padding = '15px';
                card.style.textAlign = 'center';
                card.style.pageBreakInside = 'avoid';
                card.style.background = '#FFFFFF';
                
                card.innerHTML = `
                    <div style="font-size:14px; font-weight:700; color:#166534; margin-bottom:10px;">منصة الخطة التعليمية 2027 🎓</div>
                    <div style="font-size:24px; font-weight:900; font-family:monospace; color:#1E293B; letter-spacing:2px; background:#F0FDF4; padding:10px; border-radius:8px; margin-bottom:10px;">${item.code || item.key}</div>
                    <div style="font-size:10px; color:#64748B;">كود تفعيل واشتراك الطالب</div>
                `;
                container.appendChild(card);
            });

            wrapper.appendChild(container);
            document.body.appendChild(wrapper);
            
            setTimeout(() => {
                html2pdf().set({
                    margin: 10,
                    filename: `كروت_أكواد_الخطة_2027_${Date.now()}.pdf`,
                    image: { type: 'jpeg', quality: 1.0 },
                    html2canvas: { scale: 2, useCORS: true, windowWidth: 800, scrollY: 0, x: 0, y: 0 },
                    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' }
                }).from(wrapper).save().then(() => {
                    document.body.removeChild(wrapper);
                    showToast("✅ تم تصدير ملف الـ PDF بنجاح!");
                }).catch(err => {
                    console.error(err);
                    document.body.removeChild(wrapper);
                    showToast("❌ حدث خطأ أثناء التصدير", "error");
                });
            }, 500);
        }

        function resetAllCodes() {
            Swal.fire({
                title: 'هل أنت متأكد؟',
                text: "سيتم حذف وتصفير جميع الأكواد (المتاحة والمستخدمة) نهائياً!",
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#d33',
                cancelButtonColor: '#3085d6',
                confirmButtonText: 'نعم، قم بالحذف!',
                cancelButtonText: 'إلغاء'
            }).then((result) => {
                if (result.isConfirmed) {
                    database.ref('ActivationCodes').remove().then(() => {
                        showToast("✅ تم تصفير جميع الأكواد بنجاح");
                    }).catch(err => {
                        console.error(err);
                        showToast("❌ حدث خطأ أثناء التصفير");
                    });
                }
            });
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            filterCodes();
        }

        database.ref('ActivationCodes').on('value', snap => {
            allCodes = [];
            let available = 0, used = 0;

            if (snap.exists()) {
                snap.forEach(child => {
                    const val = child.val();
                    if (typeof val === 'object' && val !== null) {
                        allCodes.push({ key: child.key, ...val });
                    } else {
                        allCodes.push({ key: child.key, code: child.key, isUsed: val === true });
                    }
                });
                allCodes.reverse();
                allCodes.forEach(c => c.isUsed ? used++ : available++);
            }

            document.getElementById('availableCount').textContent = available;
            document.getElementById('usedCount').textContent = used;
            document.getElementById('totalCount').textContent = allCodes.length;
            filterCodes();
        });

        function filterCodes() {
            const q = (document.getElementById('searchCodeInput').value || '').trim().toLowerCase();
            let filtered = allCodes;

            if (currentTab === 'available') filtered = filtered.filter(c => !c.isUsed);
            if (currentTab === 'used') filtered = filtered.filter(c => c.isUsed);

            if (q) {
                filtered = filtered.filter(c => 
                    (c.code || c.key || '').toLowerCase().includes(q) ||
                    (c.usedBy || '').toLowerCase().includes(q) ||
                    (c.phone || '').includes(q)
                );
            }

            renderCodes(filtered);
        }

        function renderCodes(filtered) {
            const container = document.getElementById('codesContainer');

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><div>🔑</div><p>لا توجد أكواد مطابقة</p></div>`;
                return;
            }

            container.innerHTML = filtered.map(item => {
                const date = item.createdAt ? new Date(item.createdAt).toLocaleDateString('ar-EG', { year: 'numeric', month: 'short', day: 'numeric' }) : '';
                const codeVal = item.code || item.key;
                if (!item.isUsed) {
                    return `
                        <div class="code-item available">
                            <div onclick="copyCode('${codeVal}')" style="flex:1; cursor:pointer;">
                                <div class="code-text">${codeVal}</div>
                                <div class="copy-hint">اضغط لنسخ الكود 📋 • ${date}</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span class="badge-available">متاح ✅</span>
                                <button onclick="sendCodeWhatsApp('${codeVal}')" style="background:#DCFCE7; border:1px solid #BBF7D0; color:#166534; padding:6px 10px; border-radius:8px; cursor:pointer; font-size:12px; font-weight:700;" title="إرسال عبر واتساب"><i class="fa-brands fa-whatsapp"></i> واتساب</button>
                                <button onclick="deleteSingleCode('${codeVal}')" style="background:#FEE2E2; border:1px solid #FECACA; color:#DC2626; padding:6px 10px; border-radius:8px; cursor:pointer; font-size:12px;" title="حذف الكود"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>`;
                } else {
                    return `
                        <div class="code-item">
                            <div style="flex:1;">
                                <div class="code-text" style="color: rgba(0,0,0,0.35); text-decoration: line-through;">${codeVal}</div>
                                <div class="code-date">تم التفعيل بواسطة: <b>${item.usedBy || 'طالب مسجل'}</b> ${item.phone ? `(${item.phone})` : ''}</div>
                            </div>
                            <div style="display:flex; align-items:center; gap:8px;">
                                <span class="badge-used">مستخدم 🔴</span>
                                <button onclick="deleteSingleCode('${codeVal}')" style="background:#FEE2E2; border:1px solid #FECACA; color:#DC2626; padding:6px 10px; border-radius:8px; cursor:pointer; font-size:12px;" title="حذف الكود"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        </div>`;
                }
            }).join('');
        }

        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                showToast(`📋 تم نسخ الكود: ${code}`);
            }).catch(() => {
                showToast("الكود: " + code);
            });
        }
    </script>
</body>
</html>
