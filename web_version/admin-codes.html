<body>

<div class="admin-layout">
    <main class="main-stage">
        <!-- Top Bar -->
        <div class="header-bar">
            <div style="display: flex; align-items: center; gap: 12px;">
                <a href="admin-panel.html" style="width: 40px; height: 40px; border-radius: 50%; background: var(--bg-surface); border: 1px solid var(--border-card); display: flex; align-items: center; justify-content: center; color: var(--text-title); text-decoration: none;">

            <div class="luxury-card" style="flex-direction: row; align-items: center; gap: 14px;">
                <div style="width: 50px; height: 50px; border-radius: 50%; background: #ECFDF5; color: #059669; display: flex; align-items: center; justify-content: center; font-size: 22px;">

<script>
    let allCodesList = [];

    document.addEventListener('DOMContentLoaded', () => {
        loadActivationCodes();
    });

    function loadActivationCodes() {
        if (!window.database) return;

        database.ref('ActivationCodes').on('value', snap => {
            allCodesList = [];
            let active = 0, used = 0;

            if (snap.exists()) {
                snap.forEach(c => {
                    const code = c.val();
                    const item = { id: c.key, ...code };
                    allCodesList.push(item);
                    if (item.isUsed) used++; else active++;
                });
            }

            document.getElementById('totalCodesCount').textContent = allCodesList.length;
            document.getElementById('activeCodesCount').textContent = active;
            document.getElementById('usedCodesCount').textContent = used;

            renderCodesTable(allCodesList);
        });
    }

    function renderCodesTable(list) {
        const tbody = document.getElementById('codesTableBody');
        if (list.length === 0) {
            tbody.innerHTML = '<tr><td colspan="7" style="text-align: center; padding: 40px; color: var(--text-muted);">لا توجد أكواد تفعيل حالياً. اضغط "توليد أكواد جديدة" لإنشاء باقة.</td></tr>';
            return;
        }

        tbody.innerHTML = list.map(c => `
            <tr>
                <td><span class="code-box">${c.code || c.id}</span></td>
                <td>${c.subject || 'جميع المواد (شامل)'}</td>
                <td>${c.days || 30} يوم</td>
                <td>
                    ${c.isUsed ? 
                        '<span style="background: #EFF6FF; color: #2563EB; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 800;">مستخدم ✓</span>' : 
                        '<span style="background: #ECFDF5; color: #059669; padding: 3px 10px; border-radius: 12px; font-size: 11px; font-weight: 800;">متاح للتفعيل</span>'
                    }
                </td>
                <td style="color: var(--text-muted);">${c.usedByName || c.usedBy || '—'}</td>
                <td style="color: var(--text-muted); font-size: 11.5px;">${c.createdAt ? new Date(c.createdAt).toLocaleDateString('ar-EG') : 'الآن'}</td>
                <td>
                    <button onclick="copyCode('${c.code || c.id}')" style="padding: 5px 10px; background: var(--bg-surface-hover); border: 1px solid var(--border-card); border-radius: 6px; cursor: pointer; color: var(--gold-primary);" title="نسخ الكود">
                        <i class="fa-solid fa-copy"></i>
                    </button>
                    <button onclick="deleteCode('${c.id}')" style="padding: 5px 10px; background: #FFF1F2; border: 1px solid #FFE4E6; border-radius: 6px; cursor: pointer; color: #E11D48; margin-right: 4px;" title="حذف">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </td>
            </tr>
        `).join('');
    }

    function openGenerateModal() {
        Swal.fire({
            title: 'توليد أكواد تفعيل جديدة',
            html: `
                <div style="text-align: right; display: flex; flex-direction: column; gap: 12px; margin-top: 10px;">
                    <div>
                        <label style="font-size: 12.5px; font-weight: 800;">عدد الأكواد المراد إنشاؤها:</label>
                        <input id="swalCount" type="number" value="10" min="1" max="100" style="width: 100%; height: 40px; border: 1px solid #EFE8DC; border-radius: 8px; padding: 0 12px; font-weight: 800;">
                    </div>
                    <div>
                        <label style="font-size: 12.5px; font-weight: 800;">مدة الصلاحية:</label>
                        <select id="swalDays" style="width: 100%; height: 40px; border: 1px solid #EFE8DC; border-radius: 8px; padding: 0 12px; font-weight: 800;">
                            <option value="30">شهر كامل (30 يوم)</option>
                            <option value="90">فصل دراسي (90 يوم)</option>
                            <option value="180">فصلين دراسيين (180 يوم)</option>
                            <option value="365">سنة كاملة (365 يوم)</option>
                        </select>
                    </div>
                    <div>
                        <label style="font-size: 12.5px; font-weight: 800;">المقرر الدراسي:</label>
                        <select id="swalSubject" style="width: 100%; height: 40px; border: 1px solid #EFE8DC; border-radius: 8px; padding: 0 12px; font-weight: 800;">
                            <option value="جميع المواد (شامل)">جميع المواد (اشتراك عام)</option>
                            <option value="طريقة العمل مع الأفراد">طريقة العمل مع الأفراد</option>
                            <option value="طريقة العمل مع الجماعات">طريقة العمل مع الجماعات</option>
                            <option value="تنظيم وإدارة المجتمعات">تنظيم وإدارة المجتمعات</option>
                            <option value="سياسات الرعاية الاجتماعية">سياسات الرعاية الاجتماعية</option>
                            <option value="الخدمة الاجتماعية في مجال طبي">الخدمة الاجتماعية في مجال طبي</option>
                            <option value="تدريب ميداني">تدريب ميداني</option>
                            <option value="مشروع تخرج">مشروع تخرج</option>
                        </select>
                    </div>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'توليد وحفظ في Firebase',
            cancelButtonText: 'إلغاء',
            confirmButtonColor: '#C28B38',
            preConfirm: () => {
                const count = parseInt(document.getElementById('swalCount').value) || 1;
                const days = parseInt(document.getElementById('swalDays').value) || 30;
                const subject = document.getElementById('swalSubject').value;
                return { count, days, subject };
            }
        }).then(res => {
            if (res.isConfirmed && res.value) {
                generateBatchCodes(res.value);
            }
        });
    }

    function generateBatchCodes({ count, days, subject }) {
        if (!window.database) return;

        for (let i = 0; i < count; i++) {
            const randomCode = 'KHETA-' + Math.floor(100000 + Math.random() * 900000);
            const codeData = {
                code: randomCode,
                days: days,
                subject: subject,
                isUsed: false,
                createdAt: Date.now()
            };
            database.ref('ActivationCodes').push(codeData);
        }

        Swal.fire({
            icon: 'success',
            title: 'تم التوليد بنجاح',
            text: `تم إنشاء ${count} كود تفعيل وحفظها في قاعدة البيانات.`,
            confirmButtonColor: '#C28B38'
        });
    }

    function copyCode(code) {
        navigator.clipboard.writeText(code);
        Swal.fire({
            toast: true,
            position: 'top-end',
            icon: 'success',
            title: 'تم نسخ الكود: ' + code,
            showConfirmButton: false,
            timer: 2000
        });
    }

    function deleteCode(id) {
        Swal.fire({
            title: 'تأكيد الحذف',
            text: 'هل أنت متأكد من حذف هذا الكود نهائياً؟',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'نعم، احذف',
            cancelButtonText: 'إلغاء',
            confirmButtonColor: '#E11D48'
        }).then(res => {
            if (res.isConfirmed) {
                database.ref('ActivationCodes/' + id).remove();
            }
        });
    }

    function filterCodesTable(q) {
        const term = q.trim().toLowerCase();
        const filtered = allCodesList.filter(c => 
            (c.code && c.code.toLowerCase().includes(term)) ||
            (c.subject && c.subject.toLowerCase().includes(term)) ||
            (c.usedByName && c.usedByName.toLowerCase().includes(term))
        );
        renderCodesTable(filtered);
    }
</script>
</body>
