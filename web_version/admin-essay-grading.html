<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>تصحيح الإجابات المقالية | ELKHETA</title><link rel="stylesheet" href="desktop-theme.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"><script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script><script src="firebase-config.js"></script><style>
:root{--gold:#d49a3a;--ink:#142033;--muted:#64748b;--bg:#f7f4ee;--card:#fff;--border:#eadfce}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Cairo,Arial;color:var(--ink)}.top{background:linear-gradient(120deg,#101c31,#1d3150);color:#fff;padding:28px clamp(18px,5vw,70px);display:flex;justify-content:space-between;gap:20px;align-items:center}.top h1{margin:0;font-size:clamp(22px,3vw,34px)}.top p{margin:8px 0 0;color:#c9d5e5}.wrap{max-width:1250px;margin:28px auto;padding:0 18px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.stat,.submission,.answer{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 8px 26px #6b4b1510}.stat b{font-size:28px;color:var(--gold);display:block}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.toolbar input,.toolbar select{padding:12px 14px;border:1px solid var(--border);border-radius:12px;background:white;font-family:inherit}.submission{margin:16px 0}.subhead{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid var(--border);padding-bottom:14px}.badge{padding:5px 10px;border-radius:20px;background:#fff5dc;color:#956017;font-size:12px}.answer{margin-top:14px;background:#fffdfa}.answer h3{margin:0 0 12px;font-size:16px}.answer-text{white-space:pre-wrap;line-height:1.9;background:#f8fafc;padding:14px;border-radius:12px;border:1px solid #e8edf3}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.row input{width:100px;padding:9px;border:1px solid var(--border);border-radius:9px}.row textarea{width:100%;min-height:70px;padding:10px;border:1px solid var(--border);border-radius:9px;font-family:inherit}.btn{border:0;border-radius:10px;padding:10px 16px;font-family:inherit;cursor:pointer}.save{background:var(--gold);color:#fff}.send{background:#168f68;color:#fff}.empty{text-align:center;padding:55px;color:var(--muted)}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}.top{display:block}.subhead{display:block}.subhead .badge{display:inline-block;margin-top:8px}}
</style></head><body><header class="top"><div><h1><i class="fa-solid fa-pen-ruler"></i> تصحيح الإجابات المقالية</h1><p>مراجعة إجابات الطلاب واعتماد الدرجات وإرسال التقرير</p></div><a href="admin-panel.html" style="color:#fff">لوحة الإدارة <i class="fa-solid fa-arrow-left"></i></a></header><main class="wrap"><section class="stats"><div class="stat"><b id="allCount">0</b>إجمالي الإجابات</div><div class="stat"><b id="pendingCount">0</b>بانتظار المراجعة</div><div class="stat"><b id="gradedCount">0</b>تم تصحيحها</div><div class="stat"><b id="studentsCount">0</b>طلاب</div></section><div class="toolbar"><input id="search" placeholder="ابحث باسم الطالب أو الكود أو الامتحان"><select id="status"><option value="all">كل الحالات</option><option value="pending">بانتظار المراجعة</option><option value="graded">تم التصحيح</option></select></div><div id="list"><div class="empty">جاري تحميل الإجابات المقالية...</div></div></main><script>
const db=window.database||firebase.database();let rows=[];const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
function render(){const q=(document.getElementById('search').value||'').toLowerCase(), st=document.getElementById('status').value;const filtered=rows.filter(r=>(st==='all'||r.status===st)&&(`${r.studentName} ${r.studentCode} ${r.examTitle}`.toLowerCase().includes(q)));document.getElementById('allCount').textContent=rows.length;document.getElementById('pendingCount').textContent=rows.filter(r=>r.status==='pending').length;document.getElementById('gradedCount').textContent=rows.filter(r=>r.status==='graded').length;document.getElementById('studentsCount').textContent=new Set(rows.map(r=>r.studentCode)).size;const el=document.getElementById('list');if(!filtered.length){el.innerHTML='<div class="empty">لا توجد إجابات مقالية مطابقة</div>';return}el.innerHTML=filtered.map(r=>`<article class="submission"><div class="subhead"><div><strong>${esc(r.studentName)}</strong> <span class="badge">${esc(r.studentCode)}</span><div>${esc(r.examTitle)} · ${esc(r.subject)}</div></div><span class="badge">${r.status==='graded'?'تم التصحيح':'بانتظار المراجعة'}</span></div>${r.answers.map((a,i)=>`<div class="answer"><h3>سؤال مقالي ${i+1}: ${esc(a.question)}</h3><div class="answer-text">${esc(a.answer||'لم يكتب الطالب إجابة')}</div><div class="row"><label>الدرجة: <input type="number" min="0" step="0.5" value="${a.grade??''}" data-grade="${r.id}|${i}"></label><textarea placeholder="ملاحظات المصحح" data-note="${r.id}|${i}">${esc(a.note||'')}</textarea><button class="btn save" onclick="saveGrade('${r.id}',${i})">حفظ التصحيح</button></div></div>`).join('')}<div class="row"><button class="btn send" onclick="sendReport('${r.studentPhone||''}','${esc(r.studentName)}','${esc(r.examTitle)}')"><i class="fa-brands fa-whatsapp"></i> إرسال إشعار واتساب</button></div></article>`).join('')}
function load(){db.ref('ExamResults').on('value',snap=>{rows=[];snap.forEach(c=>{const v=c.val()||{};if(Array.isArray(v.essayAnswers)&&v.essayAnswers.length)rows.push({id:c.key,...v,status:v.essayGradingStatus||'pending',answers:v.essayAnswers})});render()})}
async function saveGrade(id,i){const r=rows.find(x=>x.id===id);if(!r)return;const grade=document.querySelector(`[data-grade="${id}|${i}"]`).value;const note=document.querySelector(`[data-note="${id}|${i}"]`).value;r.answers[i].grade=grade===''?null:Number(grade);r.answers[i].note=note;r.status='graded';await db.ref('ExamResults/'+id).update({essayAnswers:r.answers,essayGradingStatus:'graded',essayGradedAt:Date.now()});Swal.fire({icon:'success',title:'تم حفظ التصحيح',timer:1300,showConfirmButton:false})}
function sendReport(phone,name,title){if(!phone)return Swal.fire('لا يوجد رقم واتساب','أضف الرقم بعد التحقق منه أولًا','info');location.href='https://wa.me/'+phone.replace(/\D/g,'')+'?text='+encodeURIComponent(`مرحباً ${name}، تم تحديث تقريرك في اختبار ${title}. يمكنك الدخول للمنصة لمراجعة الإجابات المقالية.`)}document.getElementById('search').oninput=render;document.getElementById('status').onchange=render;load();
</script></body></html>
