<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تذاكر الدعم الفني - منصة الخطة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="mysql-api.js"></script>
    <script src="security-validator.js"></script>
    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1D4ED8;
            --bg-body: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            direction: rtl;
        }

        .support-wrapper {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Topbar */
        .topbar {
            background: #FFF;
            border-radius: 20px;
            padding: 12px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
            border: 1px solid var(--border-color);
        }

        .back-btn {
            width: 40px; height: 40px;
            border-radius: 12px;
            background: #F1F5F9;
            border: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main);
            text-decoration: none;
            font-size: 16px;
        }

        .page-title {
            font-size: 18px;
            font-weight: 900;
            color: var(--text-main);
        }

        /* Hero Banner */
        .support-hero {
            background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%);
            color: white;
            padding: 24px 20px;
            border-radius: 24px;
            box-shadow: 0 10px 25px rgba(37, 99, 235, 0.25);
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .hero-icon {
            width: 56px; height: 56px;
            border-radius: 18px;
            background: rgba(255, 255, 255, 0.15);
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; flex-shrink: 0;
        }

        .hero-text h2 { font-size: 20px; font-weight: 900; margin-bottom: 4px; }
        .hero-text p { font-size: 13px; color: #DBEAFE; font-weight: 600; }

        /* Card Section */
        .card {
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
        }

        .section-header {
            font-size: 16px;
            font-weight: 900;
            color: var(--text-main);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 800;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1.5px solid var(--border-color);
            background: #F8FAFC;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: var(--primary);
            background: #FFF;
        }

        textarea.form-control {
            min-height: 100px;
            resize: vertical;
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            border-radius: 14px;
            border: none;
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: white;
            font-size: 15px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(37, 99, 235, 0.3);
            transition: transform 0.2s;
        }

        .submit-btn:active {
            transform: scale(0.98);
        }

        /* Ticket Cards List */
        .ticket-item {
            background: #F8FAFC;
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .ticket-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .ticket-cat {
            font-size: 12px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
            background: #EFF6FF;
            color: var(--primary);
        }

        .status-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 4px 10px;
            border-radius: 20px;
        }

        .status-open { background: #FEF3C7; color: #D97706; }
        .status-resolved { background: #DCFCE7; color: #15803D; }

        .ticket-msg {
            font-size: 13.5px;
            font-weight: 700;
            color: var(--text-main);
            line-height: 1.6;
            margin-bottom: 10px;
        }

        .ticket-reply {
            background: #ECFDF5;
            border: 1px solid #A7F3D0;
            border-radius: 12px;
            padding: 12px;
            font-size: 13px;
            font-weight: 700;
            color: #065F46;
        }

        .reply-header {
            font-size: 11px;
            font-weight: 900;
            color: #047857;
            margin-bottom: 4px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .empty-tickets {
            text-align: center;
            padding: 30px 10px;
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 700;
        }
    </style>
</head>
<body>

    <div class="support-wrapper">
        <!-- Topbar -->
        <header class="topbar">
            <a href="home.html" class="back-btn" title="رجوع للرئيسية">
                <i class="fas fa-arrow-right"></i>
            </a>
            <div class="page-title">💬 تذاكر الدعم الفني</div>
            <div style="width: 40px;"></div>
        </header>

        <!-- Hero -->
        <div class="support-hero">
            <div class="hero-icon">🎧</div>
            <div class="hero-text">
                <h2>فريق الدعم الفني معك دائماً</h2>
                <p>قدم استفسارك أو مشكلتك وسيقوم الفريق الطبي/المشرفين بالرد عليك قريباً.</p>
            </div>
        </div>

        <!-- Create Ticket Form -->
        <div class="card">
            <div class="section-header">
                <i class="fas fa-paper-plane" style="color: var(--primary);"></i>
                <span>تقديم تذكرة جديدة</span>
            </div>
            <form id="ticketForm" onsubmit="handleTicketSubmit(event)">
                <div class="form-group">
                    <label>نوع الاستفسار / المشكلة</label>
                    <select id="ticketCategory" class="form-control">
                        <option value="شحن أكواد">💳 شحن كود / كارت</option>
                        <option value="مشكلة في فيديو">📽️ مشكلة في عرض المحاضرات</option>
                        <option value="امتحانات وبنك أسئلة">📝 الامتحانات وبنك الأسئلة</option>
                        <option value="استفسار دراسي">🎓 استفسار للمدرسين والمشرفين</option>
                        <option value="عام">💬 استفسار عام</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>المادة الدراسية (اختياري)</label>
                    <input type="text" id="subjectTitle" class="form-control" placeholder="مثال: مادة الخدمة الاجتماعية مع الأفراد">
                </div>
                <div class="form-group">
                    <label>تفاصيل الرسالة أو المشكلة</label>
                    <textarea id="ticketMessage" class="form-control" required placeholder="اكتب تفاصيل مشكلتك هنا بوضوح..."></textarea>
                </div>
                <button type="submit" id="submitBtn" class="submit-btn">
                    🚀 إرسال التذكرة الآن
                </button>
            </form>
        </div>

        <!-- History -->
        <div class="card">
            <div class="section-header">
                <i class="fas fa-history" style="color: var(--primary);"></i>
                <span>تذاكري واستفساراتي السابقة</span>
            </div>
            <div id="ticketsList">
                <div class="empty-tickets">⏳ جاري تحميل التذاكر السابقة...</div>
            </div>
        </div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user')) || {};
        const studentCode = user.studentCode || user.code || localStorage.getItem('studentCode') || '';
        const studentName = user.fullName || user.full_name || 'طالب';

        if (!studentCode) {
            Swal.fire({
                title: 'يرجى تسجيل الدخول أولاً',
                icon: 'warning',
                confirmButtonText: 'حسناً'
            }).then(() => location.href = 'index.html');
        }

        async function loadStudentTickets() {
            const listEl = document.getElementById('ticketsList');
            try {
                const res = await ElkhetaAPI.getSupportTickets(studentCode);
                if (res && res.success && res.tickets && res.tickets.length > 0) {
                    listEl.innerHTML = res.tickets.map(t => {
                        const statusBadge = t.status === 'resolved' 
                            ? `<span class="status-badge status-resolved">🟢 تم الرد والحل</span>`
                            : `<span class="status-badge status-open">🟡 قيد الانتظار</span>`;
                        
                        const dateStr = t.created_at ? new Date(t.created_at).toLocaleString('ar-EG') : '';

                        const replyHtml = t.admin_reply ? `
                            <div class="ticket-reply">
                                <div class="reply-header">
                                    <i class="fas fa-user-shield"></i>
                                    <span>رد المشرف / الإدارة:</span>
                                </div>
                                <div>${SecurityValidator.sanitizeText(t.admin_reply)}</div>
                            </div>
                        ` : '';

                        return `
                            <div class="ticket-item">
                                <div class="ticket-header">
                                    <span class="ticket-cat">${t.category || 'عام'} ${t.subject_title ? '• ' + t.subject_title : ''}</span>
                                    ${statusBadge}
                                </div>
                                <div class="ticket-msg">${SecurityValidator.sanitizeText(t.message)}</div>
                                ${replyHtml}
                                <div style="font-size: 10.5px; color: #94A3B8; margin-top: 8px; text-align: left;">${dateStr}</div>
                            </div>
                        `;
                    }).join('');
                } else {
                    listEl.innerHTML = `<div class="empty-tickets">📭 لا توجد تذاكر سابقة. يمكنك تقديم تذكرة جديدة أعلاه.</div>`;
                }
            } catch (err) {
                console.error(err);
                listEl.innerHTML = `<div class="empty-tickets">تعذر تحميل التذاكر السابقة</div>`;
            }
        }

        async function handleTicketSubmit(e) {
            e.preventDefault();
            const category = document.getElementById('ticketCategory').value;
            const subject = document.getElementById('subjectTitle').value.trim();
            const message = document.getElementById('ticketMessage').value.trim();

            if (!message) return;

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerText = 'جاري إرسال التذكرة...';

            try {
                const res = await ElkhetaAPI.createSupportTicket(studentCode, studentName, subject, category, message);
                if (res && res.success) {
                    Swal.fire({
                        title: 'تم الإرسال بنجاح! 🎉',
                        text: 'تم إرسال تذكرة الدعم الفني وسيقوم المشرفون بالرد عليك في أقرب وقت.',
                        icon: 'success',
                        confirmButtonText: 'حسناً'
                    });
                    document.getElementById('ticketForm').reset();
                    loadStudentTickets();
                } else {
                    Swal.fire('خطأ', res.error || 'تعذر إرسال التذكرة', 'error');
                }
            } catch(err) {
                Swal.fire('خطأ', err.message, 'error');
            } finally {
                btn.disabled = false;
                btn.innerText = '🚀 إرسال التذكرة الآن';
            }
        }

        loadStudentTickets();
    </script>
    <script src="student-drawer.js?v=2027"></script>
    <script src="student-guard.js"></script>
</body>
</html>
