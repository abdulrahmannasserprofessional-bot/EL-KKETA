<body>

<main class="main-stage">
    <div style="display: flex; align-items: center; justify-content: space-between;">
        <div style="display: flex; align-items: center; gap: 12px;">
            <a href="admin-exams.html" style="width: 40px; height: 40px; border-radius: 50%; background: var(--bg-surface); border: 1px solid var(--border-card); display: flex; align-items: center; justify-content: center; color: var(--text-title); text-decoration: none;">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <div>
                <h1 style="font-size: 22px; font-weight: 900; color: var(--text-title);">بنك الأسئلة واستيراد وتصدير القوالب</h1>
                <p style="font-size: 12.5px; color: var(--text-muted);">استيراد الأسئلة دفعة واحدة من ملفات JSON / Excel ونسخ بنك الأسئلة احتياطياً</p>
            </div>
        </div>
    </div>

    <!-- Import Card -->
    <div class="luxury-card">
        <h3 style="font-size: 16px; font-weight: 900; color: var(--text-title);">
            <i class="fa-solid fa-cloud-arrow-up" style="color: var(--gold-primary);"></i>
            <span>استيراد قوالب أسئلة جاهزة</span>
        </h3>

        <div class="dropzone" onclick="document.getElementById('fileInput').click()">
            <input type="file" id="fileInput" accept=".json,.xlsx,.csv,.txt" style="display: none;" onchange="handleFileSelected(this.files)">
            <i class="fa-solid fa-file-import" style="font-size: 40px; color: var(--gold-primary); margin-bottom: 12px;"></i>
            <h4 style="font-size: 16px; font-weight: 800;">اضغط هنا لاختيار ملف الأسئلة أو اسحبه وأفلته هنا</h4>
            <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;">يدعم الملفات بصيغة JSON و Excel و Word و CSV</p>
        </div>

        <div style="display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--border-card); padding-top: 14px;">
            <button onclick="downloadSampleTemplate()" style="padding: 8px 18px; background: var(--bg-surface-hover); border: 1px solid var(--border-card); border-radius: var(--radius-md); font-size: 12.5px; font-weight: 800; cursor: pointer; color: var(--text-title);">
                <i class="fa-solid fa-download"></i>
                <span>تحميل نموذج قالب أسئلة فارغ (JSON)</span>
            </button>
            <button onclick="exportAllExams()" style="padding: 8px 22px; background: var(--gold-gradient); color: #fff; border: none; border-radius: var(--radius-md); font-size: 12.5px; font-weight: 800; cursor: pointer;">
                <i class="fa-solid fa-file-export"></i>
                <span>تصدير جميع امتحانات المنصة كنسخة احتياطية</span>
            </button>
        </div>
    </div>
</main>

<script>
    function handleFileSelected(files) {
        if (!files || files.length === 0) return;
        const file = files[0];
        const reader = new FileReader();

        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                if (Array.isArray(data) && window.database) {
                    data.forEach(item => database.ref('Exams').push(item));
                    Swal.fire({
                        icon: 'success',
                        title: 'تم الاستيراد بنجاح',
                        text: `تم استيراد ${data.length} امتحانات وإضافتها إلى بنك الأسئلة.`,
                        confirmButtonColor: '#C28B38'
                    });
                } else {
                    Swal.fire({ icon: 'error', title: 'صيغة غير صالحة', text: 'يرجى التأكد من أن الملف يحتوي على مصفوفة امتحانات بصيغة JSON الصحيحة.', confirmButtonColor: '#C28B38' });
                }
            } catch(err) {
                Swal.fire({ icon: 'error', title: 'خطأ في قراءة الملف', text: 'حدث خطأ أثناء فك تشفير الملف.', confirmButtonColor: '#C28B38' });
            }
        };

        reader.readAsText(file);
    }

    function downloadSampleTemplate() {
        const sample = [
            {
                subject: "طريقة العمل مع الأفراد",
                subjectKey: "افراد",
                title: "امتحان تجريبي نموذجي",
                duration: "30 دقيقة",
                passingScore: "70%",
                questions: [
                    { q: "نص السؤال الأول هنا؟", options: ["الخيار الصحيح", "خيار خاطئ 1", "خيار خاطئ 2", "خيار خاطئ 3"], correct: 0 }
                ]
            }
        ];

        const blob = new Blob([JSON.stringify(sample, null, 2)], { type: 'application/json' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'ELKHETA_Exam_Template_Sample.json';
        a.click();
    }

    function exportAllExams() {
        if (!window.database) return;

        database.ref('Exams').once('value', snap => {
            let list = [];
            if (snap.exists()) {
                snap.forEach(c => list.push(c.val()));
            }

            const blob = new Blob([JSON.stringify(list, null, 2)], { type: 'application/json' });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = `ELKHETA_Exams_Backup_${Date.now()}.json`;
            a.click();

            Swal.fire({
                icon: 'success',
                title: 'تم التصدير',
                text: 'تم تنزيل النسخة الاحتياطية لجميع الامتحانات.',
                confirmButtonColor: '#C28B38'
            });
        });
    }
</script>
</body>
