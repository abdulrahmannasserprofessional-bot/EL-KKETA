<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>منظم الدراسة والتركيز الذكي - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Alexandria:wght@400;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="motion-fx.css?v=2.0">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <script src="motion-fx.js?v=2.0" defer></script>
    <style>
        :root {
            --primary: #3B82F6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --primary-dark: #1D4ED8;
            --secondary: #6366F1;
            --accent-purple: #8B5CF6;
            --accent-cyan: #06B6D4;
            --accent-emerald: #10B981;
            --danger: #EF4444;
            --warning: #F59E0B;
            --bg: #070D1E;
            --surface: rgba(15, 23, 42, 0.85);
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --border: rgba(255, 255, 255, 0.1);
            --glass-blur: blur(16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(37, 99, 235, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.05) 0%, transparent 60%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 110px;
            overflow-x: hidden;
            direction: rtl;
        }

        /* Topbar Header */
        .app-topbar {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            padding: 14px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .topbar-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .back-btn {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .back-btn:hover {
            background: rgba(59, 130, 246, 0.2);
            border-color: #60A5FA;
            color: #60A5FA;
            transform: scale(1.05);
        }

        .topbar-title {
            font-family: 'Alexandria', sans-serif;
            font-size: 18px;
            font-weight: 800;
            color: #FFFFFF;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .main-container {
            max-width: 880px;
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Pomodoro Timer HUD Card */
        .pomodoro-hud-card {
            background: linear-gradient(135deg, rgba(30, 41, 59, 0.85) 0%, rgba(15, 23, 42, 0.95) 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 28px;
            padding: 28px 24px;
            text-align: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            backdrop-filter: var(--glass-blur);
        }

        .pomodoro-hud-card::before {
            content: '';
            position: absolute;
            top: -60px;
            right: 50%;
            transform: translateX(50%);
            width: 220px;
            height: 220px;
            background: radial-gradient(circle, rgba(59, 130, 246, 0.25) 0%, transparent 70%);
            pointer-events: none;
        }

        .pomo-mode-pills {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            position: relative;
            z-index: 2;
        }

        .pomo-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-sub);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s;
        }
        .pomo-pill:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #FFFFFF;
        }
        .pomo-pill.active {
            background: linear-gradient(135deg, #3B82F6, #2563EB);
            border-color: #60A5FA;
            color: #FFFFFF;
            box-shadow: 0 0 16px rgba(59, 130, 246, 0.4);
        }

        .timer-display-ring-wrap {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 10px auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .timer-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-svg circle {
            fill: none;
            stroke-width: 8;
        }

        .timer-bg-circle {
            stroke: rgba(255, 255, 255, 0.06);
        }

        .timer-progress-circle {
            stroke: #3B82F6;
            stroke-linecap: round;
            stroke-dasharray: 565;
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 0.5s ease;
            filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.6));
        }

        .timer-digits {
            font-family: 'Alexandria', monospace;
            font-size: 44px;
            font-weight: 900;
            color: #FFFFFF;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
            z-index: 2;
        }

        .pomo-status-text {
            font-size: 14px;
            color: #93C5FD;
            font-weight: 600;
            margin-bottom: 20px;
        }

        .pomo-controls-row {
            display: flex;
            justify-content: center;
            gap: 14px;
            flex-wrap: wrap;
        }

        .btn-pomo-main {
            background: linear-gradient(135deg, #3B82F6 0%, #2563EB 100%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 12px 32px;
            border-radius: 16px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(37, 99, 235, 0.4);
            transition: all 0.25s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .btn-pomo-main:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 28px rgba(37, 99, 235, 0.6);
        }

        .btn-pomo-sec {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.12);
            color: #CBD5E1;
            padding: 12px 22px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: inherit;
        }
        .btn-pomo-sec:hover {
            background: rgba(255, 255, 255, 0.15);
            color: #FFFFFF;
        }

        /* Task Planner Section */
        .tasks-section-card {
            background: rgba(15, 23, 42, 0.75);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 26px;
            padding: 24px;
            backdrop-filter: var(--glass-blur);
            box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .tasks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 14px;
        }

        .tasks-title-wrap {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .tasks-badge-count {
            background: rgba(59, 130, 246, 0.18);
            border: 1px solid rgba(59, 130, 246, 0.35);
            color: #93C5FD;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
        }

        .add-task-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 20px;
            padding: 14px;
        }

        .add-task-input-row {
            display: flex;
            gap: 10px;
        }

        .task-input-field {
            flex: 1;
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 14px;
            padding: 12px 16px;
            color: #FFFFFF;
            font-family: inherit;
            font-size: 14.5px;
            outline: none;
            transition: all 0.2s;
        }
        .task-input-field:focus {
            border-color: #3B82F6;
            box-shadow: 0 0 12px rgba(59, 130, 246, 0.3);
        }

        .btn-add-task {
            background: linear-gradient(135deg, #10B981, #059669);
            border: none;
            color: white;
            padding: 0 22px;
            border-radius: 14px;
            font-weight: 800;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: inherit;
        }
        .btn-add-task:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 18px rgba(16, 185, 129, 0.4);
        }

        .task-priority-chips {
            display: flex;
            gap: 8px;
            align-items: center;
            flex-wrap: wrap;
        }

        .priority-chip {
            font-size: 11.5px;
            font-weight: 700;
            padding: 5px 12px;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            transition: all 0.2s;
        }
        .priority-chip.active-urgent {
            background: rgba(239, 68, 68, 0.2);
            border-color: #EF4444;
            color: #FCA5A5;
        }
        .priority-chip.active-medium {
            background: rgba(245, 158, 11, 0.2);
            border-color: #F59E0B;
            color: #FCD34D;
        }
        .priority-chip.active-normal {
            background: rgba(59, 130, 246, 0.2);
            border-color: #3B82F6;
            color: #93C5FD;
        }

        /* Task Cards */
        .tasks-items-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item-card {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 18px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            transition: all 0.25s;
        }
        .task-item-card:hover {
            background: rgba(30, 41, 59, 0.85);
            border-color: rgba(255, 255, 255, 0.15);
        }
        .task-item-card.completed {
            opacity: 0.55;
            background: rgba(15, 23, 42, 0.4);
        }
        .task-item-card.completed .task-text-title {
            text-decoration: line-through;
            color: var(--text-sub);
        }

        .task-left-content {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .task-checkbox-custom {
            width: 26px;
            height: 26px;
            border-radius: 8px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            color: white;
            font-size: 13px;
        }
        .task-checkbox-custom:hover {
            border-color: #10B981;
        }
        .task-checkbox-custom.checked {
            background: #10B981;
            border-color: #10B981;
            box-shadow: 0 0 10px rgba(16, 185, 129, 0.4);
        }

        .task-text-title {
            font-size: 15px;
            font-weight: 700;
            color: #F8FAFC;
            line-height: 1.5;
        }

        .task-tag-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 8px;
            margin-right: 8px;
        }
        .tag-urgent { background: rgba(239, 68, 68, 0.2); color: #F87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .tag-medium { background: rgba(245, 158, 11, 0.2); color: #FBBF24; border: 1px solid rgba(245, 158, 11, 0.3); }
        .tag-normal { background: rgba(59, 130, 246, 0.2); color: #60A5FA; border: 1px solid rgba(59, 130, 246, 0.3); }

        .btn-delete-task {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.2);
            color: #F87171;
            width: 34px;
            height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 14px;
        }
        .btn-delete-task:hover {
            background: #EF4444;
            color: white;
            transform: scale(1.05);
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            padding: 10px 0 14px;
            z-index: 100;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.5);
        }

        .nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            color: var(--text-sub);
            text-decoration: none;
            font-size: 11.5px;
            font-weight: 700;
            transition: all 0.2s;
            position: relative;
        }

        .nav-item i {
            font-size: 18px;
        }

        .nav-item.active, .nav-item:hover {
            color: var(--primary);
        }

        @media (max-width: 640px) {
            .app-topbar { padding: 12px 16px; }
            .main-container { padding: 14px 12px; gap: 16px; }
            .pomodoro-hud-card { padding: 20px 16px; }
            .timer-display-ring-wrap { width: 170px; height: 170px; }
            .timer-digits { font-size: 38px; }
            .add-task-input-row { flex-direction: column; }
            .btn-add-task { height: 46px; justify-content: center; }
        }
    </style>
</head>
<body>
    <!-- Topbar Navigation -->
    <header class="app-topbar">
        <div class="topbar-left">
            <a href="home.html" class="back-btn" title="العودة">
                <i class="fa-solid fa-arrow-right"></i>
            </a>
            <div class="topbar-title">
                <i class="fa-solid fa-stopwatch-20" style="color: #60A5FA;"></i>
                <span>منظم الدراسة والتركيز</span>
            </div>
        </div>
        <div>
            <span class="tasks-badge-count" id="headerStreakBadge">
                <i class="fa-solid fa-bolt" style="color: #FBBF24;"></i> جلسات اليوم: 0
            </span>
        </div>
    </header>

    <main class="main-container">
        <!-- Pomodoro Focus Timer HUD -->
        <section class="pomodoro-hud-card">
            <div class="pomo-mode-pills">
                <button class="pomo-pill active" onclick="setTimerMode('focus25', this)">🎯 تركيز (25 دقيقة)</button>
                <button class="pomo-pill" onclick="setTimerMode('focus50', this)">🚀 تركيز عميق (50 دقيقة)</button>
                <button class="pomo-pill" onclick="setTimerMode('break5', this)">☕ استراحة (5 دقائق)</button>
                <button class="pomo-pill" onclick="setTimerMode('break15', this)">🌴 راحة طويلة (15 دقيقة)</button>
            </div>

            <!-- Circular Progress Ring HUD -->
            <div class="timer-display-ring-wrap">
                <svg class="timer-svg" viewBox="0 0 200 200">
                    <circle class="timer-bg-circle" cx="100" cy="100" r="90"></circle>
                    <circle class="timer-progress-circle" id="timerProgressCircle" cx="100" cy="100" r="90"></circle>
                </svg>
                <div class="timer-digits" id="pomoDisplay">25:00</div>
            </div>

            <div class="pomo-status-text" id="pomoStatus">ركّز بكل طاقاتك بدون تشتيت، خطوتك نحو التفوق تبدأ الآن! 🎯</div>

            <!-- Controls -->
            <div class="pomo-controls-row">
                <button id="pomoToggleBtn" class="btn-pomo-main" onclick="togglePomodoro()">
                    <i class="fa-solid fa-play"></i>
                    <span>بدء المذاكرة</span>
                </button>
                <button class="btn-pomo-sec" onclick="resetPomodoro()">
                    <i class="fa-solid fa-rotate-left"></i>
                    <span>إعادة ضبط</span>
                </button>
            </div>
        </section>

        <!-- Tasks Planner Section -->
        <section class="tasks-section-card">
            <div class="tasks-header">
                <div class="tasks-title-wrap">
                    <i class="fa-solid fa-list-check" style="color: #38BDF8; font-size: 18px;"></i>
                    <h2 style="font-family: 'Alexandria'; font-size: 17px; color: #FFFFFF; font-weight: 800; margin: 0;">مهام المذاكرة والواجبات</h2>
                </div>
                <span class="tasks-badge-count" id="taskCount">0 مهام</span>
            </div>

            <!-- Add Task Form -->
            <div class="add-task-form">
                <div class="add-task-input-row">
                    <input type="text" id="taskInput" class="task-input-field" placeholder="اكتب اسم الدرس أو الواجب أو المادة...">
                    <button onclick="addTask()" class="btn-add-task">
                        <i class="fa-solid fa-plus"></i>
                        <span>إضافة</span>
                    </button>
                </div>
                <div class="task-priority-chips">
                    <span style="font-size: 12px; color: var(--text-sub);">الأولوية:</span>
                    <span class="priority-chip active-urgent" data-priority="urgent" onclick="selectPriority(this, 'urgent')">🔥 عاجل ومهم</span>
                    <span class="priority-chip" data-priority="medium" onclick="selectPriority(this, 'medium')">⭐ مذاكرة أساسية</span>
                    <span class="priority-chip" data-priority="normal" onclick="selectPriority(this, 'normal')">📝 حل وتدريب</span>
                </div>
            </div>

            <!-- Tasks List -->
            <div id="taskList" class="tasks-items-list">
                <div style="text-align: center; color: var(--text-sub); padding: 30px 10px;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size: 24px; margin-bottom: 8px;"></i>
                    <div>جاري تحميل مهامك الدراسية...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
        <a href="home.html" class="nav-item">
            <i class="fa-solid fa-house"></i>
            <span>الرئيسية</span>
        </a>
        <a href="courses.html" class="nav-item">
            <i class="fa-solid fa-graduation-cap"></i>
            <span>المواد</span>
        </a>
        <a href="planner.html" class="nav-item active">
            <i class="fa-solid fa-calendar-check"></i>
            <span>المنظم</span>
        </a>
        <a href="mistakes.html" class="nav-item">
            <i class="fa-solid fa-fire"></i>
            <span>الأخطاء</span>
        </a>
        <a href="profile.html" class="nav-item">
            <i class="fa-solid fa-user-astronaut"></i>
            <span>حسابي</span>
        </a>
    </nav>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="toast.js"></script>
    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) {
            window.location.href = "index.html";
        }

        const studentCode = user.studentCode || 'guest';
        const tasksRef = database.ref(`Students/${studentCode}/Tasks`);

        let currentPriority = 'urgent';
        function selectPriority(el, p) {
            document.querySelectorAll('.priority-chip').forEach(c => {
                c.className = 'priority-chip';
            });
            if (p === 'urgent') el.className = 'priority-chip active-urgent';
            else if (p === 'medium') el.className = 'priority-chip active-medium';
            else el.className = 'priority-chip active-normal';
            currentPriority = p;
        }

        // Load Tasks
        tasksRef.on('value', (snap) => {
            const listEl = document.getElementById('taskList');
            listEl.innerHTML = "";
            let count = 0;
            
            if (!snap.exists()) {
                listEl.innerHTML = `
                    <div style="text-align: center; color: var(--text-sub); padding: 35px 20px; background: rgba(0,0,0,0.15); border-radius: 16px; border: 1px dashed rgba(255,255,255,0.08);">
                        <i class="fa-solid fa-clipboard-check" style="font-size: 32px; color: #10B981; margin-bottom: 8px;"></i>
                        <div style="font-size: 14.5px; color: #F8FAFC; font-weight: 700;">لا توجد مهام دراسية مسجلة حالياً!</div>
                        <div style="font-size: 12.5px; margin-top: 4px;">ابدأ بإضافة أول درس أو مهمة لتنظيم وقتك بفاعلية.</div>
                    </div>
                `;
                document.getElementById('taskCount').innerText = "0 مهام";
                return;
            }

            snap.forEach((child) => {
                const taskId = child.key;
                const task = child.val();
                count++;

                const card = document.createElement('div');
                card.className = `task-item-card ${task.completed ? 'completed' : ''}`;
                
                let tagClass = 'tag-normal';
                let tagText = 'مهمة عامة';
                if (task.priority === 'urgent') { tagClass = 'tag-urgent'; tagText = '🔥 عاجل'; }
                else if (task.priority === 'medium') { tagClass = 'tag-medium'; tagText = '⭐ أساسي'; }
                else if (task.priority === 'normal') { tagClass = 'tag-normal'; tagText = '📝 تدريب'; }

                card.innerHTML = `
                    <div class="task-left-content">
                        <div class="task-checkbox-custom ${task.completed ? 'checked' : ''}" onclick="toggleTask('${taskId}', ${task.completed})">
                            ${task.completed ? '<i class="fa-solid fa-check"></i>' : ''}
                        </div>
                        <div>
                            <span class="task-tag-pill ${tagClass}">${tagText}</span>
                            <span class="task-text-title">${task.text}</span>
                        </div>
                    </div>
                    <button class="btn-delete-task" title="حذف المهمة" onclick="deleteTask('${taskId}')">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                listEl.appendChild(card);
            });

            document.getElementById('taskCount').innerText = `${count} مهام`;
        });

        // Add Task
        function addTask() {
            const input = document.getElementById('taskInput');
            const text = input.value.trim();
            if (text === "") {
                if (typeof showToast === 'function') showToast("يرجى كتابة عنوان المهمة أولاً", "warning");
                return;
            }

            tasksRef.push({
                text: text,
                priority: currentPriority,
                completed: false,
                createdAt: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                input.value = "";
                if (typeof showToast === 'function') showToast("تمت إضافة المهمة بنجاح 📋", "success");
            });
        }

        // Toggle Task
        function toggleTask(id, currentStatus) {
            tasksRef.child(id).update({
                completed: !currentStatus
            }).then(() => {
                if (!currentStatus && typeof showToast === 'function') {
                    showToast("أحسنت! أتممت هذه المهمة 🌟", "success");
                }
            });
        }

        // Delete Task
        function deleteTask(id) {
            Swal.fire({
                title: "حذف المهمة؟",
                text: "هل أنت متأكد من رغبتك في إزالة هذه المهمة من منظم دراستك؟",
                icon: "warning",
                background: "#0F172A",
                color: "#F8FAFC",
                showCancelButton: true,
                confirmButtonColor: "#EF4444",
                cancelButtonColor: "#475569",
                confirmButtonText: "نعم، حذف",
                cancelButtonText: "إلغاء"
            }).then((r) => { 
                if (r.isConfirmed) { 
                    tasksRef.child(id).remove().then(() => {
                        if (typeof showToast === 'function') showToast("تم حذف المهمة", "info");
                    }); 
                } 
            });
        }

        document.getElementById('taskInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addTask();
        });

        // Audio Beep generator for timer completion
        function playChime() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); // D5
                osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15); // A5
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.6);
                osc.start();
                osc.stop(ctx.currentTime + 0.6);
            } catch(e) {}
        }

        // Pomodoro Timer Logic
        let totalPomoSeconds = 25 * 60;
        let pomoSeconds = 25 * 60;
        let pomoInterval = null;
        let isRunning = false;
        let completedSessionsToday = parseInt(localStorage.getItem('pomo_sessions_today') || '0');

        function updateStreakBadge() {
            document.getElementById('headerStreakBadge').innerHTML = `<i class="fa-solid fa-bolt" style="color: #FBBF24;"></i> جلسات اليوم: ${completedSessionsToday}`;
        }
        updateStreakBadge();

        function setTimerMode(mode, btnEl) {
            document.querySelectorAll('.pomo-pill').forEach(b => b.classList.remove('active'));
            if (btnEl) btnEl.classList.add('active');

            clearInterval(pomoInterval);
            isRunning = false;
            document.getElementById('pomoToggleBtn').innerHTML = `<i class="fa-solid fa-play"></i><span>بدء المؤقت</span>`;

            if (mode === 'focus25') {
                totalPomoSeconds = 25 * 60;
                document.getElementById('pomoStatus').innerText = "ركّز لمدة 25 دقيقة بدون تشتيت 🎯";
            } else if (mode === 'focus50') {
                totalPomoSeconds = 50 * 60;
                document.getElementById('pomoStatus').innerText = "جلسة تركيز عميق لمدة 50 دقيقة 🚀";
            } else if (mode === 'break5') {
                totalPomoSeconds = 5 * 60;
                document.getElementById('pomoStatus').innerText = "استراحة قصيرة 5 دقائق ☕ تنفس واشرب ماء";
            } else if (mode === 'break15') {
                totalPomoSeconds = 15 * 60;
                document.getElementById('pomoStatus').innerText = "استراحة استرخاء 15 دقيقة 🌴 جدد نشاطك بالكامل";
            }

            pomoSeconds = totalPomoSeconds;
            updatePomoDisplay();
        }

        function updatePomoDisplay() {
            const m = Math.floor(pomoSeconds / 60);
            const s = pomoSeconds % 60;
            document.getElementById('pomoDisplay').innerText = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`;
            
            // Progress Ring calculation (Circumference = 2 * PI * 90 ≈ 565.48)
            const circumference = 565.48;
            const progress = (totalPomoSeconds - pomoSeconds) / totalPomoSeconds;
            const offset = circumference - (progress * circumference);
            const circle = document.getElementById('timerProgressCircle');
            if (circle) circle.style.strokeDashoffset = offset;
        }

        function togglePomodoro() {
            const btn = document.getElementById('pomoToggleBtn');
            const status = document.getElementById('pomoStatus');

            if (isRunning) {
                clearInterval(pomoInterval);
                isRunning = false;
                btn.innerHTML = `<i class="fa-solid fa-play"></i><span>استئناف المذاكرة</span>`;
                status.innerText = "المؤقت متوقف مؤقتاً ⏸️";
            } else {
                isRunning = true;
                btn.innerHTML = `<i class="fa-solid fa-pause"></i><span>إيقاف مؤقت</span>`;
                status.innerText = "ركّز بكل طاقاتك الآن! 🧠🔥";
                
                pomoInterval = setInterval(() => {
                    pomoSeconds--;
                    updatePomoDisplay();
                    if (pomoSeconds <= 0) {
                        clearInterval(pomoInterval);
                        isRunning = false;
                        playChime();
                        
                        completedSessionsToday++;
                        localStorage.setItem('pomo_sessions_today', completedSessionsToday);
                        updateStreakBadge();

                        Swal.fire({
                            title: "🎉 ممتاز! أتممت الجلسة بنجاح!",
                            text: "أحسنت الاستمرار والتركيز. حان وقت أخذ استراحة مستحقة!",
                            icon: "success",
                            background: "#0F172A",
                            color: "#F8FAFC",
                            confirmButtonColor: "#3B82F6",
                            confirmButtonText: "رائع، شكراً"
                        });

                        btn.innerHTML = `<i class="fa-solid fa-play"></i><span>بدء الجلسة التالية</span>`;
                        pomoSeconds = totalPomoSeconds;
                        updatePomoDisplay();
                    }
                }, 1000);
            }
        }

        function resetPomodoro() {
            clearInterval(pomoInterval);
            isRunning = false;
            pomoSeconds = totalPomoSeconds;
            updatePomoDisplay();
            document.getElementById('pomoToggleBtn').innerHTML = `<i class="fa-solid fa-play"></i><span>بدء المذاكرة</span>`;
            document.getElementById('pomoStatus').innerText = "تمت إعادة ضبط المؤقت 🎯";
        }

        updatePomoDisplay();
    </script>
    <script src="student-guard.js"></script>
    <script src="student-drawer.js"></script>
</body>
</html>
