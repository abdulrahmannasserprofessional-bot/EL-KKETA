    document.addEventListener('DOMContentLoaded', () => {
        loadExamsList();
    });

        function loadExamsList() {
        if (!window.database) {
            renderExams([]);
            return;
        }

        database.ref('Exams').on('value', snap => {
            let exams = [];
            if (snap.exists()) {
                snap.forEach(c => {
                    exams.push({ id: c.key, ...c.val() });
                });
            }
            renderExams(exams);
        });
    }

    function renderExams(list) {
        document.getElementById('examsCounterBadge').textContent = `${list.length} امتحانات نشطة`;

                    <h3 style="font-size: 18px; font-weight: 900; color: var(--text-title); margin-bottom: 6px;">لا توجد أي امتحانات منشورة حالياً</h3>
                    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 18px;">بنك الامتحانات نظيف وجاهز. يمكنك إضافة امتحانات جديدة للمواد الدراسية في أي وقت.</p>
                    <a href="admin-lessons.html" class="btn-primary" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
                        <i class="fa-solid fa-plus"></i>
                        <span>إضافة امتحان أو محاضرة جديدة</span>
                    </a>
                </div>
            `;
            return;
        }

        container.innerHTML = list.map((exam, i) => `
            <div class="luxury-card" style="justify-content: space-between;">
                <div>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <span style="font-size: 11px; font-weight: 800; padding: 4px 10px; border-radius: 20px; background: var(--gold-light); color: var(--gold-text); border: 1px solid var(--gold-border);">${exam.subject || 'مقرر عام'}</span>
                        <span style="font-size: 11.5px; font-weight: 800; color: #059669; background: #ECFDF5; padding: 4px 10px; border-radius: 20px;">منشور للطلاب</span>
                    </div>

                    <h3 style="font-size: 16px; font-weight: 900; color: var(--text-title); margin-top: 12px; line-height: 1.3;">${exam.title || 'امتحان'}</h3>

                    <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; background: var(--bg-surface-hover); border: 1px solid var(--border-card); border-radius: var(--radius-md); padding: 10px; text-align: center; margin-top: 14px;">
                        <div>
                            <div style="font-size: 14px; font-weight: 900; color: var(--text-title);">${exam.questions ? exam.questions.length : (exam.questionsCount || 0)}</div>
                            <div style="font-size: 10.5px; font-weight: 700; color: var(--text-muted);">أسئلة</div>
                        </div>
                        <div>
                            <div style="font-size: 14px; font-weight: 900; color: var(--text-title);">${exam.duration || '25 دقيقة'}</div>
                            <div style="font-size: 10.5px; font-weight: 700; color: var(--text-muted);">المدة</div>
                        </div>
                        <div>
                            <div style="font-size: 14px; font-weight: 900; color: var(--text-title);">${exam.passingScore || '70%'}</div>
                            <div style="font-size: 10.5px; font-weight: 700; color: var(--text-muted);">النجاح</div>
                        </div>
                    </div>
                </div>

                <div style="display: flex; gap: 8px; margin-top: 14px;">
                    <button onclick="previewExamQuestions(${i})" style="flex: 1; padding: 8px 12px; background: var(--bg-surface-hover); border: 1px solid var(--border-card); border-radius: var(--radius-md); font-size: 12px; font-weight: 800; color: var(--text-title); cursor: pointer;">
                        <i class="fa-solid fa-eye"></i> معاينة الأسئلة
                    </button>
                    <button onclick="deleteExamFromDB('${exam.id}')" style="padding: 8px 12px; background: #FFF1F2; border: 1px solid #FFE4E6; border-radius: var(--radius-md); font-size: 12px; font-weight: 800; color: #E11D48; cursor: pointer;">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </div>
        `).join('');
    }

    async function wipeAllExamsFromDB() {
        const confirm = await Swal.fire({
            title: 'حذف جميع الامتحانات وتصفير البنك؟',
            text: 'هل أنت متأكد من رغبتك في حذف وتصفير جميع الامتحانات الحالية نهائياً؟',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'نعم، احذف الكل',
            cancelButtonText: 'إلغاء',
            confirmButtonColor: '#EF4444'
        });

        if (confirm.isConfirmed) {
            try {
                await database.ref('Exams').remove();
                Swal.fire('تم الحذف', 'تم تصفير وحذف جميع الامتحانات بنجاح 🗑️', 'success');
            } catch(e) {
                Swal.fire('خطأ', 'تعذر حذف الامتحانات: ' + e.message, 'error');
            }
        }
    }

    function deleteExamFromDB(id) {
        if (!window.database) return;
        Swal.fire({
            title: 'حذف الامتحان',
            text: 'هل أنت متأكد من رغبتك في حذف هذا الامتحان؟',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'نعم، احذف',
            cancelButtonText: 'إلغاء',
            confirmButtonColor: '#E11D48'
        }).then(res => {
            if (res.isConfirmed) {
                database.ref('Exams/' + id).remove();
            }
        });
    }

    function openCreateCustomExamModal() {
        Swal.fire({
            title: 'إنشاء امتحان مخصص جديد',
            html: `
                <div style="text-align: right; display: flex; flex-direction: column; gap: 10px;">
                    <div>
                        <label style="font-size: 12px; font-weight: 800;">عنوان الامتحان:</label>
                        <input id="newExamTitle" type="text" placeholder="مثال: اختبار الأسبوع الثالث" style="width: 100%; height: 38px; border: 1px solid #EFE8DC; border-radius: 8px; padding: 0 10px;">
                    </div>
                    <div>
                        <label style="font-size: 12px; font-weight: 800;">المادة:</label>
                        <select id="newExamSubject" style="width: 100%; height: 38px; border: 1px solid #EFE8DC; border-radius: 8px; padding: 0 10px;">
                            <option value="طريقة العمل مع الأفراد">طريقة العمل مع الأفراد</option>
                            <option value="طريقة العمل مع الجماعات">طريقة العمل مع الجماعات</option>
                            <option value="تنظيم وإدارة المجتمعات">تنظيم وإدارة المجتمعات</option>
                            <option value="سياسات الرعاية الاجتماعية">سياسات الرعاية الاجتماعية</option>
                            <option value="الخدمة الاجتماعية في مجال طبي">الخدمة الاجتماعية في مجال طبي</option>
                            <option value="تدريب ميداني">تدريب ميداني</option>
                            <option value="مشروع تخرج">مشروع تخرج</option>
                        </select>
                    </div>
                </div>
            `,
            showCancelButton: true,
            confirmButtonText: 'إنشاء الامتحان',
            cancelButtonText: 'إلغاء',
            confirmButtonColor: '#C28B38'
        });
    }
</script>
</body>
</html>
