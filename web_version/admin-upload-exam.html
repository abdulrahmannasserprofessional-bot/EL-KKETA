<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رفع امتحان - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .form-section { margin-top: -30px; }
        input, textarea { width: 100%; padding: 15px; border: 2px solid #F0F2F9; border-radius: 15px; background: #F8F9FE; font-family: inherit; box-sizing: border-box; margin-top: 10px; }
        textarea { height: 180px; resize: none; font-family: monospace; font-size: 13px; }
        .exam-admin-card { padding: 15px; margin-bottom: 10px; border-right: 5px solid #2ECC71; }
        .btn-gen-demo { background: none; border: 2px solid var(--primary); color: var(--primary); padding: 10px; border-radius: 12px; font-weight: bold; margin-bottom: 15px; cursor: pointer; width: 100%; font-family: inherit; }
    </style>
</head>
<body>
    <div class="header-gradient">
        <div class="back-btn" onclick="location.href='admin-panel.html'">⬅️</div>
        <div style="font-size: 22px; font-weight: bold;">مركز رفع الامتحانات</div>
    </div>

    <div class="card form-section">
        <h3 style="margin: 0; font-size: 16px;">إضافة امتحان برمجى جديد</h3>

        <button class="btn-gen-demo" onclick="generateDemoJson()">💡 توليد 50 سؤال تجريبي (للتجربة)</button>

        <input type="text" id="examTitle" placeholder="عنوان الامتحان">
        <input type="text" id="examChapter" placeholder="الفصل / الوحدة">
        <textarea id="examJson" placeholder="انسخ كود الـ JSON هنا..."></textarea>

        <button class="btn-primary" onclick="uploadExam()" style="margin-top: 20px;">نشر الامتحان فوراً 🚀</button>
    </div>

    <div id="examsList" style="padding: 10px; padding-bottom: 40px;">
        <!-- Loaded by JS -->
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        if(sessionStorage.getItem('isAdmin') !== 'true') window.location.href = "admin-gate.html";

        function generateDemoJson() {
            let list = [];
            for(let i=1; i<=25; i++) {
                list.push({ id: i.toString(), text: `سؤال اختياري تجريبي ${i}`, options: ["أ", "ب", "ج", "د"], correctAnswerIndex: 0, explanation: "التفسير هنا" });
            }
            for(let i=1; i<=25; i++) {
                list.push({ id: (i+25).toString(), text: `سؤال صح وغلط تجريبي ${i}`, options: ["صح ✅", "خطأ ❌"], correctAnswerIndex: 0, explanation: "التفسير هنا" });
            }
            document.getElementById('examJson').value = JSON.stringify(list, null, 2);
            document.getElementById('examTitle').value = "امتحان تجريبي 50 سؤال";
            document.getElementById('examChapter').value = "تجربة";
        }

        function uploadExam() {
            const title = document.getElementById('examTitle').value.trim();
            const chapter = document.getElementById('examChapter').value.trim();
            const jsonCode = document.getElementById('examJson').value.trim();

            if(!title || !jsonCode) return alert("يرجى إكمال البيانات");

            const id = database.ref('Exams').push().key;
            const data = { id, title, chapter, jsonCode };

            database.ref('Exams').child(id).set(data).then(() => {
                alert("تم رفع الامتحان بنجاح ✅");
                document.getElementById('examTitle').value = "";
                document.getElementById('examChapter').value = "";
                document.getElementById('examJson').value = "";
            });
        }

        function loadExams() {
            database.ref('Exams').on('value', snap => {
                const list = document.getElementById('examsList');
                list.innerHTML = "";
                if(snap.exists()){
                    snap.forEach(child => {
                        const exam = child.val();
                        const card = document.createElement('div');
                        card.className = "card exam-admin-card";
                        card.innerHTML = `
                            <div style="font-weight: bold;">${exam.title}</div>
                            <div style="font-size: 12px; color: var(--text-sub); margin-top: 5px;">${exam.chapter} - امتحان برمجى</div>
                            <button class="btn-small btn-del" style="margin-top:10px; background:#FDECEA; color:#D63031; border:none; padding:5px 10px; border-radius:8px; cursor:pointer;" onclick="deleteExam('${exam.id}')">حذف 🗑️</button>
                        `;
                        list.appendChild(card);
                    });
                }
            });
        }

        function deleteExam(id) {
            if(confirm("حذف هذا الامتحان؟")) database.ref('Exams').child(id).remove();
        }

        loadExams();
    </script>
</body>
</html>
