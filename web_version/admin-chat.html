<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متابعة الشات - لوحة التحكم</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-chat-container {
            max-width: 800px; margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px; border: 1px solid rgba(0,0,0,0.1);
            height: calc(100vh - 120px);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .chat-messages {
            flex: 1; padding: 20px; overflow-y: auto;
            display: flex; flex-direction: column;
        }
        .chat-input-area {
            padding: 15px 20px; background: rgba(255,255,255,0.8);
            border-top: 1px solid rgba(255,255,255,0.1);
            display: flex; gap: 10px; align-items: center;
        }
        #msgInput {
            flex: 1; padding: 12px; border-radius: 12px;
            border: 1px solid rgba(0,0,0,0.2);
            background: #FFFFFF; color: #1E293B;
            font-family: inherit;
        }
        .chat-bubble {
            max-width: 80%; padding: 12px 16px; border-radius: 16px; margin-bottom: 15px; line-height: 1.5; font-size: 14px; position: relative; animation: slideUp 0.3s ease;
        }
        .incoming { background: #FFFFFF; border-bottom-right-radius: 0; align-self: flex-start; }
        .outgoing { background: var(--primary); border-bottom-left-radius: 0; align-self: flex-end; }
        .admin { background: linear-gradient(135deg, #10b981, #059669); color: #1E293B; border-bottom-left-radius: 0; align-self: flex-end; }
        .chat-meta { font-size: 10px; opacity: 0.7; margin-top: 5px; text-align: left; }
        .chat-tool-btn { background: #FFFFFF; border: 1px solid rgba(0,0,0,0.2); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; color: #1E293B; transition: 0.3s; }
        .chat-tool-btn:hover { background: rgba(255,255,255,0.2); transform: scale(1.05); }
        .chat-img-preview { max-width: 250px; border-radius: 12px; margin-top: 5px; cursor: pointer; border: 1px solid rgba(0,0,0,0.1); }
        .chat-audio-player { width: 250px; height: 40px; margin-top: 5px; }
        .del-btn { position: absolute; left: -10px; top: -10px; background: #ef4444; color: #1E293B; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 12px; cursor: pointer; opacity: 0; transition: 0.3s; }
        .chat-bubble:hover .del-btn { opacity: 1; }
    </style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="header-gradient" style="height: 100px; padding-top: 20px; margin-bottom: 20px;">
        <div class="back-btn" onclick="location.href='admin-panel.html'">🔙</div>
        <div style="font-size: 22px; font-weight: bold;">متابعة الشات 👑</div>
    </div>

    <div class="admin-chat-container">
        <div id="chatMessages" class="chat-messages">
            <div style="text-align: center; color: var(--text-sub); padding: 20px;">جاري تحميل المحادثات...</div>
        </div>

        <div class="chat-input-area" style="gap: 8px; flex-wrap: wrap;">
            <label for="imageUpload" class="chat-tool-btn" title="إرسال صورة">📷</label>
            <input type="file" id="imageUpload" accept="image/*" style="display:none;" onchange="uploadImage(event)">
            
            <input type="text" id="msgInput" placeholder="اكتب ردك كمسؤول هنا..." style="flex: 1;" onkeypress="if(event.key==='Enter')sendMessage()">
            <button onclick="sendMessage()" class="btn-primary" id="sendBtn">إرسال 🚀</button>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-storage-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="toast.js"></script>
    <script>
        // Check if admin is logged in
        if (!sessionStorage.getItem(\'isAdmin\')) {
            window.location.href = "admin-gate.html";
        }

        const chatRef = database.ref('Chats/Global');
        const storage = firebase.storage();

        chatRef.limitToLast(100).on('value', (snap) => {
            const container = document.getElementById('chatMessages');
            container.innerHTML = "";

            if (!snap.exists()) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-sub); padding: 20px;">لا توجد رسائل حالياً!</div>`;
                return;
            }

            snap.forEach((child) => {
                const msg = child.val();
                const key = child.key;
                
                const bubble = document.createElement('div');
                bubble.className = `chat-bubble ${msg.isAdmin ? 'admin' : 'incoming'}`;
                
                const date = new Date(msg.timestamp);
                const timeStr = date.toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' });

                let contentHtml = `<div>${msg.text}</div>`;
                if (msg.fileType === 'image') {
                    contentHtml = `<img src="${msg.fileUrl}" class="chat-img-preview" onclick="window.open(this.src)">`;
                } else if (msg.fileType === 'audio') {
                    contentHtml = `<audio controls src="${msg.fileUrl}" class="chat-audio-player"></audio>`;
                }
                
                let adminHtml = msg.isAdmin ? `<span class="admin-badge">👑 مشرف</span>` : '';

                bubble.innerHTML = `
                    <div class="del-btn" onclick="deleteMessage('${key}')" title="حذف الرسالة"><svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></div>
                    <div style="font-weight: bold; font-size: 12px; margin-bottom: 4px; color: ${msg.isAdmin ? '#fff' : 'var(--primary)'};">
                        ${msg.senderName} ${adminHtml} 
                        <span style="font-size:10px; color:#888; margin-right:5px;">(${msg.senderCode || 'Admin'})</span>
                    </div>
                    ${contentHtml}
                    <div class="chat-meta">
                        <span>${timeStr}</span>
                    </div>
                `;
                container.appendChild(bubble);
            });
            container.scrollTop = container.scrollHeight;
        });

        
        function markResolved(key) {
            chatRef.child(key).update({ status: 'resolved' });
        }

        function deleteMessage(key) {
            Swal.fire({title:"????? ?????",text:"?? ??? ????? ?? ??? ??? ????????",icon:"warning",showCancelButton:true,confirmButtonText:"???? ????",cancelButtonText: "إلغاء"}).then((r) => { if(r.isConfirmed) { chatRef.child(key).remove(); } })
        }

        function sendMessage() {
            const input = document.getElementById('msgInput');
            const text = input.value.trim();
            if (text === "") return;

            chatRef.push({
                senderName: "الإدارة",
                isAdmin: true,
                text: text,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            }).then(() => {
                input.value = "";
                showToast("تم إرسال ردك 🚀", "success");
            });
        }

        async function uploadImage(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            showToast('جاري رفع الصورة...', 'info');
            const sendBtn = document.getElementById('sendBtn');
            sendBtn.disabled = true;
            
            try {
                const fileName = `chat_admin_${Date.now()}.${file.name.split('.').pop()}`;
                const storageRef = storage.ref('ChatFiles/' + fileName);
                
                await storageRef.put(file);
                const downloadURL = await storageRef.getDownloadURL();
                
                await chatRef.push({
                    senderName: "الإدارة",
                    isAdmin: true,
                    text: '📷 صورة',
                    fileUrl: downloadURL,
                    fileType: 'image',
                    timestamp: firebase.database.ServerValue.TIMESTAMP
                });
                showToast('تم الإرسال بنجاح ✅', 'success');
            } catch (err) {
                console.error(err);
                showToast('فشل الرفع! حاول مرة أخرى', 'error');
            } finally {
                sendBtn.disabled = false;
                event.target.value = '';
            }
        }
    </script>
</body>
</html>
