<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>إدارة المواد والمقررات - ELKHETA Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #4F46E5;
            --primary-dark: #3730A3;
            --primary-glow: rgba(79, 70, 229, 0.4);
            --accent-gold: #F59E0B;
            --bg-body: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
        }

        body.light-theme {
            --bg-body: #F1F5F9;
            --card-bg: rgba(255, 255, 255, 0.9);
            --card-border: #E2E8F0;
            --text-main: #0F172A;
            --text-muted: #64748B;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            font-family: 'Cairo', sans-serif;
        }

        html, body {
            overflow-x: hidden !important;
            width: 100%;
            max-width: 100vw;
        }

        body {
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 50px;
            direction: rtl;
            transition: background-color 0.3s, color 0.3s;
            position: relative;
        }

        /* Ambient Glowing Background Orbs */
        .admin-bg-blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            opacity: 0.4;
        }
        .blob-1 { width: 450px; height: 450px; background: #312E81; top: -150px; right: -150px; }
        .blob-2 { width: 400px; height: 400px; background: #581C87; bottom: -150px; left: -150px; }

        .admin-app-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            z-index: 10;
        }

        /* ─── Top Navbar ─── */
        .admin-topbar {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 12px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
            position: sticky;
            top: 12px;
            z-index: 100;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
            min-width: 0;
        }

        .brand-logo-badge {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #3B82F6 0%, #1D4ED8 50%, #1E1B4B 100%);
            border: 1.5px solid rgba(255, 255, 255, 0.2);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.4);
            flex-shrink: 0;
        }

        .brand-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .brand-title-text {
            font-size: 15px;
            font-weight: 900;
            line-height: 1.2;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .brand-sub-text {
            font-size: 11px;
            color: var(--text-muted);
            font-weight: 700;
            white-space: nowrap;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-top-action {
            width: 42px;
            height: 42px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
        }
        .btn-top-action:hover {
            border-color: var(--primary);
            color: #818CF8;
            transform: translateY(-2px);
        }

        /* ─── Executive Hero Card ─── */
        .admin-hero-card {
            background: linear-gradient(135deg, #090D16 0%, #0F172A 30%, #1E1B4B 75%, #312E81 100%);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 26px;
            padding: 26px 24px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 16px 45px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
        }
        .admin-hero-card::before {
            content: '';
            position: absolute;
            width: 260px; height: 260px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, transparent 70%);
            top: -80px; left: -50px;
            border-radius: 50%;
            pointer-events: none;
        }

        .hero-left-content {
            display: flex;
            align-items: center;
            gap: 16px;
            position: relative;
            z-index: 2;
            min-width: 0;
        }
        .hero-icon-box {
            width: 60px; height: 60px;
            border-radius: 20px;
            background: linear-gradient(135deg, #3730A3 0%, #4F46E5 100%);
            border: 2px solid #818CF8;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: white;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.4);
            flex-shrink: 0;
        }
        .hero-titles h1 {
            font-size: 20px;
            font-weight: 900;
            color: #FFFFFF;
            line-height: 1.3;
        }
        .hero-titles p {
            font-size: 12px;
            color: #A5B4FC;
            font-weight: 700;
            margin-top: 4px;
        }

        .hero-badge-pill {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 8px 18px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 900;
            color: #FEF3C7;
            position: relative;
            z-index: 2;
            white-space: nowrap;
        }

        /* ─── Add Subject Card ─── */
        .add-subject-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 22px 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .card-header-label {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
            font-weight: 900;
            color: var(--text-main);
        }
        .card-header-label i {
            color: #818CF8;
        }

        .input-action-row {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .admin-input {
            flex: 1;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid var(--card-border);
            border-radius: 16px;
            padding: 14px 18px;
            font-size: 14px;
            font-weight: 700;
            color: var(--text-main);
            outline: none;
            transition: all 0.3s;
            width: 100%;
        }
        body.light-theme .admin-input {
            background: #FFF;
        }
        .admin-input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 20px rgba(79, 70, 229, 0.25);
        }
        .admin-input::placeholder {
            color: var(--text-muted);
            font-weight: 600;
        }

        .btn-add-subject {
            background: linear-gradient(135deg, #6366F1 0%, #4F46E5 50%, #3730A3 100%);
            color: white;
            border: none;
            border-radius: 16px;
            padding: 14px 24px;
            font-size: 14px;
            font-weight: 900;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 8px 25px rgba(79, 70, 229, 0.35);
            transition: all 0.25s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .btn-add-subject:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(79, 70, 229, 0.5);
        }

        /* ─── Subjects List Section ─── */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
            padding: 0 4px;
        }
        .section-header h2 {
            font-size: 16.5px;
            font-weight: 900;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .count-pill {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            padding: 4px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            color: #A5B4FC;
        }
        body.light-theme .count-pill {
            color: #4F46E5;
        }

        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }

        .course-item-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 22px;
            padding: 18px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.12);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            width: 100%;
        }
        .course-item-card:hover {
            transform: translateY(-3px);
            border-color: #818CF8;
            box-shadow: 0 12px 30px rgba(99, 102, 241, 0.2);
        }

        .course-item-left {
            display: flex;
            align-items: center;
            gap: 14px;
            min-width: 0;
            flex: 1;
        }

        .course-item-icon {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.15), rgba(79, 70, 229, 0.25));
            border: 1.5px solid rgba(165, 180, 252, 0.3);
            color: #A5B4FC;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .course-item-info {
            display: flex;
            flex-direction: column;
            min-width: 0;
            flex: 1;
        }
        .course-item-title {
            font-size: 15.5px;
            font-weight: 900;
            color: var(--text-main);
            line-height: 1.4;
            word-break: break-word;
        }
        .course-item-sub {
            font-size: 11.5px;
            font-weight: 700;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .course-item-actions {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .btn-course-action {
            width: 40px;
            height: 40px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s;
            text-decoration: none;
        }
        body.light-theme .btn-course-action {
            background: #FFF;
        }
        .btn-course-action.view-btn:hover {
            background: rgba(79, 70, 229, 0.15);
            color: #818CF8;
            border-color: #818CF8;
            transform: translateY(-2px);
        }
        .btn-course-action.delete-btn:hover {
            background: rgba(239, 68, 68, 0.15);
            color: #F87171;
            border-color: #F87171;
            transform: translateY(-2px);
        }

        .empty-state-box {
            grid-column: 1 / -1;
            background: var(--card-bg);
            border: 1.5px dashed var(--card-border);
            border-radius: 24px;
            padding: 40px 20px;
            text-align: center;
            color: var(--text-muted);
        }
        .empty-state-box i {
            font-size: 42px;
            color: #818CF8;
            margin-bottom: 12px;
            display: block;
        }

        /* ─── Mobile Responsiveness Adjustments ─── */
        @media (max-width: 840px) {
            .subjects-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 640px) {
            .admin-app-container {
                padding: 12px 14px;
                gap: 14px;
            }
            .admin-topbar {
                padding: 10px 14px;
                border-radius: 18px;
            }
            .brand-sub-text {
                display: none;
            }
            .input-action-row {
                flex-direction: column;
                gap: 10px;
            }
            .btn-add-subject {
                width: 100%;
                padding: 14px;
            }
            .admin-hero-card {
                padding: 20px 16px;
                border-radius: 20px;
            }
            .hero-icon-box {
                width: 50px;
                height: 50px;
                font-size: 22px;
            }
            .hero-titles h1 {
                font-size: 17px;
            }
            .course-item-card {
                padding: 16px 14px;
                border-radius: 18px;
                gap: 10px;
            }
            .course-item-icon {
                width: 44px;
                height: 44px;
                font-size: 20px;
                border-radius: 14px;
            }
            .course-item-title {
                font-size: 14px;
            }
            .btn-course-action {
                width: 38px;
                height: 38px;
                font-size: 14px;
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Ambient Glowing Background Orbs -->
    <div class="admin-bg-blob blob-1"></div>
    <div class="admin-bg-blob blob-2"></div>

    <div class="admin-app-container">

        <!-- Top Navbar -->
        <header class="admin-topbar">
            <a href="admin-panel.html" class="brand-section">
                <div class="brand-logo-badge">
                    <i class="fa-solid fa-book-bookmark"></i>
                </div>
                <div class="brand-info">
                    <span class="brand-title-text">المواد والمقررات الدراسية</span>
                    <span class="brand-sub-text">لوحة الإدارة العليا • دفعة 2027</span>
                </div>
            </a>

            <div class="topbar-actions">
                <button type="button" class="btn-top-action" onclick="toggleLocalTheme()" title="تبديل المظهر (فاتح / داكن)">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
                <a href="admin-panel.html" class="btn-top-action" title="الرجوع للوحة التحكم">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
            </div>
        </header>

        <!-- Executive Hero Card -->
        <section class="admin-hero-card">
            <div class="hero-left-content">
                <div class="hero-icon-box">
                    <i class="fa-solid fa-graduation-cap"></i>
                </div>
                <div class="hero-titles">
                    <h1>هيكلة المواد والمناهج الدراسية</h1>
                    <p>إضافة وتعديل وحذف المقررات الأكاديمية لدفعة الفرقة الرابعة 2027 🎓</p>
                </div>
            </div>
            <div class="hero-badge-pill" id="heroSubjectCount">
                📊 جاري التحميل...
            </div>
        </section>

        <!-- Add Subject Card -->
        <section class="add-subject-card">
            <div class="card-header-label">
                <i class="fa-solid fa-circle-plus"></i>
                <span>إضافة مادة دراسية جديدة للمنصة</span>
            </div>
            <div class="input-action-row">
                <input type="text" id="newSubjectName" class="admin-input" placeholder="اكتب اسم المادة بدقة (مثال: الخدمة الاجتماعية في المجال المدرسي)">
                <button class="btn-add-subject" onclick="addSubject()">
                    <i class="fa-solid fa-plus"></i>
                    <span>إضافة المادة الآن</span>
                </button>
            </div>
        </section>

        <!-- Section Header -->
        <div class="section-header">
            <h2>
                <i class="fa-solid fa-layer-group" style="color: #818CF8;"></i>
                <span>قائمة المواد المعتمدة</span>
            </h2>
            <span class="count-pill" id="subjectCountPill">0 مادة</span>
        </div>

        <!-- Subjects Grid -->
        <div class="subjects-grid" id="subjectsList">
            <div class="empty-state-box">
                <i class="fa-solid fa-spinner fa-spin"></i>
                <p>جاري تحميل المواد الدراسية...</p>
            </div>
        </div>

    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        if (sessionStorage.getItem('isAdmin') !== 'true' && !sessionStorage.getItem('isMysqlAdmin')) {
            if (localStorage.getItem('isAdmin') === 'true') {
                sessionStorage.setItem('isAdmin', 'true');
                if (localStorage.getItem('adminRole')) sessionStorage.setItem('adminRole', localStorage.getItem('adminRole'));
                if (localStorage.getItem('adminPermissions')) sessionStorage.setItem('adminPermissions', localStorage.getItem('adminPermissions'));
            } else {
                window.location.href = "admin-gate.html";
            }
        }

        function toggleLocalTheme() {
            const isLight = document.body.classList.toggle('light-theme');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            updateThemeIcon(!isLight);
        }
        function updateThemeIcon(isDark) {
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = isDark ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }
        if (localStorage.getItem('theme') === 'light') {
            document.body.classList.add('light-theme');
            updateThemeIcon(false);
        } else {
            updateThemeIcon(true);
        }

        const icons = ['📚','🔬','🧮','🌍','📝','⚗️','🎨','📐','💻','🏫','📖','⚖️'];

        function addSubject() {
            const name = document.getElementById('newSubjectName').value.trim();
            if (!name) {
                Swal.fire('تنبيه', 'يرجى كتابة اسم المادة الدراسية أولاً ⚠️', 'warning');
                return;
            }

            const id = database.ref('Subjects').push().key;
            database.ref('Subjects/' + id).set({ id, name }).then(() => {
                database.ref('Settings/latestAddedContent').set({
                    type: 'مادة دراسية',
                    title: name,
                    subject: name,
                    message: `🎉 تمت إضافة مادة دراسية جديدة: (${name}) 📚`,
                    timestamp: Date.now()
                });
                document.getElementById('newSubjectName').value = "";
                Swal.fire('تمت الإضافة بنجاح 🎉', `تم اعتماد مادة (${name}) ونشرها للطلاب`, 'success');
            }).catch(err => {
                Swal.fire('خطأ', 'تعذر إضافة المادة، تحقق من الاتصال', 'error');
            });
        }

        document.getElementById('newSubjectName').addEventListener('keydown', e => {
            if (e.key === 'Enter') addSubject();
        });

        // Realtime Listener for Subjects
        database.ref('Subjects').on('value', snap => {
            const list = document.getElementById('subjectsList');
            list.innerHTML = "";
            let count = 0;

            if (snap.exists()) {
                snap.forEach(child => {
                    const sub = child.val() || {};
                    const subId = sub.id || child.key;
                    const subName = sub.name || child.key;
                    count++;
                    const icon = icons[(count - 1) % icons.length];

                    const card = document.createElement('div');
                    card.className = "course-item-card";
                    card.innerHTML = `
                        <div class="course-item-left">
                            <div class="course-item-icon">${icon}</div>
                            <div class="course-item-info">
                                <div class="course-item-title">${subName}</div>
                                <div class="course-item-sub">الفرقة الرابعة • دفعة 2027 🎓</div>
                            </div>
                        </div>
                        <div class="course-item-actions">
                            <a href="admin-lessons.html?subject=${encodeURIComponent(subName)}" class="btn-course-action view-btn" title="إدارة دروس ومحاضرات هذه المادة">
                                <i class="fa-solid fa-video"></i>
                            </a>
                            <button class="btn-course-action delete-btn" onclick="confirmDeleteSubject('${subId}', '${subName}')" title="حذف المادة وجميع محتوياتها">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    `;
                    list.appendChild(card);
                });

                document.getElementById('subjectCountPill').textContent = `${count} مادة`;
                document.getElementById('heroSubjectCount').textContent = `📚 إجمالي المواد: ${count}`;
            } else {
                list.innerHTML = `
                    <div class="empty-state-box">
                        <i class="fa-solid fa-folder-open"></i>
                        <h3 style="font-weight: 800; margin-bottom: 6px;">لا توجد مواد مضافة حالياً</h3>
                        <p style="font-size: 13px;">استخدم النموذج بالأعلى لإضافة مقررات دراسية للدفعة</p>
                    </div>
                `;
                document.getElementById('subjectCountPill').textContent = '0 مادة';
                document.getElementById('heroSubjectCount').textContent = '📚 إجمالي المواد: 0';
            }
        });

        function confirmDeleteSubject(id, name) {
            Swal.fire({
                title: 'تأكيد حذف المادة ⚠️',
                html: `هل أنت متأكد تماماً من حذف مادة <strong style="color: #DC2626;">"${name}"</strong>؟<br><br><span style="font-size: 12.5px; color: #64748B;">سيتم مسح المادة وجميع دروسها ومحاضراتها وامتحاناتها نهائياً ولا يمكن التراجع.</span>`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#DC2626',
                cancelButtonColor: '#64748B',
                confirmButtonText: 'نعم، حذف نهائياً 🗑️',
                cancelButtonText: 'إلغاء'
            }).then(result => {
                if (result.isConfirmed) {
                    Promise.all([
                        database.ref('Subjects/' + id).remove(),
                        database.ref('Lectures/' + name).remove(),
                        database.ref('Chapters/' + name).remove(),
                        database.ref('Exams/' + name).remove()
                    ]).then(() => {
                        Swal.fire('تم الحذف', `تم حذف مادة (${name}) ومحتوياتها بنجاح`, 'success');
                    }).catch(err => {
                        Swal.fire('خطأ', 'حدث خطأ أثناء تنفيذ الحذف', 'error');
                    });
                }
            });
        }
    </script>
</body>
</html>
