<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المواد - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #F8FAFC; min-height: 100vh; color: #1E293B; padding-bottom: 40px; }

        .page-header {
            background: linear-gradient(135deg, #064E3B, #065F46);
            padding: 50px 20px 70px;
            position: relative; overflow: hidden;
        }
        .page-header::after {
            content: '';
            position: absolute;
            width: 250px; height: 250px;
            background: radial-gradient(circle, rgba(52,211,153,0.2) 0%, transparent 70%);
            bottom: -80px; left: -50px; border-radius: 50%;
        }
        .header-top {
            display: flex; align-items: center; gap: 15px;
            position: relative; z-index: 2;
        }
        .back-btn {
            width: 40px; height: 40px;
            background: #FFFFFF;
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 18px;
            border: 1px solid rgba(0,0,0,0.15);
            transition: background 0.2s;
         color: #FFFFFF; }
        .back-btn:hover { background: rgba(255,255,255,0.2); }
        .header-title { font-size: 20px; font-weight: 800;  color: #FFFFFF; }
        .header-sub { font-size: 12px; color: rgba(0,0,0,0.5); margin-top: 3px;  color: rgba(255,255,255,0.8); }

        /* Add form */
        .add-card {
            margin: -30px 15px 0;
            background: #FFFFFF;
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 24px;
            padding: 22px;
            position: relative; z-index: 10;
        }
        .add-card h3 { font-size: 14px; font-weight: 700; color: rgba(0,0,0,0.7); margin-bottom: 14px; }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            background: #F8FAFC;
            border: 1.5px solid rgba(255,255,255,0.1);
            border-radius: 14px;
            color: #1E293B;
            font-family: 'Cairo', sans-serif;
            font-size: 15px;
            outline: none;
            transition: all 0.3s;
        }
        .form-input:focus { border-color: #34D399; background: rgba(52,211,153,0.06); }
        .form-input::placeholder { color: rgba(0,0,0,0.25); }

        .btn-add {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #059669, #34D399);
            border: none;
            border-radius: 14px;
            color: #1E293B;
            font-size: 15px;
            font-weight: 700;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s;
            box-shadow: 0 6px 20px rgba(52,211,153,0.3);
        }
        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(52,211,153,0.4); }
        .btn-add:active { transform: scale(0.98); }

        /* List */
        .list-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 20px 15px 10px;
        }
        .list-title { font-size: 13px; font-weight: 700; color: rgba(0,0,0,0.4); }
        .count-badge {
            background: rgba(52,211,153,0.15);
            color: #34D399;
            border-radius: 8px;
            padding: 3px 10px;
            font-size: 12px; font-weight: 700;
        }

        .course-card {
            margin: 0 15px 10px;
            background: #FFFFFF;
            border: 1px solid rgba(0,0,0,0.07);
            border-radius: 18px;
            padding: 16px 18px;
            display: flex; align-items: center; justify-content: space-between;
            transition: all 0.2s;
        }
        .course-card:hover { border-color: rgba(0,0,0,0.15); }
        .course-left { display: flex; align-items: center; gap: 13px; }
        .course-icon {
            width: 44px; height: 44px;
            background: rgba(52,211,153,0.15);
            border-radius: 13px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .course-name { font-size: 15px; font-weight: 700; color: #1E293B; }
        .course-sub { font-size: 11px; color: var(--text-sub); margin-top: 2px; }

        .btn-delete {
            width: 36px; height: 36px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.2);
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 15px;
            transition: all 0.2s;
        }
        .btn-delete:hover { background: rgba(239,68,68,0.25); }

        .empty-state {
            text-align: center; padding: 50px 20px;
            color: rgba(0,0,0,0.3);
        }
        .empty-state div { font-size: 40px; margin-bottom: 12px; }
        .empty-state p { font-size: 14px; }

        .toast {
            position: fixed; bottom: 25px; left: 50%; transform: translateX(-50%) translateY(120px);
            background: #1E293B; border: 1px solid rgba(0,0,0,0.15);
            color: #1E293B; padding: 14px 24px; border-radius: 16px;
            font-size: 14px; font-weight: 600; z-index: 99999;
            transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 15px 40px rgba(0,0,0,0.5); max-width: 90vw; text-align: center;
        }
        .toast.show { transform: translateX(-50%) translateY(0); }

        /* ─── Confirm Modal ─── */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.75);
            backdrop-filter: blur(8px); z-index: 99998;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; padding: 20px;
        }
        .modal-overlay.open { opacity: 1; pointer-events: all; }
        .modal-box {
            background: #FFFFFF; border: 1px solid rgba(0,0,0,0.1);
            border-radius: 28px; padding: 32px 28px; width: 100%; max-width: 340px;
            text-align: center;
            transform: scale(0.85) translateY(20px);
            transition: transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
        }
        .modal-overlay.open .modal-box { transform: scale(1) translateY(0); }
        .modal-icon { width: 68px; height: 68px; border-radius: 22px; margin: 0 auto 18px; display: flex; align-items: center; justify-content: center; font-size: 32px; background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.25); }
        .modal-title { font-size: 18px; font-weight: 900; color: #1E293B; margin-bottom: 10px; }
        .modal-msg { font-size: 13px; color: rgba(0,0,0,0.5); line-height: 1.7; margin-bottom: 24px; }
        .modal-btns { display: flex; gap: 10px; }
        .modal-btn { flex: 1; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 700; font-family: 'Cairo', sans-serif; cursor: pointer; border: none; transition: all 0.2s; }
        .modal-btn.cancel { background: rgba(255,255,255,0.07); color: rgba(0,0,0,0.6); border: 1px solid rgba(0,0,0,0.1); }
        .modal-btn.cancel:hover { background: rgba(255,255,255,0.12); }
        .modal-btn.confirm-del { background: linear-gradient(135deg, #DC2626, #EF4444); color: #1E293B; box-shadow: 0 6px 20px rgba(239,68,68,0.35); }
        .modal-btn.confirm-del:hover { transform: translateY(-2px); box-shadow: 0 10px 25px rgba(239,68,68,0.5); }
    </style>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <script>
        if (sessionStorage.getItem('isAdmin') !== 'true') window.location.href = "admin-gate.html";
        const role = sessionStorage.getItem('adminRole') || 'master';
        if (role !== 'master') {
            try {
                const perms = JSON.parse(sessionStorage.getItem('adminPermissions') || '{}');
                if (!perms.courses) {
                    alert("⛔ ليس لديك صلاحية للوصول إلى إدارة المواد الدراسية");
                    window.location.href = "admin-panel.html";
                }
            } catch(e) {}
        }
    </script>

    <div class="page-header">
        <div class="header-top">
            <div class="back-btn" onclick="location.href='admin-panel.html'">⬅️</div>
            <div>
                <div class="header-title">📖 إدارة المواد الدراسية</div>
                <div class="header-sub">أضف أو احذف المواد من المنصة</div>
            </div>
        </div>
    </div>

    <!-- Add form -->
    <div class="add-card">
        <h3>➕ إضافة مادة جديدة</h3>
        <input type="text" id="newSubjectName" class="form-input" placeholder="مثال: لغة عربية / رياضيات / فيزياء">
        <button class="btn-add" onclick="addSubject()">✅ إضافة المادة الآن</button>
    </div>

    <div class="list-header">
        <span class="list-title">قائمة المواد الحالية</span>
        <span class="count-badge" id="subjectCount">0 مادة</span>
    </div>

    <!-- Confirm Modal -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal-box">
            <div class="modal-icon"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></div>
            <div class="modal-title">تأكيد الحذف</div>
            <div class="modal-msg" id="modalMsg">هل أنت متأكد؟</div>
            <div class="modal-btns">
                <button class="modal-btn cancel" onclick="closeModal()">إلغاء</button>
                <button class="modal-btn confirm-del" id="modalConfirmBtn">حذف نهائياً </button>
            </div>
        </div>
    </div>

    <div id="subjectsList">
        <div class="empty-state"><div>📚</div><p>جاري تحميل المواد...</p></div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg; t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3500);
        }

        let pendingDeleteFn = null;
        function showConfirm(message, onConfirm) { Swal.fire({
        title: "تأكيد",
        html: message,
        icon: "warning", color: "#1E293B",
        showCancelButton: true,
        confirmButtonColor: "#d33",
        cancelButtonColor: "#3085d6",
        confirmButtonText: "نعم، متأكد",
        cancelButtonText: "إلغاء"
    }).then((result) => { if (result.isConfirmed && onConfirm) { onConfirm(); } }); }
        function closeModal() { document.getElementById('confirmModal').classList.remove('open'); pendingDeleteFn = null; }
        document.getElementById('confirmModal').addEventListener('click', function(e) { if (e.target === this) closeModal(); });

        function addSubject() {
            const name = document.getElementById('newSubjectName').value.trim();
            if (!name) return showToast("⚠️ يرجى كتابة اسم المادة أولاً");
            const id = database.ref('Subjects').push().key;
            database.ref('Subjects/' + id).set({ id, name }).then(() => {
                database.ref('Settings/latestAddedContent').set({
                    type: 'مادة دراسية',
                    title: name,
                    subject: name,
                    message: `🎉 تمت إضافة مادة دراسية جديدة: (${name}) 📚`,
                    timestamp: Date.now()
                });
                document.getElementById('newSubjectName').value = "";
                showToast("✅ تمت إضافة المادة ونشر التنبيه للطلاب");
            });
        }

        document.getElementById('newSubjectName').addEventListener('keydown', e => {
            if (e.key === 'Enter') addSubject();
        });

        const icons = ['📚','🔬','🧮','🌍','📝','⚗️','🎨','📐','💻','🏫'];
        let subjectDeleteMap = {};
        let subjectCount = 0;

        database.ref('Subjects').on('value', snap => {
            const list = document.getElementById('subjectsList');
            list.innerHTML = "";
            subjectDeleteMap = {};
            subjectCount = 0;

            if (snap.exists()) {
                snap.forEach(child => {
                    const sub = child.val() || {};
                    const subId = sub.id || child.key;
                    const subName = sub.name || child.key;
                    subjectCount++;
                    const icon = icons[(subjectCount - 1) % icons.length];
                    const deleteId = 'sdel_' + subId;
                    subjectDeleteMap[deleteId] = { id: subId, name: subName };
                    const card = document.createElement('div');
                    card.className = "course-card";
                    card.innerHTML = `
                        <div class="course-left">
                            <div class="course-icon">${icon}</div>
                            <div>
                                <div class="course-name">${subName}</div>
                                <div class="course-sub">مادة دراسية</div>
                            </div>
                        </div>
                        <div class="btn-delete" data-id="${deleteId}" title="حذف المادة"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg></div>
                    `;
                    list.appendChild(card);
                });
                document.getElementById('subjectCount').textContent = subjectCount + ' مادة';

                list.querySelectorAll('.btn-delete[data-id]').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const ref = subjectDeleteMap[btn.dataset.id];
                        if (!ref || !ref.id) return;
                        showConfirm(
                            `هل أنت متأكد من حذف مادة <strong style="color:#DC2626">${ref.name}</strong>؟<br><br>سيتم حذف المادة وجميع محاضراتها وامتحاناتها نهائياً!`,
                            () => {
                                // Cascade delete from Subjects, Lectures, Chapters, Exams
                                const promises = [
                                    database.ref('Subjects/' + ref.id).remove(),
                                    database.ref('Lectures/' + ref.name).remove(),
                                    database.ref('Chapters/' + ref.name).remove(),
                                    database.ref('Exams/' + ref.name).remove()
                                ];
                                Promise.all(promises).then(() => {
                                    showToast("✅ تم حذف المادة وجميع محتوياتها بنجاح");
                                }).catch(err => {
                                    console.error(err);
                                    showToast("⚠️ حدث خطأ أثناء الحذف");
                                });
                            }
                        );
                    });
                });
            } else {
                list.innerHTML = `<div class="empty-state"><div>📚</div><p>لا توجد مواد مضافة حالياً</p></div>`;
                document.getElementById('subjectCount').textContent = '0 مادة';
            }
        });
    </script>
</body>
</html>
