<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة المواد - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .form-section { margin-top: -30px; }
        .course-card { display: flex; align-items: center; justify-content: space-between; padding: 15px 20px; margin-bottom: 10px; }
        .sub-name { font-weight: bold; font-size: 17px; }
        .btn-delete { color: #D63031; cursor: pointer; padding: 5px; font-size: 18px; }
        input[type="text"] { width: 100%; padding: 15px; border: 2px solid #F0F2F9; border-radius: 15px; margin: 10px 0; font-family: inherit; }
    </style>
</head>
<body>
    <div class="header-gradient">
        <div class="back-btn" onclick="location.href='admin-panel.html'">⬅️</div>
        <div style="font-size: 22px; font-weight: bold;">إدارة المواد الدراسية</div>
    </div>

    <div class="card form-section">
        <h3 style="margin: 0; font-size: 16px;">إضافة مادة جديدة</h3>
        <input type="text" id="newSubjectName" placeholder="مثلاً: لغة عربية">
        <button class="btn-primary" onclick="addSubject()">إضافة المادة ➕</button>
    </div>

    <div id="subjectsList" style="padding: 10px;">
        <div style="text-align: center; padding: 30px; color: #BCBCBC;">جاري تحميل المواد...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        if(sessionStorage.getItem('isAdmin') !== 'true') window.location.href = "admin-gate.html";

        function addSubject() {
            const name = document.getElementById('newSubjectName').value.trim();
            if(!name) return alert("يرجى كتابة اسم المادة");

            const id = database.ref('Subjects').push().key;
            database.ref('Subjects/' + id).set({ id, name }).then(() => {
                document.getElementById('newSubjectName').value = "";
                alert("تمت الإضافة بنجاح");
            });
        }

        function loadSubjects() {
            database.ref('Subjects').on('value', (snapshot) => {
                const list = document.getElementById('subjectsList');
                list.innerHTML = "";
                if(snapshot.exists()) {
                    snapshot.forEach(child => {
                        const sub = child.val();
                        const card = document.createElement('div');
                        card.className = "card course-card";
                        card.innerHTML = `
                            <span class="sub-name">⚛️ ${sub.name}</span>
                            <div class="btn-delete" onclick="deleteSubject('${sub.id}')">🗑️</div>
                        `;
                        list.appendChild(card);
                    });
                } else {
                    list.innerHTML = `<div style="text-align:center; padding:50px; color:#BCBCBC;">لا توجد مواد حالياً</div>`;
                }
            });
        }

        function deleteSubject(id) {
            if(confirm("هل أنت متأكد من حذف هذه المادة؟")) {
                database.ref('Subjects/' + id).remove();
            }
        }
        loadSubjects();
    </script>
</body>
</html>
