<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خريطة المنهج - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .map-card { display: flex; align-items: center; padding: 20px; }
        .map-icon { width: 50px; height: 50px; background: #E8EAFF; border-radius: 15px; display: flex; justify-content: center; align-items: center; font-size: 24px; margin-left: 15px; }
        .map-info { flex: 1; text-align: right; }
        .map-title { font-weight: bold; font-size: 17px; }
        .map-stats { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
    </style>
</head>
<body>
    <div class="header-gradient">
        <div class="back-btn" onclick="history.back()">⬅️</div>
        <div style="font-size: 22px; font-weight: bold;">خريطة المنهج</div>
    </div>

    <div id="mapList" style="margin-top: -20px; padding-bottom: 20px;">
        <div style="text-align: center; padding: 50px; color: #BCBCBC;">جاري تحميل الخريطة التعليمية...</div>
    </div>

    <div class="bottom-nav">
        <a href="home.html" class="nav-item">🏠<br>الرئيسية</a>
        <a href="courses.html" class="nav-item">📖<br>المواد</a>
        <a href="profile.html" class="nav-item">👤<br>حسابي</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        function loadMap() {
            database.ref('Subjects').on('value', async (snapshot) => {
                const list = document.getElementById('mapList');
                list.innerHTML = "";

                if (snapshot.exists()) {
                    const subjects = snapshot.val();
                    for (const id in subjects) {
                        const sub = subjects[id];
                        const lecturesSnap = await database.ref('Lectures').child(sub.name).once('value');
                        const count = lecturesSnap.exists() ? Object.keys(lecturesSnap.val()).length : 0;

                        const card = document.createElement('div');
                        card.className = "card map-card";
                        card.innerHTML = `
                            <div class="map-icon">📍</div>
                            <div class="map-info">
                                <div class="map-title">مادة ${sub.name}</div>
                                <div class="map-stats">تم إصدار ${count} محاضرة حتى الآن</div>
                            </div>
                            <div style="color: var(--primary); font-size: 20px;">⬅️</div>
                        `;
                        card.onclick = () => { location.href = `lessons.html?subject=${encodeURIComponent(sub.name)}`; };
                        list.appendChild(card);
                    }
                } else {
                    list.innerHTML = `<div style="text-align:center; padding:50px; color:#BCBCBC;">لا توجد بيانات للخريطة حالياً</div>`;
                }
            });
        }
        loadMap();
    </script>
</body>
</html>
