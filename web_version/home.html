<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرئيسية - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #0984E3; --bg: #F8F9FE; }
        body { font-family: 'Cairo', sans-serif; background-color: var(--bg); margin: 0; padding-bottom: 80px; }
        .header { background: linear-gradient(45deg, #74b9ff, #0984E3); padding: 50px 20px; color: white; border-radius: 0 0 40px 40px; text-align: center; }
        .welcome-card { background: #E8EAFF; margin: -40px 20px 20px; padding: 25px; border-radius: 30px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; padding: 0 20px; }
        .card { background: white; padding: 20px; border-radius: 25px; text-align: center; box-shadow: 0 5px 15px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; }
        .card:hover { transform: scale(1.05); }
        .card i { font-size: 35px; display: block; margin-bottom: 10px; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: white; height: 70px; display: flex; justify-content: space-around; align-items: center; box-shadow: 0 -5px 20px rgba(0,0,0,0.05); border-radius: 25px 25px 0 0; }
        .nav-item { text-align: center; color: #BCBCBC; font-size: 12px; cursor: pointer; }
        .nav-item.active { color: var(--primary); font-weight: bold; }
    </style>
</head>
<body>
    <div class="header">
        <h2>ELKHETA</h2>
    </div>

    <div class="welcome-card">
        <h2 id="userName">أهلاً بك يا طالب</h2>
        <p style="color: #636E72; margin: 0;">رحلتك التعليمية الممتعة تبدأ الآن 🚀</p>
    </div>

    <div class="grid">
        <div class="card" onclick="alert('قريباً')">
            <span style="font-size: 40px;">📚</span>
            <h3>المواد</h3>
        </div>
        <div class="card" onclick="alert('قريباً')">
            <span style="font-size: 40px;">🔔</span>
            <h3>التنبيهات</h3>
        </div>
        <div class="card" onclick="alert('قريباً')">
            <span style="font-size: 40px;">🗺️</span>
            <h3>الخريطة</h3>
        </div>
        <div class="card" onclick="alert('قريباً')">
            <span style="font-size: 40px;">⚠️</span>
            <h3>الأخطاء</h3>
        </div>
    </div>

    <div class="bottom-nav">
        <div class="nav-item active">🏠<br>الرئيسية</div>
        <div class="nav-item">📖<br>المواد</div>
        <div class="nav-item">👤<br>حسابي</div>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (user) {
            document.getElementById('userName').innerText = "أهلاً بك يا " + user.fullName;
        } else {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
