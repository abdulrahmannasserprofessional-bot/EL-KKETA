<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>إدارة الطلاب والاشتراكات - ELKHETA PRO 2027</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1E3A8A;
            --accent: #38BDF8;
            --gold: #F59E0B;
            --bg-body: #F8FAFC;
            --surface: #FFFFFF;
            --surface-glass: rgba(255, 255, 255, 0.9);
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --exec-gradient: linear-gradient(135deg, #090D16 0%, #0F172A 40%, #1E3A8A 85%, #2563EB 100%);
        }

        [data-theme="dark"] {
            --bg-body: #070B14;
            --surface: #0F172A;
            --surface-glass: rgba(15, 23, 42, 0.92);
            --border-color: #1E293B;
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --card-shadow: 0 14px 35px -8px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .ambient-glow {
            position: fixed;
            top: 0; right: 0; width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.12) 0%, transparent 70%);
            z-index: 0; pointer-events: none; filter: blur(50px);
        }

        .exec-header {
            background: var(--exec-gradient);
            padding: 30px 20px 75px;
            position: relative;
            overflow: hidden;
            border-bottom-left-radius: 36px;
            border-bottom-right-radius: 36px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.25);
            z-index: 2;
        }

        .exec-header::after {
            content: '';
            position: absolute;
            bottom: -60px; left: -40px;
            width: 240px; height: 240px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .header-container {
            max-width: 1060px;
            margin: 0 auto;
            position: relative;
            z-index: 3;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #FFFFFF;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .back-btn:hover {
            background: rgba(255, 255, 255, 0.22);
            transform: translateX(4px);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle-btn {
            width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.2s;
        }
        .theme-toggle-btn:hover { background: rgba(255, 255, 255, 0.25); transform: rotate(15deg); }

        .header-title-box { color: #FFFFFF; }
        .badge-academic {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #FDE68A;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: 0.3px;
        }
        .header-title {
            font-size: 26px;
            font-weight: 900;
            letter-spacing: -0.5px;
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-subtitle {
            font-size: 13px;
            color: #94A3B8;
            margin-top: 6px;
            font-weight: 600;
        }

        .main-content {
            max-width: 1060px;
            margin: -45px auto 0;
            padding: 0 16px;
            position: relative;
            z-index: 5;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 14px;
            margin-bottom: 24px;
        }
        @media (max-width: 640px) {
            .kpi-grid { grid-template-columns: 1fr; }
        }

        .kpi-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 18px 20px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
            transition: all 0.25s ease;
        }
        .kpi-card:hover { transform: translateY(-3px); }
        .kpi-card::before {
            content: '';
            position: absolute;
            top: 0; right: 0; width: 4px; height: 100%;
        }
        .kpi-card.blue::before { background: #2563EB; }
        .kpi-card.green::before { background: #10B981; }
        .kpi-card.purple::before { background: #8B5CF6; }

        .kpi-info h4 { font-size: 12px; font-weight: 700; color: var(--text-sub); }
        .kpi-info .kpi-num { font-size: 26px; font-weight: 900; color: var(--text-main); margin-top: 4px; line-height: 1; }
        .kpi-icon {
            width: 48px; height: 48px;
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .kpi-card.blue .kpi-icon { background: rgba(37, 99, 235, 0.1); color: #2563EB; }
        .kpi-card.green .kpi-icon { background: rgba(16, 185, 129, 0.1); color: #10B981; }
        .kpi-card.purple .kpi-icon { background: rgba(139, 92, 246, 0.1); color: #8B5CF6; }

        .controls-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 18px 20px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .search-bar-wrap {
            position: relative;
            width: 100%;
        }
        .search-input {
            width: 100%;
            padding: 14px 46px 14px 18px;
            background: var(--bg-body);
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            font-weight: 600;
            outline: none;
            transition: all 0.25s;
        }
        .search-input:focus {
            border-color: var(--primary);
            background: var(--surface);
            box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12);
        }
        .search-icon-pos {
            position: absolute;
            right: 18px; top: 50%;
            transform: translateY(-50%);
            color: var(--text-sub);
            font-size: 16px;
        }

        .filter-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-chips-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .filter-chip {
            padding: 7px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .filter-chip:hover { border-color: var(--primary); color: var(--primary); }
        .filter-chip.active {
            background: var(--primary);
            color: #FFFFFF;
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .sort-btn {
            background: var(--bg-body);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .sort-btn:hover { background: var(--surface); border-color: var(--primary); }

        .students-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .student-item-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px 20px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }
        .student-item-card:hover {
            border-color: var(--primary);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px -6px rgba(37, 99, 235, 0.12);
        }
        @media (max-width: 768px) {
            .student-item-card {
                flex-direction: column;
                align-items: stretch;
                gap: 14px;
            }
        }

        .student-left-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            min-width: 0;
        }

        .avatar-ring {
            width: 52px; height: 52px; min-width: 52px;
            border-radius: 16px;
            background: linear-gradient(135deg, #1E3A8A, #3B82F6);
            color: #FFFFFF;
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; font-weight: 900;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.25);
            border: 2px solid rgba(255, 255, 255, 0.2);
            position: relative;
        }

        .student-details {
            flex: 1;
            min-width: 0;
        }
        .student-name-row {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .student-name {
            font-size: 15px;
            font-weight: 800;
            color: var(--text-main);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .index-badge {
            background: rgba(37, 99, 235, 0.1);
            color: var(--primary);
            font-size: 11px;
            font-weight: 800;
            padding: 2px 7px;
            border-radius: 6px;
        }
        .status-pill-badge {
            font-size: 11px;
            font-weight: 800;
            padding: 3px 9px;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .status-pill-badge.active { background: #DCFCE7; color: #15803D; }
        .status-pill-badge.banned { background: #FEE2E2; color: #B91C1C; }
        .status-pill-badge.warn { background: #FEF3C7; color: #B45309; }

        .student-meta-strip {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 6px;
        }
        .code-pill {
            font-family: monospace;
            font-size: 12px;
            font-weight: 800;
            color: #C2410C;
            background: #FFF7ED;
            border: 1px solid #FFEDD5;
            padding: 3px 9px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }
        .code-pill:hover { background: #FFEDD5; }

        .dept-tag {
            font-size: 11px;
            font-weight: 700;
            background: var(--bg-body);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
            padding: 2px 8px;
            border-radius: 6px;
        }

        .phone-link {
            font-size: 12px;
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            direction: ltr;
        }

        .actions-group {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        @media (max-width: 768px) {
            .actions-group {
                justify-content: flex-end;
                border-top: 1px dashed var(--border-color);
                padding-top: 10px;
            }
        }

        .action-icon-btn {
            width: 38px; height: 38px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-main);
            display: flex; align-items: center; justify-content: center;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .action-icon-btn:hover { transform: translateY(-2px); }
        .action-icon-btn.whatsapp { background: #DCFCE7; color: #166534; border-color: #BBF7D0; font-size: 16px; }
        .action-icon-btn.whatsapp:hover { background: #BBF7D0; }
        .action-icon-btn.ban { background: #FEF2F2; color: #DC2626; border-color: #FECACA; }
        .action-icon-btn.unban { background: #ECFDF5; color: #059669; border-color: #A7F3D0; }
        .action-icon-btn.reset { background: #EFF6FF; color: #1D4ED8; border-color: #BFDBFE; }
        .action-icon-btn.delete { background: #FFF1F2; color: #E11D48; border-color: #FFE4E6; }

        .score-badge {
            background: rgba(16, 185, 129, 0.12);
            color: #059669;
            border: 1px solid rgba(16, 185, 129, 0.25);
            padding: 4px 10px;
            border-radius: 8px;
            font-size: 11px;
            font-weight: 800;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .empty-box {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-sub);
            background: var(--surface);
            border-radius: 24px;
            border: 2px dashed var(--border-color);
        }
        .empty-box i { font-size: 48px; color: var(--primary); opacity: 0.4; margin-bottom: 14px; }
        .empty-box h3 { font-size: 16px; font-weight: 800; color: var(--text-main); margin-bottom: 6px; }
        .empty-box p { font-size: 13px; }

        .toast-bubble {
            position: fixed;
            bottom: 25px; left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #090D16;
            color: #FFFFFF;
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 12px 24px;
            border-radius: 16px;
            font-size: 13px;
            font-weight: 700;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            z-index: 99999;
            opacity: 0;
            pointer-events: none;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toast-bubble.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
    <script>
        if (sessionStorage.getItem('isAdmin') !== 'true' && !sessionStorage.getItem('isMysqlAdmin')) {
            if (localStorage.getItem('isAdmin') === 'true' || localStorage.getItem('isMysqlAdmin') === 'true') {
                sessionStorage.setItem('isAdmin', 'true');
                if (localStorage.getItem('adminRole')) sessionStorage.setItem('adminRole', localStorage.getItem('adminRole'));
                if (localStorage.getItem('adminName')) sessionStorage.setItem('adminName', localStorage.getItem('adminName'));
                if (localStorage.getItem('adminPermissions')) sessionStorage.setItem('adminPermissions', localStorage.getItem('adminPermissions'));
            } else {
                window.location.href = "admin-gate.html";
            }
        }
        const role = sessionStorage.getItem('adminRole') || localStorage.getItem('adminRole') || 'master';
        if (role !== 'master' && role !== 'super_admin') {
            try {
                const perms = JSON.parse(sessionStorage.getItem('adminPermissions') || localStorage.getItem('adminPermissions') || '{}');
                if (!perms.all && !perms.students) {
                    alert("⛔ ليس لديك صلاحية للوصول إلى إدارة الطلاب");
                    window.location.href = "admin-panel.html";
                }
            } catch(e) {}
        }

        const savedTheme = localStorage.getItem('admin_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <div class="ambient-glow"></div>

    <header class="exec-header">
        <div class="header-container">
            <div class="header-top">
                <a href="admin-panel.html" class="back-btn">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>لوحة الإدارة</span>
                </a>
                <div class="header-actions">
                    <button class="theme-toggle-btn" onclick="toggleTheme()" title="تبديل المظهر">
                        <i class="fa-solid fa-moon" id="themeIcon"></i>
                    </button>
                </div>
            </div>

            <div class="header-title-box">
                <div class="badge-academic">
                    <i class="fa-solid fa-shield-halved"></i>
                    <span>سجلات الدفعة 2027 • فرقة رابعة</span>
                </div>
                <h1 class="header-title">
                    <i class="fa-solid fa-user-graduate" style="color:#38BDF8;"></i>
                    <span>إدارة الطلاب والاشتراكات</span>
                </h1>
                <p class="header-subtitle">التحكم الكامل في حسابات الطلاب، الأجهزة المقترنة، الحظر، والتواصل المباشر</p>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="kpi-grid">
            <div class="kpi-card blue">
                <div class="kpi-info">
                    <h4>إجمالي الطلاب المسجلين</h4>
                    <div class="kpi-num" id="totalStudents">—</div>
                </div>
                <div class="kpi-icon"><i class="fa-solid fa-users"></i></div>
            </div>
            <div class="kpi-card green">
                <div class="kpi-info">
                    <h4>نشط اليوم بالمنصة</h4>
                    <div class="kpi-num" id="activeToday">—</div>
                </div>
                <div class="kpi-icon"><i class="fa-solid fa-bolt"></i></div>
            </div>
            <div class="kpi-card purple">
                <div class="kpi-info">
                    <h4>متوسط الدرجات العام</h4>
                    <div class="kpi-num" id="avgScore">—</div>
                </div>
                <div class="kpi-icon"><i class="fa-solid fa-chart-pie"></i></div>
            </div>
        </div>

        <div class="controls-card">
            <div class="search-bar-wrap">
                <i class="fa-solid fa-magnifying-glass search-icon-pos"></i>
                <input type="text" class="search-input" id="searchInput" placeholder="ابحث باسم الطالب، كود الدخول، أو رقم الهاتف..." oninput="filterStudents()">
            </div>

            <div class="filter-row">
                <div class="filter-chips-group">
                    <button class="filter-chip active" id="chip-all" onclick="setStatusFilter('all')">
                        <i class="fa-solid fa-list-ul"></i> الكل (<span id="countFilterAll">0</span>)
                    </button>
                    <button class="filter-chip" id="chip-active" onclick="setStatusFilter('active')">
                        <i class="fa-solid fa-circle-check" style="color:#10B981;"></i> نشط
                    </button>
                    <button class="filter-chip" id="chip-banned" onclick="setStatusFilter('banned')">
                        <i class="fa-solid fa-ban" style="color:#EF4444;"></i> محظور
                    </button>
                    <button class="filter-chip" id="chip-warnings" onclick="setStatusFilter('warnings')">
                        <i class="fa-solid fa-triangle-exclamation" style="color:#F59E0B;"></i> إنذارات
                    </button>
                </div>

                <button class="sort-btn" id="sortToggleBtn" onclick="toggleSortOrder()">
                    <i class="fa-solid fa-arrow-down-wide-short"></i>
                    <span id="sortLabel">الأحدث تسجيلاً</span>
                </button>
            </div>
        </div>

        <div class="students-list" id="studentsList">
            <div class="empty-box">
                <i class="fa-solid fa-circle-notch fa-spin"></i>
                <h3>جاري تحميل سجلات الطلاب...</h3>
                <p>يتم الاتصال بقاعدة البيانات اللحظية الآن</p>
            </div>
        </div>
    </main>

    <div class="toast-bubble" id="toastBubble"></div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const API_BASE = "https://backendapi-pi.vercel.app/api";
        let allStudents = [];
        let currentStatusFilter = 'all';
        let sortDesc = true;

        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('admin_theme', next);
            updateThemeIcon(next);
        }

        function updateThemeIcon(t) {
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = t === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }
        updateThemeIcon(savedTheme);

        function showToast(msg) {
            const t = document.getElementById('toastBubble');
            t.innerHTML = `<i class="fa-solid fa-circle-info" style="color:#38BDF8;"></i> <span>${msg}</span>`;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3500);
        }

        function getInitial(name) {
            return name ? name.trim().charAt(0) : '🎓';
        }

        function copyCode(code) {
            if (!code) return;
            navigator.clipboard.writeText(code).then(() => {
                showToast(`تم نسخ كود الطالب: ${code}`);
            }).catch(() => {
                showToast(`كود الطالب: ${code}`);
            });
        }

        function toggleSortOrder() {
            sortDesc = !sortDesc;
            document.getElementById('sortLabel').textContent = sortDesc ? 'الأحدث تسجيلاً' : 'الأقدم تسجيلاً';
            filterStudents();
        }

        function setStatusFilter(filter) {
            currentStatusFilter = filter;
            ['all', 'active', 'banned', 'warnings'].forEach(id => {
                const el = document.getElementById(`chip-${id}`);
                if (el) el.classList.toggle('active', id === filter);
            });
            filterStudents();
        }

        database.ref('Students').on('value', snap => {
            allStudents = [];
            let totalScore = 0, scoreCount = 0;

            if (snap.exists()) {
                snap.forEach(child => {
                    const val = child.val();
                    if (val) {
                        val.firebaseKey = child.key;
                        val.studentCode = val.studentCode || val.code || child.key;
                        val.fullName = val.fullName || val.name || 'طالب مسجل';
                        val.whatsapp = val.whatsapp || val.phone || val.parentWhatsapp || '';
                        allStudents.push(val);

                        if (val.stats && typeof val.stats.averageScore === 'number') {
                            totalScore += val.stats.averageScore;
                            scoreCount++;
                        }
                    }
                });
            }

            document.getElementById('totalStudents').textContent = allStudents.length;
            document.getElementById('countFilterAll').textContent = allStudents.length;
            document.getElementById('activeToday').textContent = allStudents.filter(s => s.lastActive && (Date.now() - s.lastActive < 86400000)).length || '0';
            document.getElementById('avgScore').textContent = scoreCount > 0 ? Math.round(totalScore / scoreCount) + '%' : '—';

            filterStudents();
        });

        function filterStudents() {
            const q = document.getElementById('searchInput').value.trim().toLowerCase();
            let filtered = allStudents;

            if (currentStatusFilter === 'active') {
                filtered = filtered.filter(s => !s.isBanned && s.is_banned != 1 && (!s.warnings || s.warnings === 0));
            } else if (currentStatusFilter === 'banned') {
                filtered = filtered.filter(s => s.isBanned || s.is_banned == 1);
            } else if (currentStatusFilter === 'warnings') {
                filtered = filtered.filter(s => s.warnings > 0 && !s.isBanned && s.is_banned != 1);
            }

            if (q) {
                filtered = filtered.filter(s =>
                    (s.fullName || '').toLowerCase().includes(q) ||
                    (s.studentCode || '').toLowerCase().includes(q) ||
                    (s.whatsapp || '').includes(q)
                );
            }

            renderStudents(filtered);
        }

        function renderStudents(list) {
            const container = document.getElementById('studentsList');
            container.innerHTML = "";

            if (!list || list.length === 0) {
                container.innerHTML = `
                    <div class="empty-box">
                        <i class="fa-solid fa-user-slash"></i>
                        <h3>لا يوجد طلاب مطابقين للبحث</h3>
                        <p>تأكد من كتابة الاسم أو الكود بشكل صحيح أو قم بتغيير الفلتر</p>
                    </div>
                `;
                return;
            }

            const sorted = [...list].sort((a, b) => {
                const dateA = a.joinDate || a.createdAt || 0;
                const dateB = b.joinDate || b.createdAt || 0;
                return sortDesc ? (dateB - dateA) : (dateA - dateB);
            });

            sorted.forEach((st, idx) => {
                const isBanned = Boolean(st.isBanned || st.is_banned == 1);
                const hasWarnings = (st.warnings > 0);
                
                let statusBadge = `<span class="status-pill-badge active"><i class="fa-solid fa-circle-check"></i> نشط</span>`;
                if (isBanned) {
                    statusBadge = `<span class="status-pill-badge banned"><i class="fa-solid fa-ban"></i> محظور</span>`;
                } else if (hasWarnings) {
                    statusBadge = `<span class="status-pill-badge warn"><i class="fa-solid fa-triangle-exclamation"></i> إنذار (${st.warnings}/3)</span>`;
                }

                const scoreBadge = (st.stats && typeof st.stats.averageScore === 'number')
                    ? `<span class="score-badge"><i class="fa-solid fa-chart-line"></i> ${st.stats.averageScore}%</span>`
                    : '';

                const escName = (st.fullName || 'طالب').replace(/'/g, "\\'");
                const escCode = (st.studentCode || '').replace(/'/g, "\\'");

                const card = document.createElement('div');
                card.className = "student-item-card";
                card.innerHTML = `
                    <div class="student-left-wrap">
                        <div class="avatar-ring">${getInitial(st.fullName)}</div>
                        <div class="student-details">
                            <div class="student-name-row">
                                <span class="index-badge">#${idx + 1}</span>
                                <span class="student-name" title="${st.fullName}">${st.fullName}</span>
                                ${statusBadge}
                                ${scoreBadge}
                            </div>
                            <div class="student-meta-strip">
                                <span class="code-pill" onclick="copyCode('${escCode}')" title="انقر لنسخ الكود">
                                    <i class="fa-regular fa-copy"></i>
                                    <span>${st.studentCode || '—'}</span>
                                </span>
                                <span class="dept-tag">الفرقة الرابعة • 2027</span>
                                ${st.whatsapp ? `
                                    <a href="tel:${st.whatsapp}" class="phone-link">
                                        <i class="fa-solid fa-phone"></i>
                                        <span>${st.whatsapp}</span>
                                    </a>
                                ` : `<span style="font-size:11px; color:var(--text-sub);">بدون هاتف</span>`}
                            </div>
                        </div>
                    </div>

                    <div class="actions-group">
                        <button class="action-icon-btn whatsapp" onclick="sendStudentWhatsApp('${st.whatsapp || ''}', '${escName}', '${escCode}')" title="مراسلة في واتساب مع كود الدخول">
                            <i class="fa-brands fa-whatsapp"></i>
                        </button>
                        <button class="action-icon-btn ${isBanned ? 'unban' : 'ban'}" onclick="toggleStudentBan('${escCode}', ${isBanned})" title="${isBanned ? 'فك حظر الطالب' : 'حظر الطالب'}">
                            <i class="fa-solid ${isBanned ? 'fa-lock-open' : 'fa-ban'}"></i>
                        </button>
                        <button class="action-icon-btn reset" onclick="resetStudentDevice('${escCode}')" title="تصفير الجهاز المقترن للطالب">
                            <i class="fa-solid fa-mobile-screen-button"></i>
                        </button>
                        <button class="action-icon-btn delete" onclick="deleteStudentDirect('${escCode}', '${escName}')" title="حذف حساب الطالب نهائياً">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        async function toggleStudentBan(code, isCurrentlyBanned) {
            const newBanState = !isCurrentlyBanned;
            const actionText = newBanState ? 'حظر حساب الطالب' : 'فك حظر حساب الطالب';

            Swal.fire({
                title: `${actionText}؟`,
                text: newBanState ? 'لن يتمكن الطالب من دخول المنصة أو أداء الامتحانات حتى يتم فك الحظر.' : 'سيتمكن الطالب من الدخول فوراً واستئناف الدراسة.',
                icon: newBanState ? 'warning' : 'question',
                showCancelButton: true,
                confirmButtonColor: newBanState ? '#DC2626' : '#10B981',
                cancelButtonColor: '#64748B',
                confirmButtonText: 'نعم، نفذ الإجراء',
                cancelButtonText: 'إلغاء'
            }).then(async (res) => {
                if (res.isConfirmed) {
                    await database.ref('Students/' + code).update({
                        isBanned: newBanState,
                        warnings: newBanState ? 3 : 0,
                        bannedReason: newBanState ? 'تم الحظر بواسطة الإدارة' : null,
                        bannedAt: newBanState ? Date.now() : null
                    });

                    try {
                        await fetch(`${API_BASE}/students/${code}/ban`, {
                            method: 'PATCH',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ isBanned: newBanState, reason: newBanState ? 'إداري' : '' })
                        });
                    } catch(e) {}

                    showToast(`تم ${actionText} بنجاح!`);
                }
            });
        }

        async function resetStudentDevice(code) {
            Swal.fire({
                title: 'تصفير جهاز الطالب؟',
                text: 'سيتم مسح بصمة الجهاز الحالية والسماح للطالب بتسجيل الدخول من أي هاتف أو كمبيوتر جديد.',
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#2563EB',
                cancelButtonColor: '#64748B',
                confirmButtonText: 'نعم، تصفير الجهاز',
                cancelButtonText: 'إلغاء'
            }).then(async (res) => {
                if (res.isConfirmed) {
                    await database.ref('Students/' + code).update({
                        registeredDevice: null,
                        deviceId: null,
                        warnings: 0,
                        forgivenMessage: true
                    });

                    try {
                        await fetch(`${API_BASE}/students/${code}/reset-device`, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' }
                        });
                    } catch(e) {}

                    showToast("تم تصفير جهاز الطالب بنجاح!");
                }
            });
        }

        function deleteStudentDirect(code, name) {
            Swal.fire({
                title: 'حذف حساب الطالب نهائياً؟',
                html: `هل أنت متأكد تماماً من حذف حساب الطالب:<br><b style="color:#DC2626; font-size:16px;">${name}</b> (${code})؟<br>سيتم مسح كافة سجلات الطالب وامتحاناته نهائياً.`,
                icon: 'warning',
                showCancelButton: true,
                confirmButtonColor: '#DC2626',
                cancelButtonColor: '#64748B',
                confirmButtonText: 'نعم، حذف نهائياً',
                cancelButtonText: 'إلغاء'
            }).then(async (res) => {
                if (res.isConfirmed) {
                    await database.ref('Students/' + code).remove();

                    try {
                        await fetch(`${API_BASE}/students/${code}`, {
                            method: 'DELETE',
                            headers: { 'Content-Type': 'application/json' }
                        });
                    } catch(e) {}

                    showToast("تم حذف حساب الطالب بنجاح");
                }
            });
        }

        function sendStudentWhatsApp(phone, name, code) {
            const cleanPhone = (phone || '').replace(/[^0-9]/g, '');
            const waNumber = cleanPhone.startsWith('01') ? '2' + cleanPhone : cleanPhone;
            const waMessage = encodeURIComponent(`أهلاً بك يا ${name || 'طالبنا العزيز'} في منصة الخطة 🎓 (دفعة 2027)\\nكود الدخول الخاص بك هو: ${code}\\nرابط المنصة: https://elkheta2026.web.app`);
            window.open(`https://wa.me/${waNumber}?text=${waMessage}`, '_blank');
        }
    </script>
</body>
</html>
