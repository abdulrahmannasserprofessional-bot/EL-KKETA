        :root {
            --bg-page: #FAF7F2;
            --bg-surface: #FFFFFF;

            --border-card: #EFE8DC;
            --border-gold: #E8D3B2;

            --gold-light: #FDF4E6;
            --gold-text: #8E5D16;

            --text-muted: #8C827A;

        * {

            box-sizing: border-box;

            -webkit-tap-highlight-color: transparent;

            <h1 class="card-title">تسجيل دخول الإدارة</h1>

        <form onsubmit="handleAdminLogin(event)" style="display: flex; flex-direction: column; gap: 15px;">
            <!-- Username / Email -->
            <div class="form-group">
                <label class="form-label" for="adminUserInput">
                    <i class="fa-solid fa-envelope" style="color: var(--gold-primary); font-size: 13px;"></i>

                    <input type="text" id="adminUserInput" class="form-input" placeholder="اسم المستخدم أو البريد" value="" autocomplete="username" required>
                </div>
            </div>

            <!-- Password -->
            <div class="form-group">
                <label class="form-label" for="adminPassInput">
                    <i class="fa-solid fa-lock" style="color: var(--gold-primary); font-size: 13px;"></i>

                    <i class="fa-solid fa-key input-icon-prefix"></i>
                    <input type="password" id="adminPassInput" class="form-input" placeholder="كلمة المرور السرية" value="" autocomplete="current-password" required>
                    <button type="button" class="toggle-pwd-btn" onclick="togglePassVisibility()" title="إظهار/إخفاء كلمة المرور">

    <script>
        function togglePassVisibility() {
            const input = document.getElementById('adminPassInput');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const userInput = document.getElementById('adminUserInput').value.trim();
            const passInput = document.getElementById('adminPassInput').value.trim();
            const btn = document.getElementById('loginBtn');

            if (!userInput || !passInput) {
                Swal.fire({
                    icon: 'warning',
                    title: 'بيانات ناقصة',
                    text: 'يرجى إدخال اسم المستخدم وكلمة المرور للدخول.',
                    confirmButtonColor: '#C28B38',
                    confirmButtonText: 'حسناً'
                });
                return;
            }

            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> جاري التحقق من الصلاحيات...';
            btn.disabled = true;

            // Authorized Passwords / PINs:
            // 1. Master Firebase PIN: 2862005
            // 2. Standard Admin Credentials
            let isValid = false;
            let adminRole = 'master';
            let adminName = 'عبدالرحمن ناصر';
            let roleTitle = 'مدير المنصة العام';

            // Check hardcoded secure master credentials
            if (passInput === '2862005' || passInput === 'admin2862005' || passInput === 'elkheta2026' || (userInput.toLowerCase() === 'admin' && (passInput === '2862005' || passInput === 'admin' || passInput === '123456'))) {
                isValid = true;
            } else if (userInput.includes('supervisor') || userInput.includes('مشرف')) {
                // Supervisor role
                if (passInput === '2862005' || passInput === 'sup2026') {
                    isValid = true;
                    adminRole = 'supervisor';
                    adminName = 'مشرف أكاديمي';
                    roleTitle = 'مشرف المنصة';
                }
            }

            // Also check Firebase remote Settings/adminPin if online
            if (!isValid && window.database) {
                try {
                    const snap = await database.ref('Settings/adminPin').once('value');
                    const remotePin = snap.val();
                    if (remotePin && String(remotePin).trim() === passInput) {
                        isValid = true;
                    }
                } catch(err) {
                    console.log('Firebase auth fallback check:', err);
                }
            }

            if (isValid) {
                btn.innerHTML = '<i class="fa-solid fa-check"></i> تم التحقق بنجاح!';
                btn.style.background = '#10B981';

                sessionStorage.setItem('isAdmin', 'true');
                sessionStorage.setItem('adminRole', adminRole);
                sessionStorage.setItem('adminName', adminName);
                sessionStorage.setItem('adminRoleTitle', roleTitle);
                sessionStorage.setItem('adminPermissions', JSON.stringify({ all: true, config: true, students: true, courses: true, exams: true }));

                if (document.getElementById('rememberAdmin') && document.getElementById('rememberAdmin').checked) {
                    localStorage.setItem('isAdmin', 'true');
                }

                setTimeout(() => {
                    window.location.href = 'admin-panel.html';
                }, 300);
            } else {
                btn.innerHTML = '<span>دخول مباشر إلى لوحة التحكم</span> <i class="fa-solid fa-arrow-left"></i>';
                btn.disabled = false;

                Swal.fire({
                    icon: 'error',
                    title: 'عذراً، كلمة المرور غير صحيحة ❌',
                    text: 'بيانات الدخول المدخلة غير مصرح بها. يرجى إدخال الرمز السري الصحيح لإدارة المنصة.',
                    confirmButtonColor: '#E11D48',
                    confirmButtonText: 'إعادة المحاولة'
                });
            }
        }
    </script>
</body>
</html>
