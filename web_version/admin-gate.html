<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>بوابة الإدارة والأمان - ELKHETA PRO 2027</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1E3A8A;
            --accent: #38BDF8;
            --bg-dark: #070B14;
            --card-glass: rgba(15, 23, 42, 0.85);
            --border-glass: rgba(255, 255, 255, 0.12);
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
            padding: 24px 16px;
            overflow-x: hidden;
            color: var(--text-main);
        }

        .ambient-glow-1 {
            position: absolute;
            top: -100px; right: -80px;
            width: 480px; height: 480px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.25) 0%, transparent 70%);
            z-index: 0; pointer-events: none; filter: blur(50px);
        }
        .ambient-glow-2 {
            position: absolute;
            bottom: -100px; left: -80px;
            width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.2) 0%, transparent 70%);
            z-index: 0; pointer-events: none; filter: blur(50px);
        }

        .gate-header {
            width: 100%;
            max-width: 450px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            z-index: 10;
        }
        .brand-link {
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            color: white;
            font-weight: 900;
            font-size: 16px;
        }
        .header-back-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: 0.2s;
        }

        .gate-card {
            width: 100%;
            max-width: 450px;
            background: var(--card-glass);
            border: 1px solid var(--border-glass);
            border-radius: 28px;
            padding: 32px 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(16px);
            position: relative;
            z-index: 10;
            margin: auto 0;
            text-align: center;
        }

        .shield-icon {
            width: 64px; height: 64px;
            background: linear-gradient(135deg, #1E3A8A, #2563EB);
            border: 2px solid rgba(56, 189, 248, 0.4);
            border-radius: 20px;
            margin: 0 auto 16px;
            display: flex; align-items: center; justify-content: center;
            font-size: 26px; color: #FFFFFF;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.4);
        }

        .role-tabs {
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.4);
            padding: 6px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin: 20px 0;
        }
        .role-tab {
            flex: 1;
            padding: 8px 10px;
            border-radius: 12px;
            border: none;
            background: transparent;
            color: var(--text-muted);
            font-weight: 800;
            font-size: 12px;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }
        .role-tab.active {
            background: var(--primary);
            color: #FFFFFF;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .passcode-input-wrap {
            position: relative;
            margin-bottom: 20px;
        }
        .passcode-input {
            width: 100%;
            padding: 16px 20px;
            background: rgba(0, 0, 0, 0.5);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            border-radius: 16px;
            color: #FFFFFF;
            font-size: 18px;
            text-align: center;
            font-family: monospace;
            letter-spacing: 4px;
            outline: none;
            transition: 0.25s;
        }
        .passcode-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 4px rgba(56, 189, 248, 0.15);
        }

        .btn-enter {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: #FFFFFF;
            border: none;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 800;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(37, 99, 235, 0.35);
            transition: 0.25s;
        }
        .btn-enter:hover { transform: translateY(-2px); box-shadow: 0 12px 30px rgba(37, 99, 235, 0.5); }

        .gate-footer {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            position: relative;
            z-index: 10;
        }
    </style>
</head>
<body>
    <div class="ambient-glow-1"></div>
    <div class="ambient-glow-2"></div>

    <header class="gate-header">
        <a href="index.html" class="brand-link">
            <i class="fa-solid fa-graduation-cap" style="color:#38BDF8;"></i>
            <span>الخطة 2027</span>
        </a>
        <a href="index.html" class="header-back-btn">العودة للرئيسية</a>
    </header>

    <div class="gate-card">
        <div class="shield-icon"><i class="fa-solid fa-shield-halved"></i></div>
        <h2 style="font-size:20px; font-weight:900;">بوابة الدخول والإدارة</h2>
        <p style="font-size:12px; color:var(--text-muted); margin-top:4px;">الفرقة الرابعة • العام الأكاديمي 2027</p>

        <div class="role-tabs">
            <button class="role-tab active" id="tab-master" onclick="setRole('master')">👑 أدمن رئيسي</button>
            <button class="role-tab" id="tab-supervisor" onclick="setRole('supervisor')">👥 مشرف منصة</button>
        </div>

        <form onsubmit="handleAdminLogin(event)">
            <div class="passcode-input-wrap">
                <input type="password" id="adminPassInput" class="passcode-input" placeholder="••••••••" autofocus autocomplete="current-password">
            </div>
            <button type="submit" class="btn-enter" id="loginBtn">
                <span>تسجيل الدخول للنظام</span>
                <i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i>
            </button>
        </form>
    </div>

    <footer class="gate-footer">
        <p>نظام الحماية والأمان المشفر • ELKHETA PLATFORM 2027</p>
    </footer>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        let currentRole = 'master';

        function setRole(role) {
            currentRole = role;
            document.getElementById('tab-master').classList.toggle('active', role === 'master');
            document.getElementById('tab-supervisor').classList.toggle('active', role === 'supervisor');
            document.getElementById('adminPassInput').focus();
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const pass = document.getElementById('adminPassInput').value.trim();
            if (!pass) {
                return Swal.fire('تنبيه', 'يرجى إدخال كود المرور', 'warning');
            }

            const btn = document.getElementById('loginBtn');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> جاري التحقق...';

            if (currentRole === 'master') {
                // Check Master Passcode
                if (pass === '01062002' || pass === 'admin2027' || pass === 'admin2026' || pass === 'elkheta2026') {
                    sessionStorage.setItem('isAdmin', 'true');
                    sessionStorage.setItem('adminRole', 'master');
                    localStorage.setItem('isAdmin', 'true');
                    localStorage.setItem('adminRole', 'master');
                    window.location.href = 'admin-panel.html';
                    return;
                }
            }

            // Check Supervisor code from Firebase
            try {
                const snap = await database.ref('Supervisors/' + pass).once('value');
                if (snap.exists()) {
                    const sup = snap.val();
                    sessionStorage.setItem('isAdmin', 'true');
                    sessionStorage.setItem('adminRole', 'supervisor');
                    sessionStorage.setItem('adminName', sup.name || 'مشرف');
                    localStorage.setItem('isAdmin', 'true');
                    localStorage.setItem('adminRole', 'supervisor');
                    window.location.href = 'admin-panel.html';
                    return;
                }
            } catch(err) {
                console.error(err);
            }

            btn.innerHTML = '<span>تسجيل الدخول للنظام</span> <i class="fa-solid fa-arrow-left" style="margin-right:6px;"></i>';
            Swal.fire({
                title: 'كود المرور غير صحيح!',
                text: 'تأكد من اختيار الرتبة وكتابة الكود بدقة.',
                icon: 'error',
                confirmButtonColor: '#2563EB'
            });
        }
    </script>
</body>
</html>
