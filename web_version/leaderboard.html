<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>لوحة الشرف والمتصدرين - منصة الخطة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Alexandria:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="motion-fx.css?v=2.0">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <script src="motion-fx.js?v=2.0" defer></script>
    <style>
        :root {
            --primary: #3B82F6;
            --primary-glow: rgba(59, 130, 246, 0.4);
            --accent: #F59E0B;
            --accent-glow: rgba(245, 158, 11, 0.4);
            --bg-body: #070D1E;
            --bg-card: rgba(15, 23, 42, 0.7);
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(245, 158, 11, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 10% 40%, rgba(59, 130, 246, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 90% 80%, rgba(99, 102, 241, 0.1) 0%, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 95px;
            direction: rtl;
            overflow-x: hidden;
        }

        .leaderboard-app-container {
            width: 100%;
            max-width: 980px;
            margin: 0 auto;
            padding: 20px 20px 30px;
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        /* ─── Topbar ─── */
        .lb-topbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border-radius: 22px;
            padding: 14px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-color);
            position: sticky;
            top: 14px;
            z-index: 100;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-logo-badge {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #B45309 0%, #F59E0B 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 20px;
            box-shadow: 0 6px 18px rgba(245, 158, 11, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-nav-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #CBD5E1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
        }
        .btn-nav-icon:hover {
            background: rgba(59, 130, 246, 0.25);
            color: #60A5FA;
            border-color: rgba(96, 165, 250, 0.4);
            transform: translateY(-2px);
        }

        /* ─── Hero Banner ─── */
        .lb-hero-banner {
            background: linear-gradient(135deg, rgba(30, 27, 75, 0.85) 0%, rgba(30, 58, 138, 0.75) 50%, rgba(180, 83, 9, 0.75) 100%);
            border-radius: 26px;
            padding: 28px 24px;
            color: white;
            text-align: center;
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.4), inset 0 1px 1px rgba(255, 255, 255, 0.3);
        }
        .lb-hero-banner h2 {
            font-size: 24px;
            font-weight: 900;
            margin-bottom: 6px;
            font-family: 'Alexandria', 'Cairo', sans-serif;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }
        .lb-hero-banner p {
            font-size: 13.5px;
            color: #E2E8F0;
            font-weight: 600;
            max-width: 600px;
            margin: 0 auto;
        }

        /* ─── Podium Section ─── */
        .podium-section-wrap {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 16px;
            margin: 20px 0 10px;
            padding-top: 30px;
        }

        .podium-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            width: 30%;
            max-width: 175px;
        }

        .podium-avatar-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.9);
            border: 3.5px solid;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            margin-bottom: -18px;
            position: relative;
            z-index: 5;
            backdrop-filter: blur(8px);
        }

        .podium-col.rank-1 .podium-avatar-circle {
            width: 92px;
            height: 92px;
            font-size: 42px;
            border-color: #F59E0B;
            box-shadow: 0 0 35px rgba(245, 158, 11, 0.6);
        }
        .podium-col.rank-2 .podium-avatar-circle {
            border-color: #94A3B8;
            box-shadow: 0 0 25px rgba(148, 163, 184, 0.4);
        }
        .podium-col.rank-3 .podium-avatar-circle {
            border-color: #D97706;
            box-shadow: 0 0 25px rgba(217, 119, 6, 0.4);
        }

        .crown-icon-float {
            position: absolute;
            top: -30px;
            font-size: 30px;
            animation: crownBounce 2.5s ease-in-out infinite alternate;
            filter: drop-shadow(0 4px 12px rgba(245, 158, 11, 0.8));
        }

        @keyframes crownBounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-7px) scale(1.12); }
        }

        .podium-stand-box {
            width: 100%;
            border-radius: 22px 22px 0 0;
            padding: 28px 10px 14px;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            text-align: center;
            box-shadow: 0 12px 35px rgba(0,0,0,0.4);
            border-top: 1px solid rgba(255, 255, 255, 0.2);
        }

        .podium-col.rank-1 .podium-stand-box {
            height: 170px;
            background: linear-gradient(180deg, rgba(245, 158, 11, 0.9) 0%, rgba(180, 83, 9, 0.85) 100%);
            box-shadow: 0 10px 30px rgba(245, 158, 11, 0.35);
        }
        .podium-col.rank-2 .podium-stand-box {
            height: 135px;
            background: linear-gradient(180deg, rgba(148, 163, 184, 0.85) 0%, rgba(71, 85, 105, 0.85) 100%);
        }
        .podium-col.rank-3 .podium-stand-box {
            height: 110px;
            background: linear-gradient(180deg, rgba(217, 119, 6, 0.85) 0%, rgba(146, 64, 14, 0.85) 100%);
        }

        .podium-student-name {
            font-size: 14.5px;
            font-weight: 900;
            font-family: 'Alexandria', 'Cairo', sans-serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90%;
            margin-bottom: 3px;
        }
        .podium-col.rank-1 .podium-student-name {
            font-size: 16.5px;
        }

        .podium-score-badge {
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(4px);
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .podium-rank-num {
            font-size: 34px;
            font-weight: 900;
            opacity: 0.35;
            margin-top: auto;
            line-height: 1;
            font-family: 'Alexandria', sans-serif;
        }

        /* ─── Rank List Cards ─── */
        .ranks-list-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .rank-card-row {
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .rank-card-row:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4), 0 0 20px rgba(59, 130, 246, 0.2);
            border-color: rgba(59, 130, 246, 0.4);
        }

        .rank-card-row.is-me {
            background: rgba(30, 58, 138, 0.45);
            border-color: rgba(96, 165, 250, 0.5);
            box-shadow: 0 8px 30px rgba(37, 99, 235, 0.3);
        }

        .rank-left-group {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
            overflow: hidden;
        }

        .rank-number-pill {
            width: 36px;
            height: 36px;
            border-radius: 12px;
            background: rgba(30, 41, 59, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #CBD5E1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 900;
            font-size: 14px;
            flex-shrink: 0;
            font-family: 'Alexandria', sans-serif;
        }
        .rank-card-row.is-me .rank-number-pill {
            background: linear-gradient(135deg, #2563EB, #1D4ED8);
            color: white;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
        }

        .rank-avatar-box {
            width: 46px;
            height: 46px;
            border-radius: 16px;
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            flex-shrink: 0;
        }

        .rank-student-info {
            overflow: hidden;
        }
        .rank-student-name {
            font-size: 15px;
            font-weight: 800;
            color: #FFFFFF;
            font-family: 'Alexandria', 'Cairo', sans-serif;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .rank-student-sub {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
            margin-top: 3px;
        }

        .rank-score-chip {
            background: rgba(59, 130, 246, 0.18);
            color: #60A5FA;
            border: 1px solid rgba(59, 130, 246, 0.35);
            padding: 6px 14px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 900;
            white-space: nowrap;
            flex-shrink: 0;
            font-family: 'Alexandria', sans-serif;
        }

        .loading-state-box {
            text-align: center;
            padding: 50px 20px;
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            border-radius: 22px;
            border: 1px solid var(--border-color);
            font-size: 15px;
            font-weight: 700;
            color: var(--text-muted);
        }

        /* ─── Mobile Bottom Nav ─── */
        .mobile-bottom-nav {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(15, 23, 42, 0.92);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            height: 68px;
            align-items: center;
            justify-content: space-around;
            z-index: 1000;
            box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.5);
        }

        .bottom-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            color: #64748B;
            font-size: 11px;
            font-weight: 800;
            gap: 4px;
            padding: 8px 12px;
            position: relative;
        }
        .bottom-nav-item i { font-size: 19px; }
        .bottom-nav-item.active { color: #60A5FA; }
        .bottom-nav-item.active::after {
            content: '';
            position: absolute;
            top: -6px;
            width: 24px;
            height: 3px;
            border-radius: 3px;
            background: #3B82F6;
            box-shadow: 0 0 10px #3B82F6;
        }

        @media (max-width: 991px) {
            .mobile-bottom-nav { display: flex; }
        }
    </style>
</head>
<body>

    <div class="leaderboard-app-container">
        <!-- Topbar -->
        <header class="lb-topbar">
            <a href="home.html" class="brand-section">
                <div class="brand-logo-badge">
                    <i class="fas fa-trophy"></i>
                </div>
                <div>
                    <h1 style="font-size: 16px; font-weight: 900; margin: 0; font-family: 'Alexandria', 'Cairo', sans-serif;">لوحة الشرف</h1>
                    <span style="font-size: 11.5px; color: #94A3B8; font-weight: 600;">متصدرو منصة الخطة 2027</span>
                </div>
            </a>
            <div class="topbar-actions">
                <a href="home.html" class="btn-nav-icon" title="الرئيسية">
                    <i class="fas fa-home"></i>
                </a>
                <button type="button" class="btn-nav-icon" id="openDrawer" title="القائمة">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
        </header>

        <!-- Hero Banner -->
        <section class="lb-hero-banner">
            <h2>لوحة المتصدرين والمتميزين 🏆</h2>
            <p>ترتيب أوائل الطلاب بناءً على مجموع النقاط وحل الامتحانات والمواظبة اليومية.</p>
        </section>

        <!-- Loading State -->
        <div id="loadingState" class="loading-state-box">
            <i class="fas fa-spinner fa-spin" style="font-size: 28px; color: #3B82F6; margin-bottom: 12px; display: block;"></i>
            <span>جاري سحب الترتيب الحقيقي للطلاب...</span>
        </div>

        <!-- Top 3 Podium -->
        <div id="podiumContainer" class="podium-section-wrap" style="display: none;">
            <!-- Injected via JS -->
        </div>

        <!-- Ranks 4 to 50 -->
        <div id="rankList" class="ranks-list-container" style="display: none;">
            <!-- Injected via JS -->
        </div>

    </div>

    <!-- Mobile Bottom Nav -->
    <nav class="mobile-bottom-nav">
        <a href="home.html" class="bottom-nav-item">
            <i class="fas fa-home"></i>
            <span>الرئيسية</span>
        </a>
        <a href="courses.html" class="bottom-nav-item">
            <i class="fas fa-book-open"></i>
            <span>المواد</span>
        </a>
        <a href="ai-report.html" class="bottom-nav-item">
            <i class="fas fa-brain"></i>
            <span>التقرير</span>
        </a>
        <a href="profile.html" class="bottom-nav-item">
            <i class="fas fa-user-circle"></i>
            <span>حسابي</span>
        </a>
    </nav>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = "index.html";

        const avatars = ['🧑‍🎓', '👨‍💻', '👩‍💻', '🦸‍♂️', '🦸‍♀️', '🧙‍♂️', '🥷', '🕵️', '🧑‍🚀'];

        function getAvatar(name) {
            if (!name) return '🧑‍🎓';
            return avatars[name.length % avatars.length];
        }

        database.ref('Leaderboard').orderByChild('score').once('value').then(snap => {
            document.getElementById('loadingState').style.display = 'none';
            
            if (!snap.exists()) {
                document.getElementById('loadingState').style.display = 'block';
                document.getElementById('loadingState').textContent = 'لا يوجد طلاب مسجلين في لوحة الشرف حتى الآن!';
                return;
            }

            let students = [];
            snap.forEach(child => {
                students.push(child.val());
            });
            students.sort((a, b) => b.score - a.score);

            const top3 = students.slice(0, 3);
            const others = students.slice(3, 50);

            const podiumContainer = document.getElementById('podiumContainer');
            const rankList = document.getElementById('rankList');

            if (top3.length > 0) {
                podiumContainer.style.display = 'flex';
                let podiumHtml = '';

                // Second Place (Silver)
                if (top3[1]) {
                    podiumHtml += `
                        <div class="podium-col rank-2">
                            <div class="podium-avatar-circle">${getAvatar(top3[1].fullName)}</div>
                            <div class="podium-stand-box">
                                <div class="podium-student-name">${top3[1].fullName.split(' ')[0]}</div>
                                <div class="podium-score-badge">${top3[1].score} نقطة</div>
                                <div class="podium-rank-num">2</div>
                            </div>
                        </div>
                    `;
                }

                // First Place (Gold + Crown)
                if (top3[0]) {
                    podiumHtml += `
                        <div class="podium-col rank-1">
                            <span class="crown-icon-float">👑</span>
                            <div class="podium-avatar-circle">${getAvatar(top3[0].fullName)}</div>
                            <div class="podium-stand-box">
                                <div class="podium-student-name">${top3[0].fullName.split(' ')[0]}</div>
                                <div class="podium-score-badge">${top3[0].score} نقطة</div>
                                <div class="podium-rank-num">1</div>
                            </div>
                        </div>
                    `;
                }

                // Third Place (Bronze)
                if (top3[2]) {
                    podiumHtml += `
                        <div class="podium-col rank-3">
                            <div class="podium-avatar-circle">${getAvatar(top3[2].fullName)}</div>
                            <div class="podium-stand-box">
                                <div class="podium-student-name">${top3[2].fullName.split(' ')[0]}</div>
                                <div class="podium-score-badge">${top3[2].score} نقطة</div>
                                <div class="podium-rank-num">3</div>
                            </div>
                        </div>
                    `;
                }

                podiumContainer.innerHTML = podiumHtml;
            }

            if (others.length > 0) {
                rankList.style.display = 'flex';
                let listHtml = '';
                others.forEach((s, index) => {
                    const actualRank = index + 4;
                    const isMe = s.studentCode === user.studentCode;
                    const examsTaken = s.examsTaken || 0;

                    listHtml += `
                        <div class="rank-card-row ${isMe ? 'is-me' : ''}">
                            <div class="rank-left-group">
                                <div class="rank-number-pill">${actualRank}</div>
                                <div class="rank-avatar-box">${getAvatar(s.fullName)}</div>
                                <div class="rank-student-info">
                                    <div class="rank-student-name">${s.fullName} ${isMe ? '<span style="color:#60A5FA; font-size:12px;">(أنت)</span>' : ''}</div>
                                    <div class="rank-student-sub">أتم ${examsTaken} امتحانات واختبارات</div>
                                </div>
                            </div>
                            <div class="rank-score-chip">${s.score} نقطة</div>
                        </div>
                    `;
                });
                rankList.innerHTML = listHtml;
            }
        }).catch(err => {
            console.error(err);
            document.getElementById('loadingState').textContent = 'حدث خطأ أثناء تحميل لوحة الشرف!';
        });
    </script>
    <script src="student-drawer.js"></script>
    <script src="student-guard.js"></script>
</body>
</html>
