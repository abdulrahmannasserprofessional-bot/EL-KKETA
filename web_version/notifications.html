<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التنبيهات - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .notif-card { display: flex; align-items: flex-start; padding: 20px; }
        .notif-icon { width: 45px; height: 45px; background: #F4F7FF; border-radius: 12px; display: flex; justify-content: center; align-items: center; margin-left: 15px; color: var(--primary); font-size: 20px; }
        .notif-title { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .notif-msg { font-size: 14px; color: var(--text-sub); line-height: 1.5; }
        .notif-date { font-size: 11px; color: #BCBCBC; margin-top: 8px; }
    </style>
</head>
<body>
    <div class="header-gradient">
        <div class="back-btn" onclick="history.back()">⬅️</div>
        <div style="font-size: 22px; font-weight: bold;">مركز التنبيهات</div>
    </div>

    <div id="notificationsList" style="margin-top: -20px; padding-bottom: 20px;">
        <!-- Loaded from Firebase -->
        <div style="text-align: center; padding: 50px; color: #BCBCBC;">جاري تحميل التنبيهات...</div>
    </div>

    <div class="bottom-nav">
        <a href="home.html" class="nav-item">🏠<br>الرئيسية</a>
        <a href="courses.html" class="nav-item">📖<br>المواد</a>
        <a href="profile.html" class="nav-item">👤<br>حسابي</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script>
        // Firebase config
        const firebaseConfig = { /* CONFIG */ };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        function loadNotifications() {
            database.ref('Notifications').on('value', (snapshot) => {
                const list = document.getElementById('notificationsList');
                list.innerHTML = "";

                if (snapshot.exists()) {
                    let items = [];
                    snapshot.forEach(child => {
                        items.push(child.val());
                    });
                    items.reverse().forEach(notif => {
                        const date = new Date(notif.timestamp).toLocaleString('ar-EG');
                        const card = document.createElement('div');
                        card.className = "card notif-card";
                        card.innerHTML = `
                            <div class="notif-icon">🔔</div>
                            <div style="flex: 1; text-align: right;">
                                <div class="notif-title">تنبيه من المنصة</div>
                                <div class="notif-msg">${notif.message}</div>
                                <div class="notif-date">${date}</div>
                            </div>
                        `;
                        list.appendChild(card);
                    });
                } else {
                    list.innerHTML = `<div style="text-align:center; padding:50px; color:#BCBCBC;">لا توجد تنبيهات حالياً</div>`;
                }
            });
        }

        loadNotifications();
    </script>
</body>
</html>
