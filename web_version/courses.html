<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواد - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .subjects-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; margin-top: -30px; }
        .sub-card { background: white; border-radius: 25px; padding: 20px; text-align: center; position: relative; overflow: hidden; border: 1px solid #F0F2F9; }
        .color-tag { position: absolute; top: 0; right: 0; width: 6px; height: 40px; }
        .sub-icon { width: 50px; height: 50px; background: #F4F7FF; border-radius: 15px; margin: 0 auto 15px; display: flex; justify-content: center; align-items: center; font-size: 24px; }
        .sub-name { font-weight: bold; font-size: 16px; display: block; margin-bottom: 5px; }
        .sub-desc { font-size: 11px; color: var(--text-sub); }
    </style>
</head>
<body>
    <div class="header-gradient">
        <div style="font-size: 22px; font-weight: bold;">المواد الدراسية</div>
    </div>

    <div class="subjects-grid" id="subjectsList">
        <!-- Demo subjects -->
        <div class="sub-card" onclick="location.href='quiz.html'">
            <div class="color-tag" style="background: #0984E3;"></div>
            <div class="sub-icon">⚛️</div>
            <span class="sub-name">فيزياء</span>
            <span class="sub-desc">استكشاف المحاضرات</span>
        </div>
        <div class="sub-card">
            <div class="color-tag" style="background: #27AE60;"></div>
            <div class="sub-icon">🧪</div>
            <span class="sub-name">كيمياء</span>
            <span class="sub-desc">استكشاف المحاضرات</span>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="home.html" class="nav-item">🏠<br>الرئيسية</a>
        <a href="courses.html" class="nav-item active">📖<br>المواد</a>
        <a href="profile.html" class="nav-item">👤<br>حسابي</a>
    </div>
</body>
</html>
