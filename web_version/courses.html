<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icons/icon.svg">
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المواد الدراسية - ELKHETA</title>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(r => r.forEach(reg => reg.unregister()));
        }
        if (window.caches) {
            caches.keys().then(keys => keys.forEach(k => caches.delete(k)));
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1D4ED8;
            --accent: #6366F1;
            --bg-body: #F1F5F9;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #E2E8F0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 90px;
            direction: rtl;
        }

        .courses-app-container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Topbar */
        .courses-topbar {
            background: #FFFFFF;
            border-radius: 20px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
            border: 1px solid var(--border-color);
            position: sticky;
            top: 12px;
            z-index: 100;
        }

        .brand-section {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            color: var(--text-main);
        }

        .brand-logo-badge {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, #1E3A8A 0%, #3B82F6 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-nav-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: #F8FAFC;
            border: 1px solid var(--border-color);
            color: #475569;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-decoration: none;
        }
        .btn-nav-icon:hover {
            background: #EEF2FF;
            color: var(--primary);
            border-color: #C7D2FE;
        }

        /* Hero Banner Card */
        .courses-hero-card {
            background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 50%, #4F46E5 100%);
            border-radius: 24px;
            padding: 26px 24px;
            color: white;
            position: relative;
            overflow: hidden;
            box-shadow: 0 12px 30px rgba(37, 99, 235, 0.25);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }
        .courses-hero-card::after {
            content: '';
            position: absolute;
            width: 250px;
            height: 250px;
            background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 70%);
            bottom: -80px;
            left: -30px;
            border-radius: 50%;
            pointer-events: none;
        }
        .hero-info-area {
            position: relative;
            z-index: 2;
        }
        .hero-pill-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
            padding: 5px 12px;
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.25);
            margin-bottom: 8px;
        }
        .hero-title {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 4px;
        }
        .hero-sub {
            font-size: 13px;
            opacity: 0.9;
            max-width: 550px;
            line-height: 1.5;
        }

        /* Search Section */
        .search-container-box {
            position: relative;
            width: 100%;
        }
        .search-input-field {
            width: 100%;
            padding: 14px 20px 14px 45px;
            background: #FFFFFF;
            border: 1.5px solid var(--border-color);
            border-radius: 16px;
            font-family: inherit;
            font-size: 14px;
            color: var(--text-main);
            outline: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            transition: all 0.25s;
        }
        .search-input-field:focus {
            border-color: var(--primary);
            box-shadow: 0 4px 20px rgba(37, 99, 235, 0.12);
        }
        .search-icon-inside {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
            color: #94A3B8;
            pointer-events: none;
        }

        /* Subjects Grid */
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        @media (max-width: 640px) {
            .subjects-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Subject Card */
        .subject-card {
            background: #FFFFFF;
            border: 1.5px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.02);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 12px;
        }
        .subject-card:hover {
            transform: translateY(-4px);
            border-color: var(--primary);
            box-shadow: 0 12px 28px rgba(37, 99, 235, 0.12);
        }
        .subject-card:active {
            transform: scale(0.98);
        }

        .subject-color-strip {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
        }

        .subject-card-header {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .subject-icon-box {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            background: #EEF2FF;
            flex-shrink: 0;
            transition: transform 0.25s;
        }
        .subject-card:hover .subject-icon-box {
            transform: scale(1.08) rotate(4deg);
        }

        .subject-text-info {
            flex: 1;
            min-width: 0;
        }

        .subject-name {
            font-size: 17px;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 3px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .subject-lectures-count {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* Progress box */
        .subject-progress-box {
            width: 100%;
            background: #F8FAFC;
            border: 1px solid #EEF2FF;
            border-radius: 14px;
            padding: 10px 12px;
            text-align: right;
            transition: all 0.2s;
        }
        .progress-header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 11.5px;
            font-weight: 800;
            color: #475569;
            margin-bottom: 6px;
        }
        .progress-pct-badge {
            color: #2563EB;
            font-weight: 900;
            font-size: 12px;
        }
        .progress-track {
            width: 100%;
            height: 7px;
            background: #E2E8F0;
            border-radius: 10px;
            overflow: hidden;
            position: relative;
        }
        .progress-fill {
            height: 100%;
            border-radius: 10px;
            background: linear-gradient(90deg, #2563EB 0%, #06B6D4 100%);
            transition: width 0.8s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .progress-subtext {
            font-size: 11px;
            color: #64748B;
            font-weight: 700;
            margin-top: 6px;
            line-height: 1.3;
        }

        .subject-card-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding-top: 6px;
            border-top: 1px dashed var(--border-color);
            margin-top: 2px;
        }

        .explore-btn-hint {
            font-size: 12px;
            font-weight: 800;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #94A3B8;
            background: #FFFFFF;
            border-radius: 20px;
            border: 1px dashed var(--border-color);
        }
        .empty-state div { font-size: 44px; margin-bottom: 10px; }
        .empty-state p { font-size: 15px; font-weight: 700; }

        /* Bottom Nav for Mobile */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 65px;
            background: white;
            display: flex;
            justify-content: space-around;
            align-items: center;
            border-top: 1px solid #EEF2FF;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.03);
            z-index: 1000;
        }
        .nav-item {
            text-decoration: none;
            color: #A3AED0;
            font-size: 11px;
            font-weight: 700;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: all 0.2s;
        }
        .nav-item.active { color: #2563EB; font-weight: 800; }
        .nav-item i { font-size: 18px; }

        @media (min-width: 992px) {
            .bottom-nav { display: none; }
            body { padding-bottom: 40px; }
        }
    </style>
</head>
<body>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script>
        const ICONS_MAP = {
            'فيزياء': '⚛️', 'كيمياء': '🧪', 'أحياء': '🧬', 'رياضيات': '📐',
            'لغة عربية': '📖', 'عربي': '📖', 'لغة إنجليزية': '🔤', 'إنجليزي': '🔤',
            'تاريخ': '🏛️', 'جغرافيا': '🌍', 'فلسفة': '💭', 'علم نفس': '🧠',
            'جيولوجيا': '🌋', 'فرنساوي': '🗼', 'لغة فرنسية': '🗼', 'ألماني': '🥨',
            'إيطالي': '🍕', 'حاسب آلي': '💻', 'كمبيوتر': '💻', 'تربية وطنية': '🇪🇬'
        };

        const GRADIENTS = [
            'linear-gradient(90deg, #4F46E5, #818CF8)',
            'linear-gradient(90deg, #059669, #34D399)',
            'linear-gradient(90deg, #D97706, #FBBF24)',
            'linear-gradient(90deg, #DC2626, #F87171)',
            'linear-gradient(90deg, #7C3AED, #A78BFA)',
            'linear-gradient(90deg, #0891B2, #22D3EE)',
            'linear-gradient(90deg, #BE185D, #F472B6)'
        ];

        let allSubjects = [];
        let lectureCounts = {};

        // Fast Instant Cache Load (0ms UI lag)
        const cachedSubjects = sessionStorage.getItem('elkheta_cached_subjects');
        if (cachedSubjects) {
            try {
                allSubjects = JSON.parse(cachedSubjects);
                if (allSubjects.length > 0) renderSubjects(allSubjects);
            } catch(e) {}
        }

        function normalizeArabic(str) {
            return (str || '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim();
        }

        let isInitialLoad = true;

        // Real-Time Live Sync (Zero-refresh updates!)
        function initRealtimeSubjects() {
            database.ref('Subjects').on('value', snap => {
                const rawSubjects = [];
                const normMap = {};

                if (snap.exists()) {
                    snap.forEach(child => {
                        const sub = child.val();
                        if (sub && sub.name) {
                            const n = normalizeArabic(sub.name);
                            normMap[n] = sub.name;
                            rawSubjects.push({ id: child.key, name: sub.name, norm: n });
                        }
                    });
                }

                database.ref('Lectures').on('value', lecSnap => {
                    lectureCounts = {};
                    const finalSubjects = [...rawSubjects];
                    const existingNorms = new Set(rawSubjects.map(s => s.norm));

                    if (lecSnap.exists()) {
                        lecSnap.forEach(subSnap => {
                            const subKey = subSnap.key;
                            const n = normalizeArabic(subKey);
                            const count = subSnap.numChildren();
                            
                            // Map count to both key and original subject name
                            lectureCounts[subKey] = count;
                            if (normMap[n]) lectureCounts[normMap[n]] = count;

                            if (!existingNorms.has(n)) {
                                existingNorms.add(n);
                                finalSubjects.push({ id: subKey, name: subKey, norm: n });
                            }
                        });
                    }

                    allSubjects = finalSubjects;
                    sessionStorage.setItem('elkheta_cached_subjects', JSON.stringify(allSubjects));
                    renderSubjects(allSubjects);

                    if (!isInitialLoad && typeof showToast === 'function') {
                        // Handled specifically by detailed broadcast banner
                    }
                    isInitialLoad = false;
                });
            });
        }

        initRealtimeSubjects();

        function renderSubjects(subjects) {
            const container = document.getElementById('subjectsContainer');
            container.innerHTML = "";

            if (subjects.length === 0) {
                container.innerHTML = `
                    <div class="empty-state" style="grid-column: 1 / -1;">
                        <div>📚</div>
                        <p>لا توجد مواد دراسية مضافة حالياً.</p>
                    </div>
                `;
                return;
            }

            const studentCode = (user && (user.studentCode || user.code || user.student_code)) || localStorage.getItem('studentCode') || 'GUEST';

            subjects.forEach((sub, idx) => {
                const count = lectureCounts[sub.name] || 0;
                const icon = ICONS_MAP[sub.name] || '📚';
                const grad = GRADIENTS[idx % GRADIENTS.length];

                // Calculate real completed lessons count
                let completedLessons = {};
                try {
                    completedLessons = JSON.parse(localStorage.getItem(`completed_${studentCode}_${sub.name}`)) || {};
                } catch(e){}
                const completedCount = Object.keys(completedLessons).length;
                const pct = count > 0 ? Math.min(100, Math.round((completedCount / count) * 100)) : 0;
                const remaining = Math.max(0, count - completedCount);

                let progressHTML = '';
                if (count > 0) {
                    if (pct >= 100) {
                        progressHTML = `
                            <div class="subject-progress-box" style="background:#ECFDF5; border-color:#A7F3D0;">
                                <div class="progress-header-row" style="color:#065F46;">
                                    <span>نسبة الإنجاز</span>
                                    <span class="progress-pct-badge" style="color:#059669;">100% ✨</span>
                                </div>
                                <div class="progress-track" style="background:#D1FAE5;">
                                    <div class="progress-fill" style="width: 100%; background: linear-gradient(90deg, #10B981, #059669);"></div>
                                </div>
                                <div class="progress-subtext" style="color:#047857;">🎉 أنجزت كافة دروس المادة!</div>
                            </div>
                        `;
                    } else if (pct > 0) {
                        progressHTML = `
                            <div class="subject-progress-box">
                                <div class="progress-header-row">
                                    <span>نسبة الإنجاز</span>
                                    <span class="progress-pct-badge">${pct}%</span>
                                </div>
                                <div class="progress-track">
                                    <div class="progress-fill" style="width: ${pct}%;"></div>
                                </div>
                                <div class="progress-subtext">أنجزت ${completedCount} من ${count} • متبقي ${remaining} دروس 🎯</div>
                            </div>
                        `;
                    } else {
                        progressHTML = `
                            <div class="subject-progress-box">
                                <div class="progress-header-row">
                                    <span>نسبة الإنجاز</span>
                                    <span class="progress-pct-badge" style="color:#94A3B8;">0%</span>
                                </div>
                                <div class="progress-track">
                                    <div class="progress-fill" style="width: 0%;"></div>
                                </div>
                                <div class="progress-subtext">ابدأ المذاكرة 🚀 • متبقي ${count} دروس</div>
                            </div>
                        `;
                    }
                } else {
                    progressHTML = `
                        <div class="subject-badge">جاري رفع الدروس ⏳</div>
                    `;
                }

                const card = document.createElement('div');
                card.className = "subject-card";
                card.onclick = () => {
                    if (user && user.studentCode) {
                        try {
                            database.ref('ActivityLogs').push().set({
                                studentCode: user.studentCode,
                                studentName: user.fullName || user.name || 'طالب',
                                action: 'تصفح مادة دراسية 📚',
                                details: `دخل على محاضرات ومنهج مادة: (${sub.name})`,
                                userAgent: navigator.userAgent || '',
                                timestamp: firebase.database.ServerValue.TIMESTAMP
                            });
                        } catch(e){}
                    }
                    localStorage.setItem('last_accessed_subject', sub.name);
                    location.href = `lectures.html?subject=${encodeURIComponent(sub.name)}`;
                };

                card.innerHTML = `
                    <div class="subject-color-strip" style="background: ${grad};"></div>
                    <div class="subject-card-header">
                        <div class="subject-icon-box">${icon}</div>
                        <div class="subject-text-info">
                            <div class="subject-name" title="${sub.name}">${sub.name}</div>
                            <div class="subject-lectures-count">
                                <i class="fa-solid fa-play-circle" style="color:var(--primary);"></i>
                                ${count > 0 ? `${count} محاضرات ودروس` : 'جاري إضافة الدروس'}
                            </div>
                        </div>
                    </div>
                    ${progressHTML}
                    <div class="subject-card-footer">
                        <span class="explore-btn-hint">استكشف المادة <i class="fa-solid fa-arrow-left"></i></span>
                        <span style="font-size: 11px; color: #94A3B8; font-weight: 700;">منهج 2026</span>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterSubjects() {
            const q = (document.getElementById('searchSubjectInput').value || '').trim().toLowerCase();
            if (!q) {
                renderSubjects(allSubjects);
                return;
            }
            const filtered = allSubjects.filter(s => s.name.toLowerCase().includes(q));
            renderSubjects(filtered);
        }
    </script>
