<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>نتائج ودرجات الطلاب - ELKHETA PRO 2027</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        :root {
            --primary: #2563EB;
            --primary-dark: #1E3A8A;
            --accent: #38BDF8;
            --gold: #F59E0B;
            --bg-body: #F8FAFC;
            --surface: #FFFFFF;
            --border-color: #E2E8F0;
            --text-main: #0F172A;
            --text-sub: #64748B;
            --card-shadow: 0 10px 30px -5px rgba(0, 0, 0, 0.05), 0 4px 6px -2px rgba(0, 0, 0, 0.02);
            --exec-gradient: linear-gradient(135deg, #090D16 0%, #0F172A 40%, #1E3A8A 85%, #2563EB 100%);
        }

        [data-theme="dark"] {
            --bg-body: #070B14;
            --surface: #0F172A;
            --border-color: #1E293B;
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
            --card-shadow: 0 14px 35px -8px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: 'Cairo', sans-serif;
            background: var(--bg-body);
            color: var(--text-main);
            min-height: 100vh;
            padding-bottom: 60px;
            overflow-x: hidden;
            transition: background 0.3s ease, color 0.3s ease;
        }

        .ambient-glow {
            position: fixed;
            top: 0; right: 0; width: 450px; height: 450px;
            background: radial-gradient(circle, rgba(37, 99, 235, 0.12) 0%, transparent 70%);
            z-index: 0; pointer-events: none; filter: blur(50px);
        }

        .exec-header {
            background: var(--exec-gradient);
            padding: 30px 20px 75px;
            position: relative;
            overflow: hidden;
            border-bottom-left-radius: 36px;
            border-bottom-right-radius: 36px;
            box-shadow: 0 15px 40px rgba(15, 23, 42, 0.25);
            z-index: 2;
        }

        .exec-header::after {
            content: '';
            position: absolute;
            bottom: -60px; left: -40px;
            width: 240px; height: 240px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, transparent 70%);
            border-radius: 50%;
            pointer-events: none;
        }

        .header-container {
            max-width: 1060px;
            margin: 0 auto;
            position: relative;
            z-index: 3;
        }

        .header-top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 24px;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            color: #FFFFFF;
            padding: 8px 16px;
            border-radius: 14px;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            backdrop-filter: blur(8px);
            transition: 0.2s;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.22); transform: translateX(4px); }

        .theme-toggle-btn {
            width: 40px; height: 40px;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.22);
            border-radius: 12px;
            color: #FFFFFF;
            font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            transition: 0.2s;
        }

        .header-title-box { color: #FFFFFF; }
        .badge-academic {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(245, 158, 11, 0.2);
            border: 1px solid rgba(245, 158, 11, 0.4);
            color: #FDE68A;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .header-title {
            font-size: 26px;
            font-weight: 900;
            line-height: 1.2;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .header-subtitle { font-size: 13px; color: #94A3B8; margin-top: 6px; font-weight: 600; }

        .main-content {
            max-width: 1060px;
            margin: -45px auto 0;
            padding: 0 16px;
            position: relative;
            z-index: 5;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }
        @media (max-width: 768px) {
            .kpi-grid { grid-template-columns: repeat(2, 1fr); }
        }

        .kpi-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 16px 18px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .kpi-info h4 { font-size: 11px; font-weight: 700; color: var(--text-sub); }
        .kpi-info .kpi-num { font-size: 22px; font-weight: 900; color: var(--text-main); margin-top: 4px; line-height: 1; }
        .kpi-icon {
            width: 42px; height: 42px;
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 18px;
        }
        .kpi-card.blue .kpi-icon { background: rgba(37, 99, 235, 0.1); color: #2563EB; }
        .kpi-card.green .kpi-icon { background: rgba(16, 185, 129, 0.1); color: #10B981; }
        .kpi-card.amber .kpi-icon { background: rgba(245, 158, 11, 0.1); color: #F59E0B; }
        .kpi-card.purple .kpi-icon { background: rgba(139, 92, 246, 0.1); color: #8B5CF6; }

        .filter-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 20px;
            box-shadow: var(--card-shadow);
            margin-bottom: 20px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 768px) {
            .filter-grid { grid-template-columns: 1fr; }
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            background: var(--bg-body);
            border: 1.5px solid var(--border-color);
            border-radius: 14px;
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            font-size: 13px;
            font-weight: 700;
            outline: none;
            transition: 0.2s;
        }
        .form-control:focus { border-color: var(--primary); background: var(--surface); }

        .results-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .result-card {
            background: var(--surface);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 18px 20px;
            box-shadow: var(--card-shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            transition: 0.2s;
        }
        .result-card:hover { transform: translateY(-2px); border-color: var(--primary); }
        @media (max-width: 640px) {
            .result-card { flex-direction: column; align-items: stretch; }
        }

        .score-gauge-box {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .score-circle {
            width: 54px; height: 54px; min-width: 54px;
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 900;
            color: #FFFFFF;
        }
        .score-circle.high { background: linear-gradient(135deg, #10B981, #059669); box-shadow: 0 4px 14px rgba(16, 185, 129, 0.3); }
        .score-circle.mid { background: linear-gradient(135deg, #F59E0B, #D97706); box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3); }
        .score-circle.low { background: linear-gradient(135deg, #EF4444, #DC2626); box-shadow: 0 4px 14px rgba(239, 68, 68, 0.3); }

        .result-details h4 { font-size: 15px; font-weight: 800; color: var(--text-main); }
        .result-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
            font-size: 12px;
            color: var(--text-sub);
        }

        .action-btns {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        @media (max-width: 640px) {
            .action-btns { justify-content: flex-end; border-top: 1px dashed var(--border-color); padding-top: 10px; }
        }

        .btn-action {
            padding: 8px 14px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 800;
            border: 1px solid var(--border-color);
            background: var(--bg-body);
            color: var(--text-main);
            cursor: pointer;
            font-family: inherit;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-action:hover { background: var(--surface); border-color: var(--primary); color: var(--primary); }
        .btn-action.danger { color: #DC2626; border-color: #FECACA; background: #FEF2F2; }
        .btn-action.danger:hover { background: #FEE2E2; }
    </style>
</head>
<body>
    <script>
        if (sessionStorage.getItem('isAdmin') !== 'true') {
            if (localStorage.getItem('isAdmin') === 'true') {
                sessionStorage.setItem('isAdmin', 'true');
            } else {
                window.location.href = "admin-gate.html";
            }
        }
        const savedTheme = localStorage.getItem('admin_theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>

    <div class="ambient-glow"></div>

    <header class="exec-header">
        <div class="header-container">
            <div class="header-top">
                <a href="admin-panel.html" class="back-btn">
                    <i class="fa-solid fa-arrow-right"></i>
                    <span>لوحة الإدارة</span>
                </a>
                <button class="theme-toggle-btn" onclick="toggleTheme()" title="تبديل المظهر">
                    <i class="fa-solid fa-moon" id="themeIcon"></i>
                </button>
            </div>

            <div class="header-title-box">
                <div class="badge-academic">
                    <i class="fa-solid fa-graduation-cap"></i>
                    <span>سجلات الاختبارات • دفعة 2027</span>
                </div>
                <h1 class="header-title">
                    <i class="fa-solid fa-square-poll-vertical" style="color:#38BDF8;"></i>
                    <span>نتائج ودرجات الطلاب</span>
                </h1>
                <p class="header-subtitle">متابعة دقيقة لدرجات الاختبارات الإلكترونية والتقييمات الدورية</p>
            </div>
        </div>
    </header>

    <main class="main-content">
        <div class="kpi-grid">
            <div class="kpi-card blue">
                <div class="kpi-info">
                    <h4>إجمالي الاختبارات</h4>
                    <div class="kpi-num" id="totalSubmissions">0</div>
                </div>
                <div class="kpi-icon"><i class="fa-solid fa-list-check"></i></div>
            </div>
            <div class="kpi-card green">
                <div class="kpi-info">
                    <h4>متوسط الدرجات</h4>
                    <div class="kpi-num" id="avgCohortScore">0%</div>
                </div>
                <div class="kpi-icon"><i class="fa-solid fa-chart-line"></i></div>
            </div>
            <div class="kpi-card amber">
                <div class="kpi-info">
                    <h4>أعلى درجة مسجلة</h4>
                    <div class="kpi-num" id="highestScore">100%</div>
                </div>
                <div class="kpi-icon"><i class="fa-solid fa-trophy"></i></div>
            </div>
            <div class="kpi-card purple">
                <div class="kpi-info">
                    <h4>نسبة النجاح العامة</h4>
                    <div class="kpi-num" id="passRate">0%</div>
                </div>
                <div class="kpi-icon"><i class="fa-solid fa-award"></i></div>
            </div>
        </div>

        <div class="filter-card">
            <div class="filter-grid">
                <input type="text" class="form-control" id="searchResultInput" placeholder="🔍 ابحث باسم الطالب، كود الطالب، أو اسم الامتحان..." oninput="filterResults()">
                <select class="form-control" id="subjectFilter" onchange="filterResults()">
                    <option value="all">جميع المواد الدراسية</option>
                </select>
                <select class="form-control" id="scoreTierFilter" onchange="filterResults()">
                    <option value="all">كافة مستويات الدرجات</option>
                    <option value="high">المتفوقين (85% فأعلى)</option>
                    <option value="mid">المتوسطين (65% - 84%)</option>
                    <option value="low">يحتاجون متابعة (أقل من 65%)</option>
                </select>
            </div>
        </div>

        <div class="results-list" id="resultsListContainer">
            <div style="text-align: center; padding: 40px; color: var(--text-sub); background: var(--surface); border-radius: 20px; border: 1px solid var(--border-color);">
                <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 32px; color: var(--primary); margin-bottom: 12px;"></i>
                <p style="font-weight: 700;">جاري استخراج وتحليل نتائج الطلاب...</p>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', next);
            localStorage.setItem('admin_theme', next);
            updateThemeIcon(next);
        }
        function updateThemeIcon(t) {
            const icon = document.getElementById('themeIcon');
            if (icon) icon.className = t === 'dark' ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
        }
        updateThemeIcon(savedTheme);

        let allResults = [];
        let studentsMap = {};

        // Load subjects
        database.ref('Subjects').once('value', snap => {
            const select = document.getElementById('subjectFilter');
            if (snap.exists()) {
                snap.forEach(sub => {
                    const opt = document.createElement('option');
                    opt.value = sub.key;
                    opt.textContent = sub.val().name || sub.key;
                    select.appendChild(opt);
                });
            }
        });

        // Load Students & Exam results
        database.ref('Students').on('value', snapStudents => {
            studentsMap = {};
            allResults = [];

            if (snapStudents.exists()) {
                snapStudents.forEach(child => {
                    const st = child.val() || {};
                    studentsMap[child.key] = st;
                    
                    if (st.exams) {
                        Object.keys(st.exams).forEach(examId => {
                            const ex = st.exams[examId];
                            allResults.push({
                                studentCode: child.key,
                                studentName: st.fullName || st.name || 'طالب مسجل',
                                studentPhone: st.whatsapp || st.phone || '',
                                examId: examId,
                                examTitle: ex.title || ex.examName || examId,
                                subjectId: ex.subjectId || '',
                                score: ex.score || 0,
                                totalQuestions: ex.total || ex.totalQuestions || 10,
                                percentage: (typeof ex.percentage === 'number') ? ex.percentage : Math.round((ex.score / (ex.total || 10)) * 100),
                                submittedAt: ex.submittedAt || ex.timestamp || Date.now()
                            });
                        });
                    }
                });
            }

            // Calculate KPIs
            const totalCount = allResults.length;
            document.getElementById('totalSubmissions').textContent = totalCount;
            if (totalCount > 0) {
                const totalPercent = allResults.reduce((acc, r) => acc + r.percentage, 0);
                const avg = Math.round(totalPercent / totalCount);
                const passedCount = allResults.filter(r => r.percentage >= 60).length;
                document.getElementById('avgCohortScore').textContent = avg + '%';
                document.getElementById('passRate').textContent = Math.round((passedCount / totalCount) * 100) + '%';
            }

            filterResults();
        });

        function filterResults() {
            const q = document.getElementById('searchResultInput').value.trim().toLowerCase();
            const subject = document.getElementById('subjectFilter').value;
            const tier = document.getElementById('scoreTierFilter').value;

            let filtered = allResults;
            if (subject !== 'all') filtered = filtered.filter(r => r.subjectId === subject);
            if (tier === 'high') filtered = filtered.filter(r => r.percentage >= 85);
            else if (tier === 'mid') filtered = filtered.filter(r => r.percentage >= 65 && r.percentage < 85);
            else if (tier === 'low') filtered = filtered.filter(r => r.percentage < 65);

            if (q) {
                filtered = filtered.filter(r =>
                    r.studentName.toLowerCase().includes(q) ||
                    r.studentCode.toLowerCase().includes(q) ||
                    r.examTitle.toLowerCase().includes(q)
                );
            }

            renderResults(filtered);
        }

        function renderResults(list) {
            const container = document.getElementById('resultsListContainer');
            container.innerHTML = "";

            if (!list || list.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 50px; background: var(--surface); border-radius: 20px; border: 1px dashed var(--border-color); color: var(--text-sub);">
                        <i class="fa-solid fa-clipboard-question" style="font-size: 40px; opacity: 0.4; margin-bottom: 10px;"></i>
                        <p style="font-weight: 800;">لا توجد نتائج اختبارات مطابقة</p>
                    </div>
                `;
                return;
            }

            // Sort newest first
            const sorted = [...list].sort((a, b) => b.submittedAt - a.submittedAt);

            sorted.forEach(res => {
                let tierClass = 'high';
                if (res.percentage < 65) tierClass = 'low';
                else if (res.percentage < 85) tierClass = 'mid';

                const card = document.createElement('div');
                card.className = "result-card";
                card.innerHTML = `
                    <div class="score-gauge-box">
                        <div class="score-circle ${tierClass}">${res.percentage}%</div>
                        <div class="result-details">
                            <h4>${res.studentName}</h4>
                            <div class="result-meta">
                                <span><i class="fa-regular fa-file-lines" style="color:var(--primary);"></i> ${res.examTitle}</span>
                                <span>•</span>
                                <span style="font-family:monospace; font-weight:800; color:#C2410C;">${res.studentCode}</span>
                                <span>•</span>
                                <span>📅 ${new Date(res.submittedAt).toLocaleDateString('ar-EG')}</span>
                            </div>
                        </div>
                    </div>

                    <div class="action-btns">
                        <button class="btn-action" onclick="sendWhatsAppReport('${res.studentPhone}', '${res.studentName}', '${res.examTitle}', ${res.percentage})">
                            <i class="fa-brands fa-whatsapp" style="color:#10B981;"></i>
                            <span>إرسال النتيجة</span>
                        </button>
                        <button class="btn-action danger" onclick="resetStudentExamAttempt('${res.studentCode}', '${res.examId}', '${res.studentName}')">
                            <i class="fa-solid fa-arrow-rotate-left"></i>
                            <span>إعادة المحاولة</span>
                        </button>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function sendWhatsAppReport(phone, name, examTitle, score) {
            const cleanPhone = (phone || '').replace(/[^0-9]/g, '');
            const waNumber = cleanPhone.startsWith('01') ? '2' + cleanPhone : cleanPhone;
            const waMsg = encodeURIComponent(`مرحباً بك يا ${name} 🎓
تم رصد نتيجتك في اختبار (${examTitle}): ${score}%
منصة الخطة - دفعة 2027`);
            window.open(`https://wa.me/${waNumber}?text=${waMsg}`, '_blank');
        }

        function resetStudentExamAttempt(code, examId, name) {
            Swal.fire({
                title: 'إعادة محاولة الاختبار؟',
                text: `سيتم مسح النتيجة الحالية والسماح للطالب (${name}) بأداء الاختبار مرة أخرى.`,
                icon: 'question',
                showCancelButton: true,
                confirmButtonColor: '#2563EB',
                cancelButtonColor: '#64748B',
                confirmButtonText: 'نعم، إعادة المحاولة',
                cancelButtonText: 'إلغاء'
            }).then(async (result) => {
                if (result.isConfirmed) {
                    await database.ref('Students/' + code + '/exams/' + examId).remove();
                    Swal.fire('تمت الإعادة!', 'أصبح بإمكان الطالب الدخول للاختبار الآن مجدداً.', 'success');
                }
            });
        }
    </script>
</body>
</html>
