<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'>
  <defs>
    <linearGradient id='bgG' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#1E1B4B'/>
      <stop offset='60%' stop-color='#3730A3'/>
      <stop offset='100%' stop-color='#4C1D95'/>
    </linearGradient>
    <linearGradient id='capG' x1='0%' y1='0%' x2='100%' y2='100%'>
      <stop offset='0%' stop-color='#FFFFFF'/>
      <stop offset='100%' stop-color='#C4B5FD'/>
    </linearGradient>
    <filter id='glow' x='-20%' y='-20%' width='140%' height='140%'>
      <feGaussianBlur stdDeviation='8' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
    <filter id='softglow'>
      <feGaussianBlur stdDeviation='4' result='blur'/>
      <feMerge><feMergeNode in='blur'/><feMergeNode in='SourceGraphic'/></feMerge>
    </filter>
  </defs>
  <!-- خلفية مستديرة الأركان -->
  <rect width='512' height='512' rx='115' fill='url(#bgG)'/>
  <!-- توهج داخلي خفيف -->
  <ellipse cx='256' cy='220' rx='200' ry='160' fill='rgba(99,76,200,0.25)'/>
  <!-- قاعدة القبعة (القبة) -->
  <ellipse cx='256' cy='310' rx='130' ry='38' fill='url(#capG)' opacity='0.92' filter='url(#softglow)'/>
  <!-- لوح القبعة المسطح -->
  <polygon points='256,120 412,200 256,262 100,200' fill='url(#capG)' filter='url(#glow)'/>
  <!-- ساق القبعة -->
  <rect x='244' y='200' width='24' height='90' rx='12' fill='#C4B5FD' opacity='0.85'/>
  <!-- الشرابة - الخط -->
  <line x1='268' y1='228' x2='332' y2='218' stroke='#F59E0B' stroke-width='8' stroke-linecap='round' opacity='0.9'/>
  <!-- الشرابة - الكرة (توهج ذهبي) -->
  <circle cx='340' cy='215' r='22' fill='#F59E0B' filter='url(#glow)' opacity='0.9'/>
  <circle cx='340' cy='215' r='14' fill='#FCD34D'/>
  <circle cx='334' cy='209' r='4' fill='#FFFBEB' opacity='0.8'/>
</svg>
