<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>انقطع الاتصال بالإنترنت - منصة الخطة</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; }
        :root {
            --primary: #4F46E5;
            --primary-gradient: linear-gradient(135deg, #4318FF 0%, #868CFF 100%);
            --bg: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.85);
            --border: rgba(255, 255, 255, 0.1);
            --text-main: #F8FAFC;
            --text-sub: #94A3B8;
        }

        body {
            background: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px 16px 40px;
            position: relative;
            overflow-x: hidden;
        }

        /* Ambient Glow Background */
        .glow-1 {
            position: absolute; width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(79, 70, 229, 0.25) 0%, transparent 70%);
            top: -100px; right: -100px; border-radius: 50%; pointer-events: none;
            animation: pulseGlow 8s infinite alternate;
        }
        .glow-2 {
            position: absolute; width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(239, 68, 68, 0.18) 0%, transparent 70%);
            bottom: -100px; left: -100px; border-radius: 50%; pointer-events: none;
            animation: pulseGlow 8s infinite alternate-reverse;
        }
        @keyframes pulseGlow { from { transform: scale(1); opacity: 0.7; } to { transform: scale(1.2); opacity: 1; } }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 32px;
            padding: 40px 25px;
            max-width: 520px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 10;
            box-shadow: 0 25px 60px rgba(0,0,0,0.5);
        }

        /* Disconnected Icon Animation */
        .icon-container {
            width: 100px; height: 100px;
            background: linear-gradient(135deg, rgba(239, 68, 68, 0.2), rgba(245, 158, 11, 0.2));
            border: 2px solid rgba(239, 68, 68, 0.4);
            border-radius: 30px;
            display: flex; align-items: center; justify-content: center;
            font-size: 45px;
            margin: 0 auto 25px;
            position: relative;
            animation: floatIcon 3s ease-in-out infinite;
        }
        .icon-ping {
            position: absolute; top: -6px; right: -6px; width: 20px; height: 20px;
            background: #EF4444; border: 3px solid #0F172A; border-radius: 50%;
            animation: ping 1.5s cubic-bezier(0, 0, 0.2, 1) infinite;
        }
        @keyframes ping { 75%, 100% { transform: scale(2); opacity: 0; } }
        @keyframes floatIcon { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }

        h1 { font-size: 24px; font-weight: 900; color: #FFFFFF; margin-bottom: 8px; }
        p.subtitle { font-size: 14px; color: var(--text-sub); line-height: 1.7; margin-bottom: 30px; }

        /* Status Indicator */
        .status-pill {
            display: inline-flex; align-items: center; gap: 8px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
            padding: 8px 18px; border-radius: 20px;
            font-size: 13px; font-weight: 800; margin-bottom: 25px;
        }
        .status-dot { width: 10px; height: 10px; border-radius: 50%; background: #EF4444; }
        .status-dot.checking { background: #F59E0B; animation: pulseDot 1s infinite alternate; }
        .status-dot.online { background: #10B981; }
        @keyframes pulseDot { from { opacity: 0.4; } to { opacity: 1; } }

        /* Action Buttons */
        .actions-group { display: flex; flex-direction: column; gap: 12px; margin-bottom: 30px; }
        .btn-main {
            background: var(--primary-gradient);
            color: white; border: none; padding: 16px; border-radius: 18px;
            font-size: 16px; font-weight: 900; cursor: pointer;
            box-shadow: 0 10px 25px rgba(67, 24, 255, 0.35);
            display: flex; align-items: center; justify-content: center; gap: 10px;
            transition: all 0.2s;
        }
        .btn-main:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(67, 24, 255, 0.45); }
        .btn-main:active { transform: scale(0.98); }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #E2E8F0; border: 1px solid var(--border); padding: 14px;
            border-radius: 18px; font-size: 14px; font-weight: 800; cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 8px;
            transition: all 0.2s;
        }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.2); }

        /* Offline Exam Dropzone Section */
        .offline-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1.5px dashed rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px 16px;
            margin-bottom: 25px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .offline-box:hover { border-color: #6366F1; background: rgba(99, 102, 241, 0.05); }

        /* Mini Brain Game */
        .game-card {
            background: rgba(15, 23, 42, 0.7);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }
        .game-title { font-size: 14px; font-weight: 800; color: #F59E0B; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .game-q { font-size: 22px; font-weight: 900; color: white; margin-bottom: 15px; direction: ltr; }
        .game-options { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .game-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--border); color: white;
            padding: 12px; border-radius: 12px; font-size: 16px; font-weight: 800;
            cursor: pointer; transition: all 0.2s;
        }
        .game-btn:hover { background: #4F46E5; border-color: #4F46E5; }
        .game-btn.correct { background: #10B981 !important; border-color: #10B981 !important; }
        .game-btn.wrong { background: #EF4444 !important; border-color: #EF4444 !important; }
        .game-score { font-size: 12px; color: var(--text-sub); margin-top: 12px; font-weight: 800; }
    </style>
</head>
<body>

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="main-card">
        <div class="icon-container">
            📡
            <div class="icon-ping"></div>
        </div>

        <h1>انقطع الاتصال بالإنترنت</h1>
        <p class="subtitle">
            يبدو أن جهازك غير متصل بالشبكة حالياً.<br>
            لا تقلق، يمكنك متابعة حل الامتحانات المحملة مسبقاً بدون نت! 🚀
        </p>

        <div class="status-pill" id="statusPill">
            <div class="status-dot" id="statusDot"></div>
            <span id="statusText">أنت غير متصل بالإنترنت</span>
        </div>

        <div class="actions-group">
            <button class="btn-main" onclick="checkConnection()">
                <span>🔄</span> إعادة فحص الاتصال وتحديث الصفحة
            </button>
            <button class="btn-secondary" onclick="openOfflineFilePicker()">
                <span>📂</span> فتح امتحان محمل أوفلاين (ملف HTML)
            </button>
            <input type="file" id="offlineFilePicker" accept=".html,.htm" style="display:none;" onchange="handleOfflineFile(this)">
        </div>

        <!-- Mini Game to pass time -->
        <div class="game-card">
            <div class="game-title">⚡ تحدي تنشيط العقل السريع (حتى يعود النت):</div>
            <div class="game-q" id="gameQuestion">8 × 7 = ?</div>
            <div class="game-options" id="gameOptions"></div>
            <div class="game-score">نقاطك: <span id="gameScoreText" style="color:#10B981;">0</span> 🌟</div>
        </div>
    </div>

    <script>
        // Check internet connection
        function checkConnection() {
            const dot = document.getElementById('statusDot');
            const text = document.getElementById('statusText');
            dot.className = 'status-dot checking';
            text.textContent = 'جاري التحقق من الشبكة...';

            if (navigator.onLine) {
                fetch('https://www.google.com/favicon.ico', { mode: 'no-cors', cache: 'no-store' })
                    .then(() => {
                        dot.className = 'status-dot online';
                        text.textContent = 'تمت استعادة الاتصال! جاري التحويل...';
                        setTimeout(() => {
                            if (window.history.length > 1) {
                                window.history.back();
                            } else {
                                window.location.href = 'home.html';
                            }
                        }, 800);
                    })
                    .catch(() => {
                        dot.className = 'status-dot';
                        text.textContent = 'لا يوجد اتصال فعلي بالإنترنت';
                    });
            } else {
                setTimeout(() => {
                    dot.className = 'status-dot';
                    text.textContent = 'أنت غير متصل بالإنترنت';
                }, 500);
            }
        }

        window.addEventListener('online', () => {
            checkConnection();
        });

        // Offline File Opener
        function openOfflineFilePicker() {
            document.getElementById('offlineFilePicker').click();
        }

        function handleOfflineFile(input) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const blob = new Blob([e.target.result], { type: 'text/html;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    window.location.href = url;
                };
                reader.readAsText(file);
            }
        }

        // Mini Math Quiz Game
        let gameScore = 0;
        let currentAns = 0;

        function generateQuestion() {
            const ops = ['+', '-', '×'];
            const op = ops[Math.floor(Math.random() * ops.length)];
            let n1 = Math.floor(Math.random() * 12) + 2;
            let n2 = Math.floor(Math.random() * 12) + 2;
            
            if (op === '+') {
                currentAns = n1 + n2;
            } else if (op === '-') {
                if (n1 < n2) { const t = n1; n1 = n2; n2 = t; }
                currentAns = n1 - n2;
            } else {
                n1 = Math.floor(Math.random() * 10) + 2;
                n2 = Math.floor(Math.random() * 10) + 2;
                currentAns = n1 * n2;
            }

            document.getElementById('gameQuestion').textContent = `${n1} ${op} ${n2} = ?`;

            const choices = [currentAns];
            while (choices.length < 4) {
                const fake = currentAns + (Math.random() > 0.5 ? 1 : -1) * (Math.floor(Math.random() * 5) + 1);
                if (fake >= 0 && !choices.includes(fake)) choices.push(fake);
            }

            choices.sort(() => 0.5 - Math.random());

            const optContainer = document.getElementById('gameOptions');
            optContainer.innerHTML = '';
            choices.forEach(val => {
                const b = document.createElement('button');
                b.className = 'game-btn';
                b.textContent = val;
                b.onclick = function() {
                    if (val === currentAns) {
                        b.classList.add('correct');
                        gameScore++;
                        document.getElementById('gameScoreText').textContent = gameScore;
                        setTimeout(generateQuestion, 400);
                    } else {
                        b.classList.add('wrong');
                        setTimeout(generateQuestion, 500);
                    }
                };
                optContainer.appendChild(b);
            });
        }

        generateQuestion();
    </script>
    <script src="student-drawer.js"></script>
</body>
</html>
