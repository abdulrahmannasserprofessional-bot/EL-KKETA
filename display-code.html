<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>كود الطالب - ELKHETA</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--bg); }
        .code-display { background: white; width: 90%; max-width: 400px; padding: 40px; border-radius: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.1); text-align: center; }
        .code-box { background: #F4F7FF; border: 2px dashed var(--primary); padding: 20px; border-radius: 20px; font-size: 32px; font-weight: bold; color: var(--primary); margin: 25px 0; letter-spacing: 5px; }
        .warning-text { color: #D63031; font-size: 13px; font-weight: bold; margin-bottom: 20px; }
    </style>
    
    <!-- Firebase Core & Instant Maintenance Guard -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    <link rel="stylesheet" href="motion-fx.css?v=3.0.0">
    <script src="motion-fx.js?v=3.0.0" defer></script>
    <script src="student-guard.js?v=3.0.0" defer></script>
    <link rel="stylesheet" href="desktop-theme.css?v=3.0.0">
    <link rel="stylesheet" href="desktop-theme.v3.css?v=3.0.0">
    <style id="elkheta-mobile-guard">
/* ═══════════════════════════════════════════════════════════════════════ */
/* 📱 BULLETPROOF 100% MOBILE & PHONE RESPONSIVE ENGINE (v3.0.0)          */
/* ═══════════════════════════════════════════════════════════════════════ */
@media (max-width: 992px) {
    html, body {
        width: 100% !important;
        max-width: 100vw !important;
        overflow-x: hidden !important;
        display: block !important;
        position: relative !important;
        padding-bottom: 75px !important;
        margin: 0 !important;
        padding-left: 0 !important;
        padding-right: 0 !important;
    }

    .student-app-container,
    .dashboard-container,
    .app-layout,
    .main-wrapper,
    .page-container,
    .content-wrapper,
    .layout-wrapper {
        display: block !important;
        width: 100% !important;
        max-width: 100vw !important;
        min-width: 0 !important;
        overflow-x: hidden !important;
        margin: 0 !important;
        padding: 0 !important;
    }

    /* Off-canvas Mobile Drawer for ALL Sidebars */
    .student-sidebar,
    .dashboard-sidebar,
    .admin-sidebar,
    aside.sidebar {
        position: fixed !important;
        top: 0 !important;
        right: -340px !important;
        left: auto !important;
        width: 290px !important;
        max-width: 85vw !important;
        height: 100vh !important;
        height: 100dvh !important;
        z-index: 999999 !important;
        background: #FFFFFF !important;
        box-shadow: -8px 0 35px rgba(0, 0, 0, 0.25) !important;
        transition: right 0.32s cubic-bezier(0.16, 1, 0.3, 1) !important;
        overflow-y: auto !important;
        padding: 22px 16px 90px !important;
        border-left: 2px solid #E8D3B2 !important;
        display: flex !important;
        flex-direction: column !important;
        justify-content: space-between !important;
    }

    .student-sidebar.mobile-open,
    .dashboard-sidebar.mobile-open,
    .admin-sidebar.mobile-open,
    aside.sidebar.mobile-open {
        right: 0 !important;
    }

    /* Main Stage 100% Fluid Width */
    .student-main-stage,
    .main-workspace-area,
    .main-content-flow,
    .dashboard-main,
    .main-content,
    .workspace-area,
    .content-area,
    main {
        width: 100% !important;
        max-width: 100vw !important;
        min-width: 0 !important;
        flex: none !important;
        display: block !important;
        padding: 12px 10px 90px !important;
        margin: 0 !important;
        box-sizing: border-box !important;
        overflow-x: hidden !important;
    }

    /* Header Bar */
    .top-header-bar,
    .header-bar,
    .dashboard-topbar {
        padding: 10px 12px !important;
        border-radius: 14px !important;
        display: flex !important;
        flex-wrap: wrap !important;
        gap: 10px !important;
        margin-bottom: 14px !important;
        width: 100% !important;
        justify-content: space-between !important;
        align-items: center !important;
        box-sizing: border-box !important;
    }

    .header-search-wrap {
        order: 2 !important;
        width: 100% !important;
        max-width: 100% !important;
        min-width: 0 !important;
        margin-top: 4px !important;
    }

    .header-actions-group {
        order: 1 !important;
        width: 100% !important;
        display: flex !important;
        justify-content: space-between !important;
        align-items: center !important;
    }

    /* Single Column Grids for Phone Screens */
    .middle-grid-row,
    .kpi-grid,
    .bento-grid,
    .courses-grid,
    .subjects-grid,
    .stats-row,
    .stats-grid,
    .profile-grid,
    .settings-grid,
    .lessons-grid,
    .cards-grid,
    .kpi-row,
    div[style*="grid-template-columns"] {
        grid-template-columns: 1fr !important;
        gap: 12px !important;
        width: 100% !important;
    }

    /* Hero Cards & Banners */
    .universal-hero-banner,
    .hero-banner-card,
    .doc-hero-card,
    .welcome-hero,
    .resume-learning-card {
        padding: 18px 14px !important;
        border-radius: 16px !important;
        display: flex !important;
        flex-direction: column !important;
        align-items: flex-start !important;
        gap: 10px !important;
        width: 100% !important;
        box-sizing: border-box !important;
    }

    .hero-banner-title {
        font-size: 19px !important;
        line-height: 1.3 !important;
    }

    .hero-banner-sub {
        font-size: 12px !important;
        line-height: 1.5 !important;
    }

    /* Floating Support Button */
    .floating-support-btn {
        bottom: 76px !important;
        left: 12px !important;
        padding: 10px !important;
        border-radius: 50% !important;
        z-index: 9998 !important;
    }
    .floating-text-box {
        display: none !important;
    }

    .table-container,
    .table-responsive,
    .audit-table-wrap {
        width: 100% !important;
        overflow-x: auto !important;
        -webkit-overflow-scrolling: touch !important;
        display: block !important;
    }

    .luxury-card,
    .card,
    .bento-card,
    .course-card,
    .lesson-card {
        padding: 16px 12px !important;
        border-radius: 16px !important;
        width: 100% !important;
        max-width: 100% !important;
        box-sizing: border-box !important;
    }

    .mobile-drawer-backdrop {
        position: fixed !important;
        top: 0 !important;
        left: 0 !important;
        right: 0 !important;
        bottom: 0 !important;
        background: rgba(15, 23, 42, 0.65) !important;
        backdrop-filter: blur(4px) !important;
        -webkit-backdrop-filter: blur(4px) !important;
        z-index: 999998 !important;
        opacity: 0 !important;
        pointer-events: none !important;
        transition: opacity 0.3s ease !important;
    }

    .mobile-drawer-backdrop.active {
        opacity: 1 !important;
        pointer-events: auto !important;
    }

    .universal-mobile-dock {
        position: fixed !important;
        bottom: 0 !important;
        left: 0 !important;
        right: 0 !important;
        height: 64px !important;
        background: rgba(255, 255, 255, 0.97) !important;
        backdrop-filter: blur(16px) !important;
        -webkit-backdrop-filter: blur(16px) !important;
        border-top: 1px solid #EFE8DC !important;
        display: flex !important;
        align-items: center !important;
        justify-content: space-around !important;
        padding: 0 4px !important;
        z-index: 99999 !important;
        box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.06) !important;
    }

    .mobile-dock-btn {
        display: flex !important;
        flex-direction: column !important;
        align-items: center !important;
        justify-content: center !important;
        gap: 3px !important;
        color: #8C827A !important;
        text-decoration: none !important;
        font-size: 10px !important;
        font-weight: 700 !important;
        flex: 1 !important;
        padding: 6px 0 !important;
        transition: all 0.2s ease !important;
    }

    .mobile-dock-btn i {
        font-size: 18px !important;
        transition: transform 0.2s ease !important;
    }

    .mobile-dock-btn.active {
        color: #C28B38 !important;
        font-weight: 900 !important;
    }

    .mobile-dock-btn.active i {
        transform: scale(1.15) !important;
        color: #C28B38 !important;
    }

    .mobile-hamburger-btn {
        display: inline-flex !important;
        align-items: center !important;
        justify-content: center !important;
        width: 38px !important;
        height: 38px !important;
        border-radius: 10px !important;
        background: #FDF4E6 !important;
        border: 1px solid #E8D3B2 !important;
        color: #C28B38 !important;
        font-size: 18px !important;
        cursor: pointer !important;
    }
}

@media (min-width: 993px) {
    .universal-mobile-dock { display: none !important; }
    .mobile-hamburger-btn { display: none !important; }
    .mobile-drawer-backdrop { display: none !important; }
}
</style>
</head>
<body>
    <div class="header-gradient" style="position: absolute; top: 0; left: 0; right: 0; height: 30vh; z-index: -1;"></div>
    <div class="code-display">
        <div style="font-size: 50px;">🎉</div>
        <h2 style="margin-top: 10px;">مبروك يا <span id="stName">طالب</span></h2>
        <p style="color: var(--text-sub);">تم إنشاء حسابك بنجاح. هذا هو كود الدخول الخاص بك:</p>

        <div class="code-box" id="stCode">KH0000</div>

        <button class="btn-primary" onclick="copyCode()" style="background: #FFF; color: var(--primary); border: 2px solid var(--primary); margin-bottom: 15px; width: 100%; height: 50px; border-radius: 12px; font-weight: bold; cursor: pointer;">📋 نسخ الكود</button>

        <p class="warning-text">⚠️ يرجى تصوير الشاشة أو حفظ الكود، لن تتمكن من رؤيته مرة أخرى!</p>

        <button class="btn-primary" onclick="location.href='home.html'">ابدأ رحلتك الآن 🚀</button>
    </div>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (user) {
            document.getElementById('stName').innerText = user.fullName;
            document.getElementById('stCode').innerText = user.studentCode;
        } else {
            window.location.href = "index.html";
        }

        function copyCode() {
            const code = document.getElementById('stCode').innerText;
            navigator.clipboard.writeText(code);
            alert("تم نسخ الكود بنجاح: " + code);
        }
    </script>
</body>
</html>
