<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>ELKHETA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-page:    #FAF7F2;
            --bg-surface: #FFFFFF;
            --border:     #EFE8DC;
            --gold:       #C28B38;
            --gold-grad:  linear-gradient(135deg,#D4973B 0%,#B88028 100%);
            --gold-light: #FDF4E6;
            --gold-border:#E8D3B2;
            --text-title: #1E293B;
            --text-body:  #475569;
            --text-muted: #8C827A;
            --shadow:     0 8px 32px rgba(180,140,75,0.13), 0 2px 8px rgba(0,0,0,0.04);
        }

        * { margin:0; padding:0; box-sizing:border-box; }

        body {
            background: var(--bg-page);
            font-family: 'Cairo', system-ui, sans-serif;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-app-region: drag;
            position: relative;
            border-radius: 20px;
        }

        /* الحد العلوي الذهبي */
        body::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: var(--gold-grad);
            border-radius: 20px 20px 0 0;
        }

        /* بقع ديكورية ناعمة */
        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(60px);
            pointer-events: none;
        }
        .blob-1 { width:260px; height:260px; background:rgba(212,151,59,0.12); top:-80px; left:-60px; }
        .blob-2 { width:200px; height:200px; background:rgba(194,139,56,0.08); bottom:-60px; right:-40px; }

        /* البطاقة */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 24px;
            box-shadow: var(--shadow);
            padding: 40px 52px 36px;
            text-align: center;
            width: 380px;
            position: relative;
            z-index: 10;
            animation: cardIn 0.5s cubic-bezier(0.34,1.56,0.64,1) both;
        }
        @keyframes cardIn {
            from { opacity:0; transform:translateY(18px) scale(0.97); }
            to   { opacity:1; transform:translateY(0)    scale(1); }
        }

        /* أيقونة التطبيق */
        .app-icon {
            width: 72px;
            height: 72px;
            border-radius: 20px;
            background: var(--gold-grad);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 18px;
            box-shadow: 0 6px 20px rgba(194,139,56,0.35);
            animation: floatIcon 3s ease-in-out infinite;
        }
        @keyframes floatIcon {
            0%,100% { transform:translateY(0); }
            50%      { transform:translateY(-5px); }
        }
        .app-icon svg { width:40px; height:40px; }

        /* اسم التطبيق */
        .brand-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            margin-bottom: 4px;
        }
        .brand-name {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-title);
            letter-spacing: -0.5px;
        }
        .brand-name span { color: var(--gold); }

        .brand-sub {
            font-size: 13px;
            font-weight: 700;
            color: var(--text-muted);
            margin-bottom: 28px;
        }

        /* شريط التقدم */
        .progress-track {
            width: 100%;
            height: 5px;
            background: var(--gold-light);
            border: 1px solid var(--gold-border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: var(--gold-grad);
            border-radius: 10px;
            transition: width 0.55s cubic-bezier(0.4,0,0.2,1);
            position: relative;
            overflow: hidden;
        }
        .progress-bar::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg,transparent 0%,rgba(255,255,255,0.5) 50%,transparent 100%);
            animation: shimmer 1.6s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%   { transform: translateX(-100%); }
            100% { transform: translateX(200%); }
        }

        /* السطر السفلي */
        .foot-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .status-text {
            font-size: 12px;
            font-weight: 700;
            color: var(--text-muted);
            transition: opacity 0.3s ease;
        }
        .version-badge {
            font-size: 10.5px;
            font-weight: 700;
            color: var(--gold);
            background: var(--gold-light);
            border: 1px solid var(--gold-border);
            border-radius: 20px;
            padding: 2px 10px;
        }

        /* نقاط تحميل */
        .dots { display:flex; gap:5px; margin-top:20px; justify-content:center; }
        .dot {
            width:6px; height:6px; border-radius:50%;
            background: var(--gold-border);
            animation: dotBounce 1.4s ease-in-out infinite;
        }
        .dot:nth-child(2){animation-delay:.2s}
        .dot:nth-child(3){animation-delay:.4s}
        @keyframes dotBounce {
            0%,80%,100%{ transform:scale(0.85); background:var(--gold-border); }
            40%         { transform:scale(1.3);  background:var(--gold); }
        }
    </style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>

    <div class="card">
        <!-- أيقونة -->
        <div class="app-icon">
            <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <filter id="g"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
                </defs>
                <!-- لوح القبعة -->
                <polygon points="20,5 36,13 20,21 4,13" fill="white" opacity="0.95" filter="url(#g)"/>
                <!-- قبة القبعة -->
                <ellipse cx="20" cy="25" rx="12" ry="5" fill="white" opacity="0.85"/>
                <!-- ساق -->
                <rect x="18.5" y="13" width="3" height="10" rx="1.5" fill="white" opacity="0.7"/>
                <!-- شرابة -->
                <line x1="21.5" y1="16" x2="28" y2="14.5" stroke="#FCD34D" stroke-width="2" stroke-linecap="round"/>
                <circle cx="29" cy="14" r="3" fill="#FCD34D" filter="url(#g)"/>
                <circle cx="29" cy="14" r="1.6" fill="#FFFBEB"/>
            </svg>
        </div>

        <!-- الاسم -->
        <div class="brand-row">
            <div class="brand-name">EL<span>KHETA</span>.</div>
        </div>
        <div class="brand-sub">منصة الخطة التعليمية</div>

        <!-- شريط التقدم -->
        <div class="progress-track">
            <div class="progress-bar" id="pBar"></div>
        </div>

        <!-- السطر السفلي -->
        <div class="foot-row">
            <span class="status-text" id="sLabel">جاري تهيئة المنصة...</span>
            <span class="version-badge">v2.0.0</span>
        </div>

        <!-- نقاط -->
        <div class="dots">
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>
    </div>

    <script>
        const steps = [
            { label: 'جاري تهيئة المنصة...',           pct: 15 },
            { label: 'مزامنة المحاضرات والمواد...',     pct: 40 },
            { label: 'تحميل بنك الأسئلة الذكية...',    pct: 68 },
            { label: 'التحقق من الحساب...',             pct: 88 },
            { label: 'جاهز! أهلاً بك ✨',              pct: 100 },
        ];
        const pBar  = document.getElementById('pBar');
        const sLabel = document.getElementById('sLabel');
        let i = 0;
        function tick() {
            if (i >= steps.length) return;
            pBar.style.width  = steps[i].pct + '%';
            sLabel.textContent = steps[i].label;
            if (++i < steps.length) setTimeout(tick, 600);
        }
        setTimeout(tick, 400);
    </script>
</body>
</html>
